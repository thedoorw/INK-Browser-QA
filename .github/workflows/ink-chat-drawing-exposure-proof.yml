name: INK CHAT Drawing Exposure Proof

on:
  push:
    branches:
      - work/chat-drawing-exposure-001
    paths:
      - qa/live-chat/INK_CHAT_DRAWING_EXPOSURE_TRIGGER.json

permissions:
  contents: write

concurrency:
  group: ink-chat-drawing-exposure-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check product/source/src/editor/chat-bounded-edit.js
          node --check product/source/src/agent/capability-registry.js
          node --check qa/live-chat/run-local-drawing-exposure-proof.mjs

      - name: Run local browser proof
        run: |
          node qa/live-chat/run-local-drawing-exposure-proof.mjs . "${{ runner.temp }}/INK_CHAT_DRAWING_EXPOSURE_PROOF.json" "${{ runner.temp }}/INK_CHAT_DRAWING_EXPOSURE_PROOF.png"

      - name: Publish proof JSON to branch
        if: always()
        uses: actions/github-script@v7
        env:
          PROOF_PATH: ${{ runner.temp }}/INK_CHAT_DRAWING_EXPOSURE_PROOF.json
        with:
          script: |
            const fs = require('node:fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const path = 'working/INK_CHAT_DRAWING_EXPOSURE_PROOF.json';
            let proof;
            try {
              proof = JSON.parse(fs.readFileSync(process.env.PROOF_PATH, 'utf8'));
            } catch (error) {
              proof = { schema:'INK-CHAT-DRAWING-EXPOSURE-PROOF', version:1, status:'FAIL', error:'Proof file unavailable: '+error.message };
            }
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner,repo,path,ref:branch});
              if(!Array.isArray(current.data)) sha = current.data.sha;
            } catch(error) {
              if(error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch,
              message:'qa(chat): record drawing exposure proof',
              content:Buffer.from(JSON.stringify(proof,null,2)+'\n').toString('base64'),
              ...(sha?{sha}:{})
            });

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-chat-drawing-exposure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/INK_CHAT_DRAWING_EXPOSURE_PROOF.json
            ${{ runner.temp }}/INK_CHAT_DRAWING_EXPOSURE_PROOF.png
          if-no-files-found: warn
          retention-days: 30

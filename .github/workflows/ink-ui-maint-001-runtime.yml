name: INK-UI-MAINT-001 Windows Runtime

on:
  push:
    branches:
      - work/ink-ui-maint-001

permissions:
  contents: read

concurrency:
  group: ink-ui-maint-001-windows-runtime
  cancel-in-progress: true

jobs:
  runtime-batch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Materialize exact pushed revision
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const { owner, repo } = context.repo;
            const sha = context.sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid exact SHA');
            const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
            if (commit.sha !== sha) throw new Error('Exact SHA resolution mismatch');
            const { data: tree } = await github.rest.git.getTree({ owner, repo, tree_sha: commit.commit.tree.sha, recursive: '1' });
            if (tree.truncated) throw new Error('Refuse incomplete Git tree');
            const root = await fs.mkdtemp(path.join(process.env.RUNNER_TEMP, 'ink-ui-maint-001-'));
            core.exportVariable('INK_BATCH_ROOT', root);
            core.setOutput('root', root);
            core.setOutput('sha', sha);
            core.exportVariable('INK_TESTED_SHA', sha);
            core.exportVariable('INK_WORKFLOW_SHA', context.sha);
            const exact = new Set([
              'qa/runtime/run-ink-runtime-batch.mjs',
              'qa/runtime/ink-web-ui-001-harness.html',
              'qa/runtime/ink-cloud-018-browser-harness.html',
              'qa/runtime/ink-ra-001-browser-harness.html',
              'qa/core/tests/unit/contextual-tool-options-v0.1.test.mjs',
              'qa/core/tests/unit/panel-chat-polish-v0.1.test.mjs',
              'qa/core/tests/unit/final-ui-responsive-regression-v0.1.test.mjs',
              'qa/core/tests/unit/shared-portable-web-shell-parity-v0.1.test.mjs',
              'qa/core/tests/unit/photoshop-shell-geometry-v0.1.test.mjs',
              'qa/fixtures/rose-window/rose-window-primary.png'
            ]);
            const files = tree.tree.filter(item => item.path.startsWith('product/source/') || exact.has(item.path));
            const paths = new Set(files.map(item => item.path));
            for (const required of [...exact, 'product/source/index.html', 'product/source/index-standalone.html']) {
              if (!paths.has(required)) throw new Error('Missing runtime input: ' + required);
            }
            let cursor = 0;
            await Promise.all(Array.from({ length: 4 }, async () => {
              while (cursor < files.length) {
                const item = files[cursor++];
                if (item.type === 'tree') continue;
                if (item.type !== 'blob' || !['100644', '100755'].includes(item.mode)) throw new Error('Non-file input: ' + item.path);
                if (item.path.split('/').some(part => !part || part === '.' || part === '..') || /[\\:\0]/.test(item.path)) throw new Error('Unsafe Git path');
                const { data } = await github.rest.git.getBlob({ owner, repo, file_sha: item.sha });
                if (data.encoding !== 'base64') throw new Error('Unsupported blob encoding: ' + item.path);
                const bytes = Buffer.from(data.content, 'base64');
                const hash = crypto.createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
                if (hash !== item.sha) throw new Error('Blob integrity failure: ' + item.path);
                const dest = path.join(root, item.path);
                await fs.mkdir(path.dirname(dest), { recursive: true });
                await fs.writeFile(dest, bytes);
              }
            }));
            await fs.mkdir(path.join(root, 'evidence'));
            await fs.writeFile(path.join(root, 'evidence', 'revision.json'), JSON.stringify({
              testedSha: sha,
              workflowSha: context.sha,
              files: files.filter(f => f.type === 'blob').map(f => ({ path: f.path, sha: f.sha }))
            }, null, 2));

      - name: Execute UI static and browser Runtime
        uses: actions/github-script@v7
        with:
          script: |
            const { spawn } = require('node:child_process');
            const path = require('node:path');
            const root = process.env.INK_BATCH_ROOT;
            const staticTests = [
              'contextual-tool-options-v0.1.test.mjs',
              'panel-chat-polish-v0.1.test.mjs',
              'final-ui-responsive-regression-v0.1.test.mjs',
              'shared-portable-web-shell-parity-v0.1.test.mjs',
              'photoshop-shell-geometry-v0.1.test.mjs'
            ].map(file => path.join(root, 'qa/core/tests/unit', file));
            await new Promise((resolve, reject) => {
              const child = spawn(process.execPath, ['--test', ...staticTests], {
                cwd: root, stdio: 'inherit', shell: false, windowsHide: true
              });
              child.once('error', reject);
              child.once('exit', (code, signal) => code === 0 ? resolve() : reject(new Error('Static UI tests failed: code=' + code + ' signal=' + signal)));
            });
            await new Promise((resolve, reject) => {
              const child = spawn(process.execPath, [path.join(root, 'qa/runtime/run-ink-runtime-batch.mjs'), root], {
                cwd: root, stdio: 'inherit', shell: false, windowsHide: true
              });
              child.once('error', reject);
              child.once('exit', (code, signal) => code === 0 ? resolve() : reject(new Error('Runtime batch failed: code=' + code + ' signal=' + signal)));
            });

      - name: Preserve exact-revision evidence
        if: always() && steps.source.outputs.root != ''
        uses: actions/upload-artifact@v4
        with:
          name: ink-ui-maint-001-${{ steps.source.outputs.sha }}-${{ github.run_id }}
          path: ${{ steps.source.outputs.root }}/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary source
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const root = process.env.INK_BATCH_ROOT;
            if (root && path.dirname(root) === path.resolve(process.env.RUNNER_TEMP) && path.basename(root).startsWith('ink-ui-maint-001-')) {
              await fs.rm(root, { recursive: true, force: true, maxRetries: 3 });
            }

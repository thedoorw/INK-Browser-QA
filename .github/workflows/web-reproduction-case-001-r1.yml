name: Web Reproduction CASE-001 Smoke

on:
  push:
    branches:
      - work/web-reproduction-production-line-001
    paths:
      - engineering/web-reproduction/**
      - research/INK_WEB_REPRODUCTION_PRODUCTION_LINE_v0.1.md
      - working/INK_WEB_REPRODUCTION_CASE_001_THE_MINIMALISTS_WORK_ORDER_v0.1.md
      - .github/workflows/web-reproduction-case-001-r1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-reproduction-case-001
  cancel-in-progress: true

jobs:
  census-capture:
    name: Smoke census, classify, capture The Minimalists
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: engineering/web-reproduction

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run site census
        run: npm run census -- --config config/case-001-smoke.json

      - name: Classify page families
        run: npm run classify -- --config config/case-001-smoke.json

      - name: Capture representative viewports
        run: npm run capture -- --config config/case-001-smoke.json

      - name: Upload reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: web-reproduction-case-001-r1
          path: engineering/web-reproduction/artifacts/case-001-smoke
          if-no-files-found: error
          retention-days: 3

      - name: Publish sanitized JSON evidence to branch
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          SRC="engineering/web-reproduction/artifacts/case-001-smoke"
          DEST="qa/evidence/web-reproduction/case-001-smoke/$GITHUB_SHA"
          mkdir -p "$DEST"
          while IFS= read -r -d '' file; do
            rel="${file#"$SRC/"}"
            mkdir -p "$DEST/$(dirname "$rel")"
            cp "$file" "$DEST/$rel"
          done < <(find "$SRC" -type f -name '*.json' -print0)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "No JSON evidence to publish"
            exit 0
          fi
          git commit -m "qa(web): record CASE-001 smoke evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"

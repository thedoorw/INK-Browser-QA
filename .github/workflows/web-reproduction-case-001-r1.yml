name: Web Reproduction CASE-001 Census Smoke

on:
  push:
    branches:
      - work/web-reproduction-production-line-001
    paths:
      - engineering/web-reproduction/package.json
      - engineering/web-reproduction/src/census.mjs
      - engineering/web-reproduction/src/classify.mjs
      - engineering/web-reproduction/config/case-001-smoke.json
      - .github/workflows/web-reproduction-case-001-r1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-reproduction-case-001-census-smoke
  cancel-in-progress: true

jobs:
  census-classify:
    name: Smoke census and classify The Minimalists
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: engineering/web-reproduction

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run site census
        run: npm run census -- --config config/case-001-smoke.json

      - name: Classify page families
        run: npm run classify -- --config config/case-001-smoke.json

      - name: Upload census evidence
        uses: actions/upload-artifact@v4
        with:
          name: web-reproduction-case-001-census-smoke
          path: |
            engineering/web-reproduction/artifacts/case-001-smoke/census
            engineering/web-reproduction/artifacts/case-001-smoke/families
          if-no-files-found: error
          retention-days: 3

      - name: Publish sanitized JSON evidence to branch
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          SRC="engineering/web-reproduction/artifacts/case-001-smoke"
          DEST="qa/evidence/web-reproduction/case-001-census-smoke/$GITHUB_SHA"
          mkdir -p "$DEST"
          for part in census families; do
            if [ -d "$SRC/$part" ]; then
              mkdir -p "$DEST/$part"
              find "$SRC/$part" -type f -name '*.json' -exec cp {} "$DEST/$part/" \;
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "No JSON evidence to publish"
            exit 0
          fi
          git commit -m "qa(web): record CASE-001 census smoke evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"

name: Web Reproduction CASE-001 R1

on:
  push:
    branches:
      - work/web-reproduction-production-line-001
    paths:
      - engineering/web-reproduction/**
      - research/INK_WEB_REPRODUCTION_PRODUCTION_LINE_v0.1.md
      - working/INK_WEB_REPRODUCTION_CASE_001_THE_MINIMALISTS_WORK_ORDER_v0.1.md
      - .github/workflows/web-reproduction-case-001-r1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census-capture:
    name: Census, classify, capture The Minimalists
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: engineering/web-reproduction

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run site census
        run: npm run census -- --config config/case-001.json

      - name: Classify page families
        run: npm run classify -- --config config/case-001.json

      - name: Capture representative viewports
        run: npm run capture -- --config config/case-001.json

      - name: Upload reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: web-reproduction-case-001-r1
          path: engineering/web-reproduction/artifacts/case-001
          if-no-files-found: error
          retention-days: 3

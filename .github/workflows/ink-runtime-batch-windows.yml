name: INK Central Windows Runtime Batch

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Advanced/debug override; leave blank to test current main'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths: [ACTIVE/INK_RUNTIME_QUEUE.json]

permissions:
  contents: read

concurrency:
  group: ink-runtime-batch-windows
  cancel-in-progress: false

jobs:
  controller:
    name: Resolve and gate exact Runtime target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_runtime: ${{ steps.target.outputs.run_runtime }}
      target_sha: ${{ steps.target.outputs.target_sha }}
      requested_ref: ${{ steps.target.outputs.requested_ref }}
      dispatch_source: ${{ steps.target.outputs.dispatch_source }}
      queue_state: ${{ steps.target.outputs.queue_state }}
    steps:
      - name: Resolve manual or queued target once
        id: target
        uses: actions/github-script@v7
        env:
          INK_MANUAL_TARGET_REF: ${{ inputs.target_ref || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const exactSha = /^[a-f0-9]{40}$/;
            const manualRef = (process.env.INK_MANUAL_TARGET_REF || '').trim();
            const emit = ({ run, sha = '', requested = '', source, state }) => {
              core.setOutput('run_runtime', run ? 'true' : 'false');
              core.setOutput('target_sha', sha);
              core.setOutput('requested_ref', requested);
              core.setOutput('dispatch_source', source);
              core.setOutput('queue_state', state);
            };

            if (context.eventName === 'workflow_dispatch') {
              if (/[\r\n\0]/.test(manualRef)) throw new Error('Invalid target_ref override');
              let sha;
              let requested;
              let source;
              if (manualRef) {
                const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: manualRef });
                sha = commit.sha;
                requested = manualRef;
                source = 'manual-override';
              } else {
                const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
                sha = branch.commit.sha;
                requested = 'main';
                source = 'manual-main';
              }
              if (!exactSha.test(sha)) throw new Error('Manual target did not resolve to an exact SHA');
              emit({ run: true, sha, requested, source, state: 'MANUAL' });
              return;
            }

            if (context.eventName !== 'push' || context.ref !== 'refs/heads/main') {
              throw new Error(`Unsupported Runtime controller event: ${context.eventName} ${context.ref}`);
            }
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path: 'ACTIVE/INK_RUNTIME_QUEUE.json', ref: context.sha });
            if (Array.isArray(file) || file.type !== 'file' || file.encoding !== 'base64') {
              throw new Error('Runtime queue must be one base64-encoded file');
            }
            const queue = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const states = new Set(['IDLE', 'ACCUMULATING', 'READY', 'RUNNING', 'PASS', 'FAIL']);
            if (queue.schema !== 'ink-runtime-queue' || queue.version !== 1 || !states.has(queue.state)) {
              throw new Error('Unsupported Runtime queue schema/version/state');
            }
            if (!Array.isArray(queue.pending_work_orders) || !Array.isArray(queue.covered_work_orders)) {
              throw new Error('Runtime queue Work Order lists must be arrays');
            }
            if (new Set(queue.pending_work_orders).size !== queue.pending_work_orders.length ||
                queue.pending_work_orders.some(id => typeof id !== 'string' || !id.trim())) {
              throw new Error('Runtime queue pending Work Order IDs must be unique non-empty strings');
            }
            const policy = queue.batch_policy || {};
            if (policy.default_target !== 3 || policy.allowed_min !== 2 || policy.allowed_max !== 4) {
              throw new Error('Runtime queue batch policy must remain default 3, allowed 2-4');
            }
            const highRisk = queue.high_risk || {};
            if (typeof highRisk.enabled !== 'boolean' ||
                (highRisk.enabled && (typeof highRisk.reason !== 'string' || !highRisk.reason.trim()))) {
              throw new Error('High-risk immediate Runtime requires an explicit reason');
            }
            if (queue.state !== 'READY') {
              emit({ run: false, source: 'queue', state: queue.state });
              core.notice(`Runtime queue state ${queue.state}; Windows job not started.`);
              return;
            }
            if (!exactSha.test(queue.target_sha || '')) {
              throw new Error('READY Runtime queue requires an exact 40-character target_sha');
            }
            const count = queue.pending_work_orders.length;
            if (count > policy.allowed_max || (!highRisk.enabled && count < policy.allowed_min) ||
                (highRisk.enabled && count < 1)) {
              throw new Error('READY Runtime queue does not satisfy bounded batch/high-risk policy');
            }
            const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: queue.target_sha });
            if (commit.sha !== queue.target_sha) throw new Error('Queue target SHA did not resolve exactly');
            emit({ run: true, sha: queue.target_sha, requested: queue.target_sha, source: 'queue', state: queue.state });

  runtime-batch:
    name: Execute exact-SHA Windows browser batch
    needs: controller
    if: needs.controller.outputs.run_runtime == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      # Git-free, bounded materialization; no shell or executable archive extraction.
      - name: Materialize pinned exact revision
        id: source
        uses: actions/github-script@v7
        env:
          INK_TARGET_SHA: ${{ needs.controller.outputs.target_sha }}
          INK_REQUESTED_REF: ${{ needs.controller.outputs.requested_ref }}
          INK_DISPATCH_SOURCE: ${{ needs.controller.outputs.dispatch_source }}
          INK_QUEUE_STATE: ${{ needs.controller.outputs.queue_state }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const { owner, repo } = context.repo;
            const sha = process.env.INK_TARGET_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Pinned exact target SHA required');
            const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
            if (commit.sha !== sha) throw new Error('Pinned target SHA changed during materialization');
            const { data: tree } = await github.rest.git.getTree({ owner, repo, tree_sha: commit.commit.tree.sha, recursive: '1' });
            if (tree.truncated) throw new Error('Refuse incomplete Git tree');
            const root = await fs.mkdtemp(path.join(process.env.RUNNER_TEMP, 'ink-batch-'));
            core.exportVariable('INK_BATCH_ROOT', root);
            core.setOutput('root', root);
            core.setOutput('sha', sha);
            core.exportVariable('INK_TESTED_SHA', sha);
            core.exportVariable('INK_WORKFLOW_SHA', context.sha);
            const exact = new Set([
              'qa/runtime/run-ink-runtime-batch.mjs',
              'qa/runtime/ink-web-ui-001-harness.html',
              'qa/runtime/ink-tech-closure-001-browser-harness.html',
              'qa/runtime/ink-ra-001-browser-harness.html',
              'qa/runtime/ink-cloud-018-browser-harness.html',
              'qa/ink-chat-geometry-ops-001.test.mjs',
              'qa/ink-tech-closure-001-c2a.test.mjs',
              'qa/ink-tech-closure-001-c2b.test.mjs',
              'qa/ink-tech-closure-001-c2c.test.mjs',
              'qa/ink-tech-closure-001-final-runtime-prep.test.mjs',
              'qa/ink-tech-closure-001-runtime-fix.test.mjs',
              'qa/ink-connector-005-creative-library-search.test.mjs',
              'qa/ink-p0-restore-all-001-focused.test.mjs',
              'qa/chat-validation-001-reference-handoff.test.mjs',
              'qa/core-mod-006-creative-memory.test.mjs',
              'qa/fixtures/rose-window/rose-window-primary.png'
            ]);
            const files = tree.tree.filter(item => item.path.startsWith('product/source/') || exact.has(item.path));
            const paths = new Set(files.map(item => item.path));
            for (const required of [...exact, 'product/source/index.html', 'product/source/index-standalone.html']) {
              if (!paths.has(required)) throw new Error(`Missing runtime input: ${required}`);
            }
            let cursor = 0;
            await Promise.all(Array.from({ length: 4 }, async () => {
              while (cursor < files.length) {
                const item = files[cursor++];
                if (item.type === 'tree') continue;
                if (item.type !== 'blob' || !['100644', '100755'].includes(item.mode)) throw new Error(`Non-file input: ${item.path}`);
                if (item.path.split('/').some(part => !part || part === '.' || part === '..') || /[\\:\0]/.test(item.path)) throw new Error('Unsafe Git path');
                const { data } = await github.rest.git.getBlob({ owner, repo, file_sha: item.sha });
                if (data.encoding !== 'base64') throw new Error(`Unsupported blob encoding: ${item.path}`);
                const bytes = Buffer.from(data.content, 'base64');
                const hash = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
                if (hash !== item.sha) throw new Error(`Blob integrity failure: ${item.path}`);
                const dest = path.join(root, item.path);
                await fs.mkdir(path.dirname(dest), { recursive: true });
                await fs.writeFile(dest, bytes);
              }
            }));
            await fs.mkdir(path.join(root, 'evidence'));
            await fs.writeFile(path.join(root, 'evidence', 'revision.json'), JSON.stringify({
              requestedRef: process.env.INK_REQUESTED_REF,
              testedSha: sha,
              workflowSha: context.sha,
              dispatchSource: process.env.INK_DISPATCH_SOURCE,
              queueState: process.env.INK_QUEUE_STATE,
              files: files.filter(f => f.type === 'blob').map(f => ({ path: f.path, sha: f.sha }))
            }, null, 2));
            await core.summary.addHeading('INK central Runtime batch').addRaw(`Tested SHA: ${sha}\n\nWorkflow SHA: ${context.sha}\n\nDispatch: ${process.env.INK_DISPATCH_SOURCE}\n\nRuntime result follows; materialization alone is not a PASS.\n`).write();

      - name: Execute Closure focused contract tests
        uses: actions/github-script@v7
        with:
          script: |
            const { spawn } = require('node:child_process');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const root = process.env.INK_BATCH_ROOT;
            const tests = [
              'qa/ink-chat-geometry-ops-001.test.mjs',
              'qa/ink-tech-closure-001-c2a.test.mjs',
              'qa/ink-tech-closure-001-c2b.test.mjs',
              'qa/ink-tech-closure-001-c2c.test.mjs',
              'qa/ink-tech-closure-001-final-runtime-prep.test.mjs',
              'qa/ink-tech-closure-001-runtime-fix.test.mjs',
              'qa/ink-connector-005-creative-library-search.test.mjs',
              'qa/ink-p0-restore-all-001-focused.test.mjs',
              'qa/core-mod-002-semantic-region.test.mjs',
              'qa/chat-validation-001-reference-handoff.test.mjs',
              'qa/core-mod-006-creative-memory.test.mjs'
            ].map(file => path.join(root, file));
            const runChild = (args, label) => new Promise((resolve, reject) => {
              const child = spawn(process.execPath, args, {
                cwd: root, stdio: 'inherit', shell: false, windowsHide: true
              });
              child.once('error', reject);
              child.once('exit', (code, signal) => code === 0 ? resolve() : reject(new Error(`${label} failed: code=${code} signal=${signal}`)));
            });
            await runChild(['--test', ...tests], 'Closure focused tests');
            const polygonUmd = path.join(root, 'product/source/src/vendor/polygon-clipping.umd.min.js');
            const semanticUrl = pathToFileURL(path.join(root, 'qa/core-mod-002-semantic-region.test.mjs')).href;
            const semanticBootstrap = `globalThis.polygonClipping=require(${JSON.stringify(polygonUmd)});import(${JSON.stringify(semanticUrl)}).catch(error=>{console.error(error);process.exit(1);});`;
            await runChild(['-e', semanticBootstrap], 'Semantic region preload test');

      - name: Execute bounded browser batch
        uses: actions/github-script@v7
        with:
          script: |
            const { spawn } = require('node:child_process');
            const path = require('node:path');
            const root = process.env.INK_BATCH_ROOT;
            await new Promise((resolve, reject) => {
              const child = spawn(process.execPath, [path.join(root, 'qa/runtime/run-ink-runtime-batch.mjs'), root], {
                cwd: root, stdio: 'inherit', shell: false, windowsHide: true
              });
              child.once('error', reject);
              child.once('exit', (code, signal) => code === 0 ? resolve() : reject(new Error(`Runtime batch failed: code=${code} signal=${signal}`)));
            });

      - name: Preserve exact-revision evidence
        if: always() && steps.source.outputs.root != ''
        uses: actions/upload-artifact@v4
        with:
          name: ink-runtime-batch-${{ steps.source.outputs.sha }}-${{ github.run_id }}
          path: ${{ steps.source.outputs.root }}/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove this run's temporary source
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const root = process.env.INK_BATCH_ROOT;
            if (root && path.dirname(root) === path.resolve(process.env.RUNNER_TEMP) && path.basename(root).startsWith('ink-batch-')) {
              await fs.rm(root, { recursive: true, force: true, maxRetries: 3 });
            }

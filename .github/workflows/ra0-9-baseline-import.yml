name: RA0.9 Baseline ZIP Import

on:
  push:
    branches: [main]
    paths:
      - 'reference/RA0_9_baseline/incoming/*.zip'
      - '.github/workflows/ra0-9-baseline-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-ra-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Import RA baseline
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand 

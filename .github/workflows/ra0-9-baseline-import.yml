name: RA0.9 Baseline ZIP Import

on:
  push:
    branches: [main]
    paths:
      - 'reference/RA0_9_baseline/incoming/*.zip'
      - '.github/workflows/ra0-9-baseline-import.yml'
      - 'reference/RA0_9_baseline/incoming/RETRY_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-ra-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Prepare trusted ZIP input
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\ra0_9_extract" rmdir /s /q "%RUNNER_TEMP%\ra0_9_extract"
          if exist "%RUNNER_TEMP%\ra0_9.zip" del /q "%RUNNER_TEMP%\ra0_9.zip"
          mkdir "%RUNNER_TEMP%\ra0_9_extract"
          curl.exe -fL "https://raw.githubusercontent.com/%GITHUB_REPOSITORY%/main/reference/RA0_9_baseline/incoming/RA0_9_AI_Review_Mode_Current_Baseline_v1.0.zip" -o "%RUNNER_TEMP%\ra0_9.zip"

      - name: Extract ZIP with bounded local PowerShell
        shell: cmd
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "Add-Type -AssemblyName System.IO.Compression.FileSystem; [System.IO.Compression.ZipFile]::ExtractToDirectory('%RUNNER_TEMP%\ra0_9.zip','%RUNNER_TEMP%\ra0_9_extract')"

      - name: Commit extracted baseline with GitHub API
        uses: actions/github-script@v7
        env:
          EXPECTED_ZIP_SHA256: 525fdff89305135eedebde4fa039517040220724fdee8e557a3d5a2ad5add1d4
          EXPECTED_FILE_COUNT: '158'
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const zipPath = path.join(process.env.RUNNER_TEMP, 'ra0_9.zip');
            const extractRoot = path.join(process.env.RUNNER_TEMP, 'ra0_9_extract');
            const sourcePrefix = 'reference/RA0_9_baseline/source';
            const incomingZip = 'reference/RA0_9_baseline/incoming/RA0_9_AI_Review_Mode_Current_Baseline_v1.0.zip';

            const zipBytes = fs.readFileSync(zipPath);
            const zipSha = crypto.createHash('sha256').update(zipBytes).digest('hex');
            if (zipSha !== process.env.EXPECTED_ZIP_SHA256) {
              core.setFailed(`ZIP SHA256 mismatch: ${zipSha}`);
              return;
            }

            function walk(dir) {
              const out = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) out.push(...walk(full));
                else if (entry.isFile()) out.push(full);
              }
              return out;
            }

            const files = walk(extractRoot).sort();
            const expectedCount = Number(process.env.EXPECTED_FILE_COUNT);
            if (files.length !== expectedCount) {
              core.setFailed(`Extracted file count mismatch: ${files.length} != ${expectedCount}`);
              return;
            }

            const extractedBytes = files.reduce((sum, p) => sum + fs.statSync(p).size, 0);
            core.info(`Verified ZIP SHA256: ${zipSha}`);
            core.info(`Extracted files: ${files.length}`);
            core.info(`Extracted bytes: ${extractedBytes}`);

            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const headSha = ref.data.object.sha;
            const headCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: headSha });
            const baseTree = headCommit.data.tree.sha;

            const tree = [];
            let index = 0;
            for (const file of files) {
              index += 1;
              const rel = path.relative(extractRoot, file).split(path.sep).join('/');
              const content = fs.readFileSync(file).toString('base64');
              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content,
                encoding: 'base64'
              });
              tree.push({
                path: `${sourcePrefix}/${rel}`,
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha
              });
              if (index % 20 === 0 || index === files.length) {
                core.info(`Prepared blobs: ${index}/${files.length}`);
              }
            }

            const importedAt = new Date().toISOString();
            const manifest = [
              '# RA0.9 Baseline Import Manifest',
              '',
              'Status: IMPORTED_REFERENCE_BASELINE',
              '',
              '- Source ZIP: RA0_9_AI_Review_Mode_Current_Baseline_v1.0.zip',
              `- ZIP SHA256: ${zipSha}`,
              `- ZIP bytes: ${zipBytes.length}`,
              `- Extracted file count: ${files.length}`,
              `- Extracted bytes: ${extractedBytes}`,
              `- Imported at UTC: ${importedAt}`,
              '- Import workflow: .github/workflows/ra0-9-baseline-import.yml',
              '',
              'This baseline is reference material only and is not authoritative INK product source.'
            ].join('\n');

            const manifestBlob = await github.rest.git.createBlob({
              owner,
              repo,
              content: Buffer.from(manifest, 'utf8').toString('base64'),
              encoding: 'base64'
            });

            tree.push({
              path: 'reference/RA0_9_baseline/IMPORT_MANIFEST.md',
              mode: '100644',
              type: 'blob',
              sha: manifestBlob.data.sha
            });

            const newTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseTree,
              tree
            });

            const newCommit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'Reference: import RA0.9 accepted baseline',
              tree: newTree.data.sha,
              parents: [headSha]
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/main',
              sha: newCommit.data.sha,
              force: false
            });

            core.notice(`RA baseline imported at commit ${newCommit.data.sha}`);

      - name: Local cleanup
        if: always()
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\ra0_9_extract" rmdir /s /q "%RUNNER_TEMP%\ra0_9_extract"
          if exist "%RUNNER_TEMP%\ra0_9.zip" del /q "%RUNNER_TEMP%\ra0_9.zip"

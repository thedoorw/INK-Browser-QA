name: INK Core Spatial Index Lasso Repair

on:
  push:
    branches: [work/core-spatial-index-lasso-repair-001]
    paths:
      - product/source/src/ink.js
      - qa/runtime/run-ink-core-spatial-index-lasso-repair.mjs
      - .github/workflows/ink-core-spatial-index-lasso-repair.yml

permissions:
  contents: write

concurrency:
  group: ink-core-spatial-index-lasso-repair
  cancel-in-progress: false

jobs:
  focused-browser-evidence:
    name: Focused spatial-index lifecycle browser evidence
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify focused runner syntax
        shell: pwsh
        run: node --check qa/runtime/run-ink-core-spatial-index-lasso-repair.mjs

      - name: Run focused browser evidence
        shell: pwsh
        run: node qa/runtime/run-ink-core-spatial-index-lasso-repair.mjs .

      - name: Upload focused evidence
        uses: actions/upload-artifact@v4
        with:
          name: ink-core-spatial-index-lasso-${{ github.sha }}
          path: qa/evidence/ink-core-spatial-index-lasso-repair-*/
          if-no-files-found: error
          retention-days: 30

      - name: Commit evidence, DEV return, and retire task workflow
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 12)
          $evidenceDir = "qa/evidence/ink-core-spatial-index-lasso-repair-$short"
          $reportPath = Join-Path $evidenceDir "spatial-index-browser.json"
          $pngPath = Join-Path $evidenceDir "shape-lasso-pass.png"
          if (!(Test-Path $reportPath) -or !(Test-Path $pngPath)) {
            throw "Focused evidence files are missing"
          }

          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          $total = @($report.checks).Count
          $passed = @($report.checks | Where-Object { $_.pass -eq $true }).Count
          if ($report.status -ne "PASS" -or $passed -ne $total -or $total -eq 0) {
            throw "Focused evidence did not PASS: status=$($report.status) passed=$passed total=$total"
          }
          if ($report.targetSha -ne $env:GITHUB_SHA) {
            throw "Evidence target SHA mismatch: $($report.targetSha) != $env:GITHUB_SHA"
          }
          if ($report.formatVersion -ne 4) {
            throw "FORMAT_VERSION drifted: $($report.formatVersion)"
          }

          function Get-Step([string]$label) {
            return @($report.lifecycle | Where-Object { $_.label -eq $label })[0]
          }

          $shapeCreated = Get-Step "shape-created-before-query"
          $shapeLasso = Get-Step "shape-lasso-native-query"
          $strokeCreated = Get-Step "stroke-created-before-query"
          $strokeIndexed = Get-Step "stroke-created-indexed"
          $duplicateIndexed = Get-Step "duplicate-indexed"
          $deleteIndexed = Get-Step "delete-indexed"
          $undoDelete = Get-Step "delete-undo-indexed"
          $redoDelete = Get-Step "delete-redo-indexed"
          $groupIndexed = Get-Step "group-indexed"
          $frameIndexed = Get-Step "frame-indexed"
          $page1 = Get-Step "initial-empty-index"
          $page2 = Get-Step "page2-empty-indexed"
          $page2Shape = Get-Step "page2-shape-indexed"
          $switchBack = Get-Step "switch-back-page1-indexed"
          $switchPage2 = Get-Step "switch-page2-indexed"

          $shapeId = [string]$shapeCreated.pending[0]
          $strokeId = [string]$strokeCreated.pending[0]
          $copyId = [string]$duplicateIndexed.selection[0]
          $groupId = [string]$groupIndexed.selection[0]
          $frameId = [string]$frameIndexed.selection[0]
          $page2ObjectId = [string]$page2Shape.indexIds[0]

          $returnPath = "working/INK_CORE_SPATIAL_INDEX_LASSO_REPAIR_DEV_RETURN_20261002.md"
          $lines = @(
            "# INK Core Spatial Index / Lasso Consistency — DEV Return 2026-10-02",
            "",
            "STATUS: FOCUSED_BROWSER_PASS / READY_FOR_CORE_SUPERVISOR_REVIEW",
            "",
            "Repository: `thedoorw/INK-Browser-QA`",
            "Branch: `work/core-spatial-index-lasso-repair-001`",
            "Baseline: `a9d122ccba14734caf6220a53044545494a8429b`",
            "Exact tested SHA: `$env:GITHUB_SHA`",
            "Focused browser result: `$passed / $total PASS`",
            "FORMAT_VERSION: `$($report.formatVersion)`",
            "Central Runtime: `NOT EXECUTED`",
            "",
            "## Core repair",
            "",
            "No Core change was added in this evidence pass. The accepted repair remains exactly the two mutation-lifecycle notifications in `product/source/src/ink.js`:",
            "- finalized Stroke creation queues its exact object ID with `queueSpatialObject(it.object.id)`;",
            "- finalized Shape creation queues its exact object ID with `queueSpatialObject(it.object.id)`.",
            "",
            "No new `refreshAll()` workaround, second spatial index, second selection authority, UI mutation, New Document/A4 change, or Creation/Layout workspace change was introduced.",
            "",
            "## Browser evidence",
            "",
            "- JSON: `$evidenceDir/spatial-index-browser.json`",
            "- PNG: `$evidenceDir/shape-lasso-pass.png`",
            "- Browser status: `$($report.status)`",
            "- Checks: `$passed / $total PASS`",
            "- Failures: `$(@($report.failures).Count)`",
            "",
            "## Lifecycle / exact ID summary",
            "",
            "- Shape create: `$shapeId` enters `spatialPending`; native Lasso query consumes it incrementally and selects the same ID. Index count `$($shapeCreated.indexCount) -> $($shapeLasso.indexCount)`; incremental updates `$($shapeCreated.stats.incrementalUpdates) -> $($shapeLasso.stats.incrementalUpdates)`.",
            "- Stroke create: `$strokeId` enters `spatialPending` then enters the index. Index count `$($strokeCreated.indexCount) -> $($strokeIndexed.indexCount)`.",
            "- Move / resize / rotate: selected Shape ID remains `$shapeId`; focused checks confirm new bounds and no stale hit.",
            "- Duplicate: copy ID `$copyId` appears after structural rebuild; delete removes it; undo restores the same ID; redo removes the same ID again.",
            "- Group: group ID `$groupId` is indexed with child IDs; ungroup removes the group ID while preserving children.",
            "- Frame / reparent: frame ID `$frameId` and nested child IDs are indexed; reparent root/frame preserves the child ID and world-space bounds contract.",
            "- Page switch: page 1 `$($page1.pageId)`; page 2 `$($page2.pageId)`; page-2 object `$page2ObjectId`. Switch-back index IDs match page 1 and exclude page 2; switch-forward index IDs match page 2 and exclude page 1.",
            "- Final spatial counters: full rebuilds `$($switchPage2.stats.fullRebuilds)`; incremental updates `$($switchPage2.stats.incrementalUpdates)`.",
            "",
            "## Final branch changed files vs baseline",
            "",
            "- `product/source/src/ink.js` — two-line Core mutation-lifecycle repair.",
            "- `qa/runtime/run-ink-core-spatial-index-lasso-repair.mjs` — focused browser runner.",
            "- `$evidenceDir/spatial-index-browser.json` — committed browser/index evidence.",
            "- `$evidenceDir/shape-lasso-pass.png` — committed native Lasso browser capture.",
            "- `working/INK_CORE_SPATIAL_INDEX_LASSO_REPAIR_DEV_RETURN_20261002.md` — this return record.",
            "",
            "Task-specific workflow `.github/workflows/ink-core-spatial-index-lasso-repair.yml` is removed in this evidence handoff and is not part of the final candidate tree.",
            "",
            "## Stop",
            "",
            "```text",
            "FOCUSED_CORE_REPAIR = COMPLETE",
            "FOCUSED_BROWSER_EVIDENCE = PASS",
            "INDEX_ENTRY_ID_VALIDATION = PASS",
            "FORMAT_VERSION = 4",
            "STOP -> Core / Supervisor review",
            "```"
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD $returnPath), $lines, [System.Text.UTF8Encoding]::new($false))

          Remove-Item ".github/workflows/ink-core-spatial-index-lasso-repair.yml"

          git config user.name "INK Core Spatial-Index DEV"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "qa(core): commit spatial-index evidence and DEV return"
          git push origin "HEAD:refs/heads/work/core-spatial-index-lasso-repair-001"

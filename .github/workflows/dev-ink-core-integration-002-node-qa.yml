name: DEV INK-CORE-INTEGRATION-002 Node QA

on:
  push:
    branches:
      - work/ink-core-integration-002

jobs:
  node-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact DEV branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check CHAT runtime
        run: node --check product/source/src/ai/chat-runtime.js
      - name: Run Grounded Creative Tool Surface QA
        run: node qa/core-integration-002-grounded-tool-surface.test.mjs
      - name: Run Integration-001 compatibility QA
        run: node qa/core-integration-001-grounded-context.test.mjs

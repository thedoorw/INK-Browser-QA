name: INK Live CHAT Request

on:
  push:
    branches: [main]
    paths:
      - ACTIVE/INK_LIVE_CHAT_REQUEST.json

permissions:
  contents: write

concurrency:
  group: ink-live-chat-request-hosted
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout request runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Execute CHAT request against Live INK
        run: >-
          node qa/live-chat/run-live-chat-request.mjs
          "ACTIVE/INK_LIVE_CHAT_REQUEST.json"
          "${{ runner.temp }}\ink-live-chat-result.json"
          "${{ runner.temp }}\ink-live-chat-result.png"

      - name: Publish structured result to GitHub SSOT
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ runner.temp }}\ink-live-chat-result.json
        with:
          script: |
            const fs = require('node:fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'working/INK_LIVE_CHAT_RESULT.json';
            let result;
            try {
              result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            } catch (error) {
              result = {
                schema: 'INK-LIVE-CHAT-RESULT',
                version: 1,
                status: 'FAILED',
                error: 'Runner result unavailable: ' + error.message
              };
            }
            const rawResult = JSON.stringify(result);
            if (rawResult.length > 180000 && Array.isArray(result?.result?.steps)) {
              const compactAgent = (agent) => {
                const raw = agent?.result || {};
                return {
                  schema: agent?.schema || null,
                  version: agent?.version || null,
                  action: agent?.action || null,
                  status: agent?.status || null,
                  diagnostics: Array.isArray(agent?.diagnostics) ? agent.diagnostics.slice(0, 6) : [],
                  targetRefCount: Array.isArray(agent?.targetRefs) ? agent.targetRefs.length : 0,
                  createdRefCount: Array.isArray(agent?.createdRefs) ? agent.createdRefs.length : 0,
                  changedRefCount: Array.isArray(agent?.changedRefs) ? agent.changedRefs.length : 0,
                  createdRefsSample: Array.isArray(agent?.createdRefs) ? agent.createdRefs.slice(0, 8) : [],
                  outputHandles: Array.isArray(agent?.outputHandles) ? agent.outputHandles.slice(0, 4) : [],
                  historyReceipt: agent?.historyReceipt ? {
                    commit: agent.historyReceipt.commit || null,
                    stepCount: Array.isArray(agent.historyReceipt.steps) ? agent.historyReceipt.steps.length : null
                  } : null,
                  revisionReceipt: agent?.revisionReceipt ? {
                    created: agent.revisionReceipt.created ?? null,
                    endingRevisionId: agent.revisionReceipt.endingRevisionId ?? null,
                    documentFingerprint: agent.revisionReceipt.documentFingerprint ?? null
                  } : null,
                  resultSummary: {
                    status: raw?.status ?? null,
                    action: raw?.action ?? null,
                    planId: raw?.planId ?? null,
                    referenceObjectId: raw?.referenceObjectId ?? null,
                    sourceReferenceObjectId: raw?.sourceReferenceObjectId ?? null,
                    colorObjectCount: Array.isArray(raw?.colorObjectIds) ? raw.colorObjectIds.length : null,
                    lineObjectCount: Array.isArray(raw?.lineObjectIds) ? raw.lineObjectIds.length : null,
                    totalMatched: raw?.totalMatched ?? null,
                    resultCount: Array.isArray(raw?.results) ? raw.results.length : null,
                    objectCount: Array.isArray(raw?.objects) ? raw.objects.length : null,
                    contextFingerprint: raw?.contextFingerprint ?? null,
                    handleId: raw?.handleId ?? null
                  }
                };
              };
              result = {
                schema: result.schema,
                version: result.version,
                requestId: result.requestId,
                tool: result.tool,
                liveUrl: result.liveUrl,
                expectedSourceSha: result.expectedSourceSha,
                runtimeIdentity: result.runtimeIdentity,
                status: result.status,
                compacted: true,
                fullResultBytes: rawResult.length,
                fullResultArtifact: true,
                result: {
                  steps: result.result.steps.map(step => ({
                    id: step.id,
                    tool: step.tool,
                    result: compactAgent(step.result)
                  }))
                }
              };
            }
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = Buffer.from(JSON.stringify(result, null, 2) + '\n').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'qa(chat): record Live INK result ' + (result.requestId || 'unknown'),
              content,
              branch: 'main',
              ...(sha ? { sha } : {})
            });

      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-live-chat-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\ink-live-chat-result.json
            ${{ runner.temp }}\ink-live-chat-result.png
          if-no-files-found: warn
          retention-days: 30

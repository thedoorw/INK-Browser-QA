name: CORE-MOD-004 Node QA

on:
  push:
    branches:
      - work/ink-core-visual-compare-004
    paths:
      - ".github/workflows/core-mod-004-node-qa.yml"

permissions:
  contents: read

jobs:
  node-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run CORE-MOD-004 deterministic Node QA
        run: node qa/core-mod-004-visual-compare.test.mjs

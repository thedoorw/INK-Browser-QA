name: INK v0.1 Runtime Baseline

on:
  push:
    branches:
      - work/application-health-v0.1
    paths:
      - '.github/workflows/ink-v0.1-runtime-baseline.yml'
      - 'product/**'
      - 'engineering/**'
      - 'qa/core/**'
      - 'governance/INK_Application_Health_Gate_v0.1.md'
      - 'governance/INK_Product_Identity_v0.1.md'
  workflow_dispatch:
    inputs:
      run_extended_tests:
        description: 'Run the extended Node unit suite after the Runtime baseline'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ink-v0.1-runtime-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-baseline:
    name: Windows Runtime Baseline
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Download runtime-relevant files without Git
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $env:RUNNER_TEMP "ink-$env:GITHUB_SHA.zip"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/archive/$env:GITHUB_SHA.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

          Get-ChildItem $env:GITHUB_WORKSPACE -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $prefixes = @(
              'product/source/',
              'engineering/source/',
              'engineering/health-overlay/',
              'qa/core/'
            )
            $written = 0
            foreach ($entry in $archive.Entries) {
              $name = $entry.FullName -replace '\\','/'
              $slash = $name.IndexOf('/')
              if ($slash -lt 0) { continue }
              $relative = $name.Substring($slash + 1)
              if (-not ($prefixes | Where-Object { $relative.StartsWith($_, [System.StringComparison]::OrdinalIgnoreCase) })) { continue }
              if ([string]::IsNullOrWhiteSpace($entry.Name)) { continue }

              $destination = Join-Path $env:GITHUB_WORKSPACE ($relative -replace '/', '\\')
              $parent = Split-Path $destination -Parent
              New-Item -ItemType Directory -Force -Path $parent | Out-Null
              $input = $entry.Open()
              try {
                $output = [System.IO.File]::Create($destination)
                try { $input.CopyTo($output) } finally { $output.Dispose() }
              } finally { $input.Dispose() }
              $written++
            }
            Write-Host "Materialized $written runtime-relevant files."
          } finally {
            $archive.Dispose()
          }

          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'product\source\index.html'))) {
            throw 'Runtime source extraction failed: product/source/index.html missing.'
          }
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'engineering\source\scripts'))) {
            throw 'Runtime source extraction failed: engineering/source/scripts missing.'
          }

      - name: Record runner environment
        run: |
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Ref:        $env:GITHUB_REF"
          Write-Host "SHA:        $env:GITHUB_SHA"
          Write-Host "Runner:     $env:RUNNER_NAME"
          Write-Host "OS:         $env:RUNNER_OS"
          node --version
          npm --version

      - name: Assemble runnable INK workspace
        run: |
          $runtime = Join-Path $env:GITHUB_WORKSPACE '.working\original-runtime'
          if (Test-Path $runtime) { Remove-Item $runtime -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null

          Copy-Item 'product\source\*' $runtime -Recurse -Force
          Copy-Item 'engineering\source\*' $runtime -Recurse -Force

          if (Test-Path 'qa\core\tests') {
            Copy-Item 'qa\core\tests' (Join-Path $runtime 'tests') -Recurse -Force
          }
          if (Test-Path 'qa\core\fixtures') {
            Copy-Item 'qa\core\fixtures' (Join-Path $runtime 'fixtures') -Recurse -Force
          }
          if (Test-Path 'qa\core\test-fixtures') {
            Copy-Item 'qa\core\test-fixtures' (Join-Path $runtime 'test-fixtures') -Recurse -Force
          }

          if (-not (Test-Path (Join-Path $runtime 'index.html'))) {
            throw 'Assembled runtime is missing index.html.'
          }
          if (-not (Test-Path (Join-Path $runtime 'src\ink.js'))) {
            throw 'Assembled runtime is missing src/ink.js.'
          }
          Write-Host "Runtime assembled at $runtime"

      - name: Apply INK v0.1 Health overlay
        run: |
          $runtime = Join-Path $env:GITHUB_WORKSPACE '.working\original-runtime'
          Copy-Item 'engineering\health-overlay\package.json' (Join-Path $runtime 'package.json') -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $runtime 'scripts') | Out-Null
          Copy-Item 'engineering\health-overlay\scripts\*' (Join-Path $runtime 'scripts') -Recurse -Force
          Write-Host 'Health overlay applied.'

      - name: Locate Chrome, Chromium, or Edge
        run: |
          $candidates = @(
            $env:INK_CHROMIUM_PATH,
            $env:CHROME_PATH,
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $browser = $candidates | Select-Object -First 1
          if (-not $browser) {
            Write-Error 'No supported Chromium browser was found. Install Chrome/Edge or set INK_CHROMIUM_PATH.'
            exit 1
          }
          "INK_CHROMIUM_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Browser: $browser"

      - name: Compatibility build
        working-directory: .working/original-runtime
        run: npm run build

      - name: INK doctor
        working-directory: .working/original-runtime
        run: npm run ink:doctor

      - name: Browser Runtime baseline
        working-directory: .working/original-runtime
        run: npm run test:browser

      - name: Runtime Ready gate
        if: always() && hashFiles('.working/original-runtime/package.json') != ''
        working-directory: .working/original-runtime
        run: npm run test:ready

      - name: Extended unit suite
        if: github.event_name == 'workflow_dispatch' && inputs.run_extended_tests
        working-directory: .working/original-runtime
        run: npm test

      - name: Publish Runtime report to job summary
        if: always()
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE '.working\original-runtime\tests\browser-evidence-v0.1\browser-health-report-v0.1.json'
          Add-Content $env:GITHUB_STEP_SUMMARY '## INK v0.1 — Runtime Baseline'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Runner: $env:RUNNER_NAME"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Commit: $env:GITHUB_SHA"
          if (Test-Path $report) {
            $json = Get-Content $report -Raw | ConvertFrom-Json
            Add-Content $env:GITHUB_STEP_SUMMARY "- Runtime status: **$($json.status)**"
            Add-Content $env:GITHUB_STEP_SUMMARY "- Product version: $($json.version)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- Browser: $($json.environment.chromium)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- Page exceptions: $($json.pageExceptions.Count)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- Critical console errors: $($json.criticalConsoleErrors.Count)"
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY '- Runtime report: **MISSING**'
          }

      - name: Upload Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-v0.1-runtime-baseline-${{ github.run_id }}
          path: .working/original-runtime/tests/browser-evidence-v0.1/
          if-no-files-found: warn
          retention-days: 30

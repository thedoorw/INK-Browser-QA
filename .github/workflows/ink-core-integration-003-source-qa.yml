name: INK Core Integration 003 Source QA

on:
  push:
    branches:
      - work/ink-core-integration-003

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact DEV branch commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integration 001 regression
        run: node qa/core-integration-001-grounded-context.test.mjs

      - name: Integration 002 regression
        run: node qa/core-integration-002-grounded-tool-surface.test.mjs

      - name: Integration 003 bounded continuation
        run: node qa/core-integration-003-bounded-grounded-reasoning.test.mjs

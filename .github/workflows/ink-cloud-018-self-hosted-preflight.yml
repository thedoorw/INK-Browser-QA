name: INK-CLOUD-018 Self-Hosted Web Preflight

on:
  push:
    branches:
      - work/ink-cloud-018
    paths:
      - '.github/workflows/ink-cloud-018-self-hosted-preflight.yml'
      - 'product/source/**'
      - 'qa/runtime/**'
      - 'ACTIVE/INK_DEV_PROGRESS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-cloud-018-self-hosted-preflight
  cancel-in-progress: false

jobs:
  web-preflight:
    name: Windows Self-Hosted Web Preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          ref: work/ink-cloud-018
          fetch-depth: 1

      - name: Record exact environment
        shell: powershell
        run: |
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "SHA: $env:GITHUB_SHA"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Arch: $env:RUNNER_ARCH"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          if (Get-Command node -ErrorAction SilentlyContinue) { node --version } else { Write-Host "Node: NOT REQUIRED FOR PREFLIGHT" }

      - name: Locate Chrome or Edge
        shell: powershell
        run: |
          $candidates = @(
            $env:INK_CHROMIUM_PATH,
            $env:CHROME_PATH,
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $browser = $candidates | Select-Object -First 1
          if (-not $browser) { Write-Error 'No supported Chrome/Edge browser found on the self-hosted runner.'; exit 1 }
          "INK_CHROMIUM_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Browser: $browser"

      - name: Start INK loopback server
        shell: powershell
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-server.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-server.err.log'
          $server = Start-Process powershell -ArgumentList @('-ExecutionPolicy','Bypass','-File',(Join-Path $env:GITHUB_WORKSPACE 'qa\runtime\start-ink-local.ps1'),'-NoBrowser') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $server.Id | Out-File (Join-Path $env:RUNNER_TEMP 'ink-cloud-018-server.pid') -Encoding ascii
          Start-Sleep -Seconds 2
          if ($server.HasExited) { Get-Content $stdout -ErrorAction SilentlyContinue; Get-Content $stderr -ErrorAction SilentlyContinue; Write-Error 'INK local server exited during startup.'; exit 1 }
          Write-Host "INK server PID: $($server.Id)"

      - name: HTTP and module preflight
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\qa\runtime\check-ink-local.ps1

      - name: Headless browser shell smoke
        shell: powershell
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-chrome-profile'
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
          $dom = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-dom.html'
          $args = @('--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check','--disable-extensions',"--user-data-dir=$profile",'--virtual-time-budget=5000','--dump-dom','http://127.0.0.1:4173/')
          $browserOutput = & $env:INK_CHROMIUM_PATH @args 2>&1
          $exit = $LASTEXITCODE
          $browserOutput | Out-File $dom -Encoding utf8
          $html = Get-Content $dom -Raw
          if ($exit -ne 0) { Write-Host $html; Write-Error "Browser exited with code $exit"; exit 1 }
          if ($html -notmatch 'id="app"') { Write-Host $html; Write-Error 'INK app root not found in rendered DOM.'; exit 1 }
          if ($html -notmatch 'creativeWorkspace') { Write-Host $html; Write-Error 'Creative Workspace did not mount in rendered DOM.'; exit 1 }
          if ($html -notmatch 'creativeWorkspaceToggle') { Write-Host $html; Write-Error 'Creative Workspace toggle did not mount in rendered DOM.'; exit 1 }
          Write-Host '[PASS] INK shell rendered under real Chromium.'
          Write-Host '[PASS] Creative Workspace mounted.'

      - name: Summarize preflight
        if: always()
        shell: powershell
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## INK-CLOUD-018 self-hosted web preflight'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Runner: $env:RUNNER_NAME"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: $env:GITHUB_SHA"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Browser: $env:INK_CHROMIUM_PATH"
          Add-Content $env:GITHUB_STEP_SUMMARY '- Runtime: Windows self-hosted / loopback HTTP'
          Add-Content $env:GITHUB_STEP_SUMMARY '- Scope: static shell + Creative Workspace mount only'

      - name: Stop INK loopback server
        if: always()
        shell: powershell
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-server.pid'
          if (Test-Path $pidFile) { $serverPid = [int](Get-Content $pidFile -Raw); Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue }

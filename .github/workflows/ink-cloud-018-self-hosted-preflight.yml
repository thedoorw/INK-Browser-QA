name: INK-CLOUD-018 Self-Hosted Web Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-cloud-018-self-hosted-preflight
  cancel-in-progress: true

jobs:
  web-preflight:
    name: Windows Self-Hosted Web Preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - name: Materialize bounded runtime files without Git
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $archive = Join-Path $env:RUNNER_TEMP 'i18.zip'
          $extract = Join-Path $env:SystemDrive 'i18'
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $url = "https://codeload.github.com/thedoorw/INK-Browser-QA/zip/$env:GITHUB_SHA"
          $client = New-Object System.Net.WebClient
          $client.Headers.Add('User-Agent','INK-CLOUD-018-self-hosted-runner')
          try { $client.DownloadFile($url, $archive) } finally { $client.Dispose() }
          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -lt 1024) { throw 'Exact revision ZIP download failed or is unexpectedly small.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $allowed = @('product/source/','qa/runtime/','qa/fixtures/rose-window/')
            $count = 0
            foreach ($entry in $zip.Entries) {
              $slash = $entry.FullName.IndexOf('/')
              if ($slash -lt 0 -or $slash -ge $entry.FullName.Length - 1) { continue }
              $rel = $entry.FullName.Substring($slash + 1)
              $matched = $false
              foreach ($prefix in $allowed) { if ($rel.StartsWith($prefix, [StringComparison]::Ordinal)) { $matched = $true; break } }
              if (-not $matched -or [string]::IsNullOrEmpty($entry.Name)) { continue }
              $target = Join-Path $extract ($rel.Replace('/', '\'))
              $parent = Split-Path $target -Parent
              [System.IO.Directory]::CreateDirectory($parent) | Out-Null
              $input = $entry.Open()
              try {
                $output = [System.IO.File]::Open($target, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
                try { $input.CopyTo($output) } finally { $output.Dispose() }
              } finally { $input.Dispose() }
              $count++
            }
          } finally { $zip.Dispose() }
          if ($count -lt 50) { throw "Bounded runtime extraction returned only $count files." }
          if (-not (Test-Path (Join-Path $extract 'product\source\index.html'))) { throw 'INK source entry missing after bounded materialization.' }
          "INK_SOURCE_ROOT=$extract" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Materialized exact SHA: $env:GITHUB_SHA"
          Write-Host "Bounded runtime files: $count"
          Write-Host "Source root: $extract"
      - name: Record exact environment
        run: |
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "SHA: $env:GITHUB_SHA"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Arch: $env:RUNNER_ARCH"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          if (Get-Command node -ErrorAction SilentlyContinue) { node --version } else { Write-Host 'Node: NOT REQUIRED FOR PREFLIGHT' }

      - name: Locate Chrome or Edge
        run: |
          $candidates = @(
            $env:INK_CHROMIUM_PATH,
            $env:CHROME_PATH,
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $browser = $candidates | Select-Object -First 1
          if (-not $browser) { throw 'No supported Chrome/Edge browser found on the self-hosted runner.' }
          "INK_CHROMIUM_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Browser: $browser"

      - name: Loopback HTTP and Chromium preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-server.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-server.err.log'
          $server = $null
          try {
            $server = Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',(Join-Path $env:INK_SOURCE_ROOT 'qa\runtime\start-ink-local.ps1'),'-NoBrowser') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              if ($server.HasExited) { break }
              try {
                $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 2
                if ($probe.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw 'INK loopback server did not become reachable.'
            }
            Write-Host "INK server PID: $($server.Id)"
            Set-Location $env:INK_SOURCE_ROOT
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\qa\runtime\check-ink-local.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $profile = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-chrome-profile'
            Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
            $dom = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-dom.html'
            $args = @('--headless=new','--disable-gpu','--no-first-run','--no-default-browser-check','--disable-extensions',"--user-data-dir=$profile",'--virtual-time-budget=5000','--dump-dom','http://127.0.0.1:4173/')
            $browserOutput = & $env:INK_CHROMIUM_PATH @args 2>&1
            $exit = $LASTEXITCODE
            $browserOutput | Out-File $dom -Encoding utf8
            $html = Get-Content $dom -Raw
            if ($exit -ne 0) { Write-Host $html; throw "Browser exited with code $exit" }
            if ($html -notmatch 'id="app"') { Write-Host $html; throw 'INK app root not found in rendered DOM.' }
            if ($html -notmatch 'creativeWorkspace') { Write-Host $html; throw 'Creative Workspace did not mount in rendered DOM.' }
            if ($html -notmatch 'creativeWorkspaceToggle') { Write-Host $html; throw 'Creative Workspace toggle did not mount in rendered DOM.' }
            Write-Host '[PASS] INK shell rendered under real Chromium.'
            Write-Host '[PASS] Creative Workspace mounted.'
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Summarize preflight
        if: always()
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## INK-CLOUD-018 self-hosted web preflight'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Runner: $env:RUNNER_NAME"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: $env:GITHUB_SHA"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Browser: $env:INK_CHROMIUM_PATH"
          Add-Content $env:GITHUB_STEP_SUMMARY '- Runtime: Windows self-hosted / loopback HTTP'
          Add-Content $env:GITHUB_STEP_SUMMARY '- Scope: static shell + Creative Workspace mount only'

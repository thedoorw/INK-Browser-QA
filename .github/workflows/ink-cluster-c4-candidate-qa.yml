name: INK Cluster C4 Candidate QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'product/source/src/editor/chat-bounded-edit.js'
      - 'product/source/src/agent/capability-registry.js'
      - 'qa/source-candidate/run-source-candidate-request.mjs'
      - 'qa/evidence/cluster-c-layout-page-artboard-20261003/C4_SOURCE_CANDIDATE_QA_REQUEST.json'
      - '.github/workflows/ink-cluster-c4-candidate-qa.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Read pinned candidate
        id: request
        shell: bash
        run: |
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('qa/evidence/cluster-c-layout-page-artboard-20261003/C4_SOURCE_CANDIDATE_QA_REQUEST.json','utf8'));if(r.schema!=='INK-SOURCE-CANDIDATE-QA-REQUEST'||r.version!==1||r.case!=='artboard-c4'||!/^[a-f0-9]{40}$/.test(String(r.candidateSha||'')))process.exit(2);fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+r.candidateSha+'\\n')"

      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.sha }}
          path: candidate
          persist-credentials: false

      - name: Execute browser QA and regressions
        shell: bash
        run: |
          node qa/source-candidate/run-source-candidate-request.mjs \
            'qa/evidence/cluster-c-layout-page-artboard-20261003/C4_SOURCE_CANDIDATE_QA_REQUEST.json' \
            'candidate/product/source' \
            "${RUNNER_TEMP}/cluster-c4-result.json" \
            "${RUNNER_TEMP}/cluster-c4-result.png"

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-cluster-c4-candidate-${{ steps.request.outputs.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cluster-c4-result.json
            ${{ runner.temp }}/cluster-c4-result.png
          if-no-files-found: warn
          retention-days: 30

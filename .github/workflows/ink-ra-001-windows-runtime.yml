name: INK-RA-001 Windows Browser Runtime QA

on:
  push:
    branches:
      - work/ink-ra-001
    paths:
      - '.github/workflows/ink-ra-001-windows-runtime.yml'
      - 'product/source/src/vector/geometry-kernel.js'
      - 'product/source/src/vendor/bezier-js-6.1.4/**'
      - 'product/source/src/vendor/clipper2-ts-2.0.1/**'
      - 'qa/core/tests/unit/vector-geometry-kernel-v0.1.test.mjs'
      - 'qa/runtime/ink-ra-001-browser-harness.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-ra-001-windows-browser-runtime
  cancel-in-progress: true

jobs:
  geometry-runtime:
    name: Geometry Kernel / Chrome / Rose Window
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -Command "& '{0}'"

    steps:
      - name: Materialize exact branch revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Static and deterministic source checks
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content 'product/source/src/config.js' -Raw
          if ($config -notmatch 'FORMAT_VERSION\s*=\s*4') { throw 'FORMAT_VERSION is not 4.' }
          if (Get-Command node -ErrorAction SilentlyContinue) {
            node qa/core/tests/unit/vector-geometry-kernel-v0.1.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Node not present; real Chromium module execution remains authoritative.'
          }
          Write-Host '[PASS] source invariants'

      - name: Prepare browser harness
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'qa/runtime/ink-ra-001-browser-harness.html' 'product/source/__qa_geometry.html' -Force
          Copy-Item 'qa/fixtures/rose-window/rose-window-primary.png' 'product/source/__qa_rose_window.png' -Force
          $candidates = @(
            $env:INK_CHROMIUM_PATH,
            $env:CHROME_PATH,
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $browser = $candidates | Select-Object -First 1
          if (-not $browser) { throw 'No supported Chromium browser found.' }
          "INK_CHROMIUM_PATH=$browser" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Real Chromium geometry acceptance
        run: |
          $ErrorActionPreference = 'Stop'
          $serverOut = Join-Path $env:RUNNER_TEMP 'ink-ra-001-server.out.log'
          $serverErr = Join-Path $env:RUNNER_TEMP 'ink-ra-001-server.err.log'
          $browserOut = Join-Path $env:RUNNER_TEMP 'ink-ra-001-browser.dom.html'
          $browserErr = Join-Path $env:RUNNER_TEMP 'ink-ra-001-browser.err.log'
          $profile = Join-Path $env:RUNNER_TEMP 'ink-ra-001-browser-profile'
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
          $server = $null
          try {
            $script = (Resolve-Path 'qa/runtime/start-ink-local.ps1').Path
            $command = "& '$script' -NoBrowser"
            $server = Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-Command',$command) -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
            $ready = $false
            for ($index = 0; $index -lt 40; $index++) {
              Start-Sleep -Milliseconds 500
              if ($server.HasExited) { break }
              try {
                $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/__qa_geometry.html' -UseBasicParsing -TimeoutSec 2
                if ($probe.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) {
              Get-Content $serverOut -ErrorAction SilentlyContinue
              Get-Content $serverErr -ErrorAction SilentlyContinue
              throw 'Loopback server did not become reachable.'
            }

            $arguments = @(
              '--headless=new',
              '--disable-gpu',
              '--no-first-run',
              '--no-default-browser-check',
              '--disable-extensions',
              '--disable-background-networking',
              '--virtual-time-budget=15000',
              '--dump-dom',
              "--user-data-dir=$profile",
              'http://127.0.0.1:4173/__qa_geometry.html'
            )
            $browser = Start-Process $env:INK_CHROMIUM_PATH -ArgumentList $arguments -RedirectStandardOutput $browserOut -RedirectStandardError $browserErr -PassThru
            $null = $browser.Handle
            if (-not $browser.WaitForExit(120000)) { Stop-Process -Id $browser.Id -Force; throw 'Chromium timed out.' }
            $browser.Refresh()
            if ($browser.ExitCode -is [int] -and $browser.ExitCode -ne 0) { Get-Content $browserErr -ErrorAction SilentlyContinue; throw "Chromium exit code $($browser.ExitCode)." }
            $dom = Get-Content $browserOut -Raw
            Write-Host $dom
            if ($dom -notmatch 'data-qa=["'']PASS["'']') { Get-Content $browserErr -ErrorAction SilentlyContinue; throw 'Browser harness did not report PASS.' }
            if ($dom -notmatch '"roseOutputSubpaths": 12') { throw 'Rose Window geometry evidence missing.' }
            if ($dom -notmatch '"deterministicRepeat": true') { throw 'Deterministic browser evidence missing.' }
            Write-Host '[PASS] real Chromium geometry + Rose Window acceptance'
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Summary
        if: always()
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## INK-RA-001 Windows Browser Runtime QA'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: $env:GITHUB_SHA"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Runner: $env:RUNNER_NAME / $env:RUNNER_OS / $env:RUNNER_ARCH"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Browser: $env:INK_CHROMIUM_PATH"
          Add-Content $env:GITHUB_STEP_SUMMARY '- Case: cubic queries + deterministic 12-part Rose Window geometry offset/measurement'
          Add-Content $env:GITHUB_STEP_SUMMARY '- PowerShell policy: unchanged; no ExecutionPolicy Bypass used'

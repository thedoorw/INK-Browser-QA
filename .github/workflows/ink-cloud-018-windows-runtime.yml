name: INK-CLOUD-018 Windows Browser Runtime QA

on:
  push:
    branches:
      - work/ink-cloud-018
    paths:
      - '.github/workflows/ink-cloud-018-windows-runtime.yml'
      - 'product/source/**'
      - 'qa/runtime/ink-cloud-018-browser-harness.html'
      - 'qa/fixtures/rose-window/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-cloud-018-windows-browser-runtime
  cancel-in-progress: true

jobs:
  rose-window-runtime:
    name: Rose Window / Chrome / Shared Core
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - name: Materialize exact bounded revision without Git
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $archive = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-runtime.zip'
          $extract = Join-Path $env:SystemDrive 'ink-cloud-018-runtime'
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $url = "https://codeload.github.com/thedoorw/INK-Browser-QA/zip/$env:GITHUB_SHA"
          $client = New-Object System.Net.WebClient
          $client.Headers.Add('User-Agent','INK-CLOUD-018-runtime-runner')
          try { $client.DownloadFile($url, $archive) } finally { $client.Dispose() }
          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -lt 1024) { throw 'Exact revision ZIP download failed.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $allowed = @('product/source/','qa/runtime/','qa/fixtures/rose-window/')
            $count = 0
            foreach ($entry in $zip.Entries) {
              $slash = $entry.FullName.IndexOf('/')
              if ($slash -lt 0 -or $slash -ge $entry.FullName.Length - 1) { continue }
              $rel = $entry.FullName.Substring($slash + 1)
              $matched = $false
              foreach ($prefix in $allowed) {
                if ($rel.StartsWith($prefix,[StringComparison]::Ordinal)) { $matched = $true; break }
              }
              if (-not $matched -or [string]::IsNullOrEmpty($entry.Name)) { continue }
              $target = Join-Path $extract ($rel.Replace('/','\'))
              [IO.Directory]::CreateDirectory((Split-Path $target -Parent)) | Out-Null
              $input = $entry.Open()
              try {
                $output = [IO.File]::Open($target,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
                try { $input.CopyTo($output) } finally { $output.Dispose() }
              } finally { $input.Dispose() }
              $count++
            }
          } finally { $zip.Dispose() }

          $site = Join-Path $extract 'product\source'
          $harness = Join-Path $extract 'qa\runtime\ink-cloud-018-browser-harness.html'
          $fixture = Join-Path $extract 'qa\fixtures\rose-window\rose-window-primary.png'
          if (-not (Test-Path (Join-Path $site 'index.html'))) { throw 'INK source entry missing.' }
          if (-not (Test-Path $harness)) { throw 'Browser QA harness missing.' }
          if (-not (Test-Path $fixture)) { throw 'Rose Window fixture missing.' }
          Copy-Item $harness (Join-Path $site '__qa_runtime.html') -Force
          Copy-Item $fixture (Join-Path $site '__qa_rose_window.png') -Force
          "INK_SOURCE_ROOT=$extract" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "INK_SITE_ROOT=$site" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Exact SHA: $env:GITHUB_SHA"
          Write-Host "Materialized bounded files: $count"

      - name: Static invariants
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content (Join-Path $env:INK_SITE_ROOT 'src\config.js') -Raw
          if ($config -notmatch "FORMAT_VERSION\s*=\s*4") { throw 'FORMAT_VERSION is not 4.' }
          $manifest = Get-Content (Join-Path $env:INK_SITE_ROOT 'manifest.webmanifest') -Raw | ConvertFrom-Json
          if ($manifest.start_url -ne './index.html' -or $manifest.scope -ne './') { throw 'Manifest base-path contract drifted.' }

          $forbidden = @(
            'sk-[A-Za-z0-9_-]{20,}',
            'ghp_[A-Za-z0-9]{20,}',
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          )
          $files = Get-ChildItem $env:INK_SITE_ROOT -Recurse -File | Where-Object { $_.Extension -in @('.js','.html','.json','.webmanifest') }
          foreach ($pattern in $forbidden) {
            $hit = $files | Select-String -Pattern $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { throw "Committed secret pattern found: $($hit.Path)" }
          }

          $absolute = $files | Select-String -Pattern '(src|href)=["'']\/|fetch\(["'']\/' -ErrorAction SilentlyContinue
          $productAbsolute = $absolute | Where-Object { $_.Path -notmatch '__qa_runtime\.html$' }
          if ($productAbsolute) { $productAbsolute | ForEach-Object { Write-Host $_ }; throw 'Static product contains deployment-host binding.' }

          if (Get-Command node -ErrorAction SilentlyContinue) {
            node --check (Join-Path $env:INK_SITE_ROOT 'src\ai\chat-runtime.js')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check (Join-Path $env:INK_SITE_ROOT 'src\editor\creative-workspace.js')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --check (Join-Path $env:INK_SITE_ROOT 'src\extraction\workspace.js')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Node not present; Chromium module parse is authoritative for syntax.'
          }
          Write-Host '[PASS] static invariants'

      - name: Locate Chrome or Edge
        run: |
          $candidates = @(
            $env:INK_CHROMIUM_PATH,
            $env:CHROME_PATH,
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $browser = $candidates | Select-Object -First 1
          if (-not $browser) { throw 'No supported Chromium browser found.' }
          "INK_CHROMIUM_PATH=$browser" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Browser: $browser"

      - name: Real Chromium Rose Window acceptance
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-server.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-server.err.log'
          $browserOut = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-browser.out.html'
          $browserErr = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-browser.err.log'
          $server = $null
          $browser = $null
          try {
            $server = Start-Process powershell -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',(Join-Path $env:INK_SOURCE_ROOT 'qa\runtime\start-ink-local.ps1'),'-NoBrowser') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            $ready = $false
            for ($i=0;$i -lt 30;$i++) {
              Start-Sleep -Milliseconds 500
              if ($server.HasExited) { break }
              try {
                $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 2
                if ($probe.StatusCode -eq 200) { $ready=$true; break }
              } catch {}
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw 'Loopback server did not become reachable.'
            }

            Set-Location $env:INK_SOURCE_ROOT
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\qa\runtime\check-ink-local.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $profile = Join-Path $env:RUNNER_TEMP 'ink-cloud-018-runtime-profile'
            Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
            $args = @(
              '--headless=new',
              '--disable-gpu',
              '--no-first-run',
              '--no-default-browser-check',
              '--disable-extensions',
              '--disable-background-timer-throttling',
              "--user-data-dir=$profile",
              '--virtual-time-budget=180000',
              '--dump-dom',
              'http://127.0.0.1:4173/__qa_runtime.html'
            )
            $browser = Start-Process $env:INK_CHROMIUM_PATH -ArgumentList $args -RedirectStandardOutput $browserOut -RedirectStandardError $browserErr -PassThru
            # Windows PowerShell 5.1 can leave ExitCode unset on a Start-Process
            # object unless the native process handle is materialized before the
            # timed wait. Force the handle, then perform a final drain wait.
            $null = $browser.Handle
            if (-not $browser.WaitForExit(240000)) {
              Stop-Process -Id $browser.Id -Force -ErrorAction SilentlyContinue
              throw 'Chromium runtime QA exceeded 240 seconds.'
            }
            $browser.WaitForExit()
            $browser.Refresh()
            $exitCode = $browser.ExitCode
            if ($null -eq $exitCode) {
              Get-Content $browserErr -ErrorAction SilentlyContinue
              throw 'Chromium completed but Windows PowerShell did not expose an exit code.'
            }
            if ([int]$exitCode -ne 0) {
              Get-Content $browserErr -ErrorAction SilentlyContinue
              throw "Chromium exited with code $exitCode."
            }

            $html = Get-Content $browserOut -Raw
            if ($html -notmatch 'data-qa="PASS"') {
              Write-Host $html
              Get-Content $browserErr -ErrorAction SilentlyContinue
              throw 'Rose Window browser harness did not report PASS.'
            }

            $match = [regex]::Match($html,'<pre id="qa-log">(?<json>.*?)</pre>',[Text.RegularExpressions.RegexOptions]::Singleline)
            if (-not $match.Success) { throw 'Runtime evidence payload missing from browser DOM.' }
            $json = [Net.WebUtility]::HtmlDecode($match.Groups['json'].Value)
            $evidence = $json | ConvertFrom-Json
            if ($evidence.failures.Count -gt 0) { throw "Harness reported $($evidence.failures.Count) failure(s)." }
            $required = @(
              'CANVAS_EDITOR_RENDERED',
              'CREATIVE_WORKSPACE_VISIBLE',
              'REFERENCE_IMPORT_VISIBLE',
              'DIRECT_EXTRACTION_EXECUTED',
              'EDITABLE_PATH_RESULT_VISIBLE',
              'REFERENCE_OVERLAY_CONTROLLABLE',
              'PATH_EDIT_ENTERED',
              'MUTATION_BLOCKED_BEFORE_APPROVAL',
              'BOUNDED_EDIT_EXECUTED',
              'CHAT_DOCUMENT_CONTEXT_BOUND',
              'CHAT_NATURAL_LANGUAGE_RESPONSE',
              'CHAT_DISCUSSION_NON_MUTATING',
              'STRUCTURE_AWARE_EXECUTED',
              'REVISION_RESTORE_EXECUTED',
              'PROJECT_RELOAD_INTEGRITY',
              'NO_FATAL_RUNTIME_HEALTH_ERRORS'
            )
            foreach ($name in $required) {
              $found = $evidence.checks | Where-Object { $_.name -eq $name -and $_.status -eq 'PASS' }
              if (-not $found) { throw "Missing PASS evidence: $name" }
            }

            Write-Host '--- INK-CLOUD-018 BROWSER EVIDENCE ---'
            Write-Host $json
            Write-Host '--- END EVIDENCE ---'
            Write-Host '[PASS] Rose Window real-browser acceptance'
          } finally {
            if ($browser -and -not $browser.HasExited) { Stop-Process -Id $browser.Id -Force -ErrorAction SilentlyContinue }
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Summary
        if: always()
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## INK-CLOUD-018 Windows Browser Runtime QA'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: $env:GITHUB_SHA"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Runner: $env:RUNNER_NAME / $env:RUNNER_OS / $env:RUNNER_ARCH"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Browser: $env:INK_CHROMIUM_PATH"
          Add-Content $env:GITHUB_STEP_SUMMARY '- Case: Rose Window / Direct Extraction default / optional Structure-Aware / CHAT / Revision'
          Add-Content $env:GITHUB_STEP_SUMMARY '- Remote AI: optional; runtime case uses local/manual context mode'

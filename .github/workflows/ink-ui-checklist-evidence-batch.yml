name: INK UI Checklist Evidence Batch

on:
  push:
    branches: [main]
    paths:
      - ACTIVE/INK_UI_CHECKLIST_EVIDENCE_TARGET.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ink-ui-checklist-evidence-batch
  cancel-in-progress: false

jobs:
  ui-evidence:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Materialize exact target
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs/promises'),path=require('node:path'),crypto=require('node:crypto');
            const {owner,repo}=context.repo;
            const {data:tf}=await github.rest.repos.getContent({owner,repo,path:'ACTIVE/INK_UI_CHECKLIST_EVIDENCE_TARGET.json',ref:context.sha});
            const d=JSON.parse(Buffer.from(tf.content,'base64').toString('utf8'));
            if(d.schema!=='ink-ui-checklist-evidence-target'||d.task!=='INK-UI-FINAL-CHECKLIST-CLOSURE-001'||!/^[a-f0-9]{40}$/.test(d.target_sha||'')) throw new Error('Invalid target descriptor');
            const targetSha=d.target_sha;
            const {data:commit}=await github.rest.repos.getCommit({owner,repo,ref:targetSha});
            if(commit.sha!==targetSha)throw new Error('Exact target mismatch');
            const {data:tree}=await github.rest.git.getTree({owner,repo,tree_sha:commit.commit.tree.sha,recursive:'1'});
            if(tree.truncated)throw new Error('Truncated tree');
            const wanted=tree.tree.filter(x=>x.type==='blob'&&(x.path.startsWith('product/source/')||x.path==='qa/runtime/run-ink-runtime-batch.mjs'||x.path==='qa/runtime/ink-web-ui-001-harness.html'||x.path==='qa/fixtures/rose-window/rose-window-primary.png'));
            const required=['product/source/index.html','product/source/styles.css','product/source/src/ink.js','qa/runtime/run-ink-runtime-batch.mjs','qa/runtime/ink-web-ui-001-harness.html','qa/fixtures/rose-window/rose-window-primary.png'];
            for(const p of required)if(!wanted.some(x=>x.path===p))throw new Error('Missing '+p);
            const root=await fs.mkdtemp(path.join(process.env.RUNNER_TEMP,'ink-ui-issue92-'));
            core.exportVariable('INK_UI_EVIDENCE_ROOT',root);core.exportVariable('INK_TESTED_SHA',targetSha);core.exportVariable('INK_WORKFLOW_SHA',context.sha);
            let cursor=0;
            await Promise.all(Array.from({length:4},async()=>{while(cursor<wanted.length){const item=wanted[cursor++];const {data}=await github.rest.git.getBlob({owner,repo,file_sha:item.sha});const bytes=Buffer.from(data.content,'base64');const sha=crypto.createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');if(sha!==item.sha)throw new Error('Blob integrity '+item.path);const dest=path.join(root,item.path);await fs.mkdir(path.dirname(dest),{recursive:true});await fs.writeFile(dest,bytes);}}));
            const {data:q}=await github.rest.repos.getContent({owner,repo,path:'qa/runtime/run-ink-ui-checklist-evidence-batch.mjs',ref:context.sha});
            const qdest=path.join(root,'qa/runtime/run-ink-ui-checklist-evidence-batch.mjs');await fs.mkdir(path.dirname(qdest),{recursive:true});await fs.writeFile(qdest,Buffer.from(q.content,'base64'));
            await fs.mkdir(path.join(root,'evidence'),{recursive:true});
            await fs.writeFile(path.join(root,'evidence','target-descriptor.json'),JSON.stringify(d,null,2));
      - name: Run UI browser suite only
        continue-on-error: true
        shell: pwsh
        run: |
          node --check "$env:INK_UI_EVIDENCE_ROOT\qa\runtime\run-ink-ui-checklist-evidence-batch.mjs"
          node "$env:INK_UI_EVIDENCE_ROOT\qa\runtime\run-ink-ui-checklist-evidence-batch.mjs" "$env:INK_UI_EVIDENCE_ROOT"
      - name: Publish evidence to GitHub SSOT
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs/promises'),path=require('node:path');const {owner,repo}=context.repo;
            const root=process.env.INK_UI_EVIDENCE_ROOT,targetSha=process.env.INK_TESTED_SHA;if(!root||!targetSha)throw new Error('Missing evidence root');
            const dir=path.join(root,'evidence'),names=(await fs.readdir(dir)).filter(n=>n.endsWith('.json')).sort();
            if(!names.includes('ui.json')||!names.includes('report.json'))throw new Error('UI evidence missing');
            const blobs=[];
            for(const name of names){const bytes=await fs.readFile(path.join(dir,name));const {data:b}=await github.rest.git.createBlob({owner,repo,content:bytes.toString('utf8'),encoding:'utf-8'});blobs.push({name,sha:b.sha});}
            const prefix='qa/evidence/ink-ui-final-checklist-issue92-ui-suite-'+targetSha.slice(0,12)+'/';
            let published=null;
            for(let attempt=0;attempt<4&&!published;attempt++){
              const {data:branch}=await github.rest.repos.getBranch({owner,repo,branch:'main'}),baseSha=branch.commit.sha;
              const {data:baseCommit}=await github.rest.git.getCommit({owner,repo,commit_sha:baseSha});
              const {data:t}=await github.rest.git.createTree({owner,repo,base_tree:baseCommit.tree.sha,tree:blobs.map(b=>({path:prefix+b.name,mode:'100644',type:'blob',sha:b.sha}))});
              const {data:c}=await github.rest.git.createCommit({owner,repo,message:'qa(ui): record Issue 92 UI-only browser evidence',tree:t.sha,parents:[baseSha]});
              try{await github.rest.git.updateRef({owner,repo,ref:'heads/main',sha:c.sha,force:false});published=c.sha;}catch(e){if(attempt===3)throw e;await new Promise(r=>setTimeout(r,700));}
            }
            core.notice('Evidence commit '+published);
      - name: Gate UI evidence
        shell: pwsh
        run: |
          $r=Get-Content "$env:INK_UI_EVIDENCE_ROOT\evidence\report.json" -Raw | ConvertFrom-Json
          if($r.status -ne "PASS"){Write-Error $r.error;exit 1}
      - name: Cleanup
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs/promises'),path=require('node:path'),root=process.env.INK_UI_EVIDENCE_ROOT;
            if(root&&path.basename(root).startsWith('ink-ui-issue92-'))await fs.rm(root,{recursive:true,force:true,maxRetries:3});

name: INK-WEB-UI-001 Windows Chrome Runtime

on:
  push:
    branches:
      - work/ink-web-ui-001
    paths:
      - 'product/source/**'
      - 'qa/runtime/ink-web-ui-001-harness.html'
      - '.github/workflows/ink-web-ui-001-runtime.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to test; blank uses the dispatched ref SHA'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ink-web-ui-001-runtime
  cancel-in-progress: true

jobs:
  browser-runtime:
    name: Windows Chrome Web UI Gate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Resolve exact revision and runner
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $sha = '${{ inputs.target_sha }}'
          if ([string]::IsNullOrWhiteSpace($sha)) { $sha = '${{ github.sha }}' }
          "INK_TEST_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Exact SHA: $sha"
          Write-Host "Runner: $env:RUNNER_NAME / $env:RUNNER_OS / $env:RUNNER_ARCH"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

      - name: Bounded exact-SHA materialization
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $archive = Join-Path $env:RUNNER_TEMP 'ink-web-ui-001.zip'
          $root = Join-Path $env:SystemDrive 'iui'
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $url = "https://codeload.github.com/thedoorw/INK-Browser-QA/zip/$env:INK_TEST_SHA"
          $client = New-Object System.Net.WebClient
          $client.Headers.Add('User-Agent','INK-WEB-UI-001-self-hosted-runner')
          try { $client.DownloadFile($url, $archive) } finally { $client.Dispose() }
          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -lt 1024) {
            throw 'Exact revision ZIP download failed or is unexpectedly small.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          $count = 0
          try {
            foreach ($entry in $zip.Entries) {
              $slash = $entry.FullName.IndexOf('/')
              if ($slash -lt 0 -or $slash -ge $entry.FullName.Length - 1) { continue }
              $rel = $entry.FullName.Substring($slash + 1)
              $wanted = $rel.StartsWith('product/source/', [StringComparison]::Ordinal) -or
                        $rel.StartsWith('qa/runtime/', [StringComparison]::Ordinal) -or
                        $rel.StartsWith('qa/core/', [StringComparison]::Ordinal)
              if (-not $wanted -or [string]::IsNullOrEmpty($entry.Name)) { continue }

              $target = Join-Path $root ($rel.Replace('/', '\'))
              $parent = Split-Path $target -Parent
              [System.IO.Directory]::CreateDirectory($parent) | Out-Null
              $input = $entry.Open()
              try {
                $output = [System.IO.File]::Open($target, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
                try { $input.CopyTo($output) } finally { $output.Dispose() }
              } finally { $input.Dispose() }
              $count++
            }
          } finally {
            $zip.Dispose()
          }

          if ($count -lt 50) { throw "Bounded runtime extraction returned only $count files." }
          if (-not (Test-Path (Join-Path $root 'product\source\index.html'))) { throw 'Missing product/source/index.html' }
          if (-not (Test-Path (Join-Path $root 'qa\runtime\ink-web-ui-001-harness.html'))) { throw 'Missing UI QA harness' }

          "INK_RUNTIME_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Materialized exact SHA: $env:INK_TEST_SHA"
          Write-Host "Bounded runtime files: $count"
          Write-Host "Source root: $root"

      - name: Source and identity gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-True([bool]$Condition, [string]$Message) {
            if (-not $Condition) { throw $Message }
            Write-Host "PASS: $Message"
          }

          $source = Join-Path $env:INK_RUNTIME_ROOT 'product\source'
          $web = Get-Content (Join-Path $source 'index.html') -Raw
          $portable = Get-Content (Join-Path $source 'index-standalone.html') -Raw
          $config = Get-Content (Join-Path $source 'src\config.js') -Raw
          $sw = Get-Content (Join-Path $source 'service-worker.js') -Raw
          $shell = Get-Content (Join-Path $source 'web-shell.js') -Raw
          $manifest = Get-Content (Join-Path $source 'manifest.webmanifest') -Raw | ConvertFrom-Json
          $portableManifest = Get-Content (Join-Path $source 'manifest-portable.webmanifest') -Raw | ConvertFrom-Json

          Assert-True ($web.Contains('<title>INK v0.1 · Web</title>')) 'Web visible title is INK v0.1 · Web'
          Assert-True ($portable.Contains('<title>INK v0.1 · Portable</title>')) 'Portable visible title is INK v0.1 · Portable'
          Assert-True ($config -match "INK_VERSION\s*=\s*'0\.1'") 'active modular version is 0.1'
          Assert-True ($config -match 'FORMAT_VERSION\s*=\s*4\b') 'FORMAT_VERSION remains 4'
          Assert-True (-not ($web -match '1\.6\.5|1\.5\.1 RC')) 'historical Web identity absent from active entry shell'
          Assert-True ($sw -match "RELEASE_VERSION\s*=\s*'0\.1-Web'") 'service-worker cache identity is 0.1-Web'
          Assert-True ($sw.Contains("'./web-shell.js'") -and $sw.Contains("'./assets/ink-mark.svg'")) 'service-worker caches Phase-1 shell assets'
          Assert-True ($shell.Contains("id: 'layers'") -and $shell.Contains("id: 'history'") -and $shell.Contains("id: 'chat'")) 'dock controller includes required primary entries'
          Assert-True ($manifest.name -eq 'INK v0.1 · Web') 'Web manifest identity'
          Assert-True ($portableManifest.name -eq 'INK v0.1 · Portable') 'Portable manifest identity'
          Assert-True ((Test-Path (Join-Path $source 'assets\ink-mark.svg'))) 'INK mark product asset exists'

      - name: Focused source unit and binding regression
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          $node = @(
            (Join-Path $runnerRoot 'externals\node24\bin\node.exe'),
            (Join-Path $runnerRoot 'externals\node20\bin\node.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $node) {
            $node = Get-ChildItem (Join-Path $runnerRoot 'externals') -Filter node.exe -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $node) { throw 'GitHub Actions bundled Node runtime was not found.' }
          Write-Host "Unit Node: $node"
          & $node --version

          Set-Location $env:INK_RUNTIME_ROOT
          $tests = @(
            'qa/core/tests/unit/portable-baseline-integration-v0.1.test.mjs',
            'qa/core/tests/unit/creative-workspace-minimum-ux-v0.1.test.mjs',
            'qa/core/tests/unit/chat-bounded-edit-core-v0.1.test.mjs',
            'qa/core/tests/unit/chat-multi-step-creative-workspace-v0.1.test.mjs',
            'qa/core/tests/unit/revision-closure-core-v0.1.test.mjs',
            'qa/core/tests/unit/revision-chat-binding-v0.1.test.mjs',
            'qa/core/tests/unit/singular-interaction-history-guard-v0.1.test.mjs'
          )
          foreach ($test in $tests) {
            if (-not (Test-Path $test)) { throw "Missing required focused unit test: $test" }
          }
          & $node --test @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'FOCUSED_UNIT_BINDING_REGRESSION=PASS'

      - name: Windows Chrome real-browser gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP "ink-web-ui-001-evidence-$env:GITHUB_RUN_ID"
          if (Test-Path $evidence) { Remove-Item $evidence -Recurse -Force }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          $browserCandidates = @(
            $env:INK_CHROMIUM_PATH,
            $env:CHROME_PATH,
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $browser = $browserCandidates | Select-Object -First 1
          if (-not $browser) { throw 'No Chrome/Edge runtime found on self-hosted Windows runner.' }
          Write-Host "Browser: $browser"

          $qaSource = Join-Path $env:INK_RUNTIME_ROOT 'qa\runtime\ink-web-ui-001-harness.html'
          $qaDir = Join-Path $env:INK_RUNTIME_ROOT 'product\source\_qa'
          New-Item -ItemType Directory -Path $qaDir -Force | Out-Null
          Copy-Item $qaSource (Join-Path $qaDir 'ink-web-ui-001-harness.html') -Force

          $qaResult = Join-Path $evidence 'browser-result.json'
          $stdout = Join-Path $evidence 'server.out.log'
          $stderr = Join-Path $evidence 'server.err.log'
          $chromeOut = Join-Path $evidence 'chrome.out.log'
          $chromeErr = Join-Path $evidence 'chrome.err.log'
          $server = $null
          $chrome = $null
          try {
            $serverScript = Join-Path $env:INK_RUNTIME_ROOT 'qa\runtime\start-ink-local.ps1'
            $server = Start-Process powershell -ArgumentList @(
              '-NoProfile','-ExecutionPolicy','Bypass','-File',$serverScript,
              '-NoBrowser','-QaResultPath',$qaResult
            ) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

            $url = 'http://127.0.0.1:4173/_qa/ink-web-ui-001-harness.html'
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              if ($server.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw 'INK verified loopback server did not become ready.'
            }
            Write-Host "Loopback preflight: PASS"

            Set-Location $env:INK_RUNTIME_ROOT
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\qa\runtime\check-ink-local.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $profile = Join-Path $env:RUNNER_TEMP "ink-web-ui-001-chrome-$env:GITHUB_RUN_ID"
            Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $profile -Force | Out-Null
            $args = @(
              '--headless=new',
              '--disable-gpu',
              '--no-first-run',
              '--no-default-browser-check',
              '--disable-extensions',
              "--user-data-dir=$profile",
              $url
            )
            $chrome = Start-Process -FilePath $browser -ArgumentList $args -RedirectStandardOutput $chromeOut -RedirectStandardError $chromeErr -PassThru

            $reported = $false
            for ($i = 0; $i -lt 360; $i++) {
              if (Test-Path $qaResult) { $reported = $true; break }
              if ($chrome.HasExited) {
                Start-Sleep -Milliseconds 500
                if (Test-Path $qaResult) { $reported = $true }
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $reported) {
              Get-Content $chromeOut -ErrorAction SilentlyContinue
              Get-Content $chromeErr -ErrorAction SilentlyContinue
              throw 'Browser harness did not post a QA result.'
            }

            $result = Get-Content $qaResult -Raw | ConvertFrom-Json
            Write-Host "Browser harness status: $($result.status)"
            Write-Host "Checks: total=$($result.summary.total) passed=$($result.summary.passed) failed=$($result.summary.failed)"
            if ($result.status -ne 'PASS') {
              throw "INK-WEB-UI-001 browser harness reported $($result.status)."
            }
            if ([int]$result.formatVersion -ne 4) {
              throw "Browser harness reported unexpected FORMAT_VERSION $($result.formatVersion)."
            }

            $summary = @(
              "INK-WEB-UI-001 Windows Chrome Runtime",
              "EXACT_SHA=$env:INK_TEST_SHA",
              "RUNNER=$env:RUNNER_NAME",
              "BROWSER=$browser",
              "LOOPBACK_HTTP=PASS",
              "HTTP_MIME_PREFLIGHT=PASS",
              "BROWSER_HARNESS=PASS",
              "CHECKS_TOTAL=$($result.summary.total)",
              "CHECKS_PASSED=$($result.summary.passed)",
              "CHECKS_FAILED=$($result.summary.failed)",
              "FORMAT_VERSION=4",
              "PRODUCT_DISPLAY=INK v0.1 · Web"
            ) -join [Environment]::NewLine
            [System.IO.File]::WriteAllText((Join-Path $evidence 'runtime-summary.txt'), $summary, [System.Text.UTF8Encoding]::new($false))
            Write-Host $summary
          } finally {
            if ($chrome -and -not $chrome.HasExited) {
              Stop-Process -Id $chrome.Id -Force -ErrorAction SilentlyContinue
            }
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish runtime summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## INK-WEB-UI-001 — Windows Chrome Runtime'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: $env:INK_TEST_SHA"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Runner: $env:RUNNER_NAME / $env:RUNNER_OS / $env:RUNNER_ARCH"
          $evidence = Join-Path $env:RUNNER_TEMP "ink-web-ui-001-evidence-$env:GITHUB_RUN_ID"
          $summary = Join-Path $evidence 'runtime-summary.txt'
          if (Test-Path $summary) {
            Add-Content $env:GITHUB_STEP_SUMMARY '- Browser gate: **PASS**'
            Get-Content $summary | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY "- $_" }
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY '- Browser gate: **FAIL / evidence missing**'
          }

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-web-ui-001-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}\ink-web-ui-001-evidence-${{ github.run_id }}\
          if-no-files-found: warn
          retention-days: 30

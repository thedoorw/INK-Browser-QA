name: INK-WEB-UI-001 Windows Chrome Runtime

on:
  push:
    branches:
      - work/ink-web-ui-001
    paths:
      - 'product/source/**'
      - 'qa/runtime/ink-web-ui-001-harness.html'
      - '.github/workflows/ink-web-ui-001-runtime.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to test; blank uses the dispatched ref SHA'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ink-web-ui-001-runtime
  cancel-in-progress: false

jobs:
  browser-runtime:
    name: Windows Chrome Web UI Gate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Resolve exact revision and runner
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $sha = '${{ inputs.target_sha }}'
          if ([string]::IsNullOrWhiteSpace($sha)) { $sha = '${{ github.sha }}' }
          "INK_TEST_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Exact SHA: $sha"
          Write-Host "Runner: $env:RUNNER_NAME / $env:RUNNER_OS / $env:RUNNER_ARCH"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

      - name: Bounded exact-SHA materialization
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "ink-web-ui-001-$env:GITHUB_RUN_ID"
          $zip = Join-Path $env:RUNNER_TEMP "ink-web-ui-001-$env:GITHUB_RUN_ID.zip"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'INK-WEB-UI-001-runtime'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/zipball/$env:INK_TEST_SHA"
          Invoke-WebRequest -Uri $uri -Headers $headers -OutFile $zip -UseBasicParsing

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $count = 0
          try {
            foreach ($entry in $archive.Entries) {
              $name = $entry.FullName.Replace('\','/')
              $relative = $name -replace '^[^/]+/',''
              $wanted = $relative.StartsWith('product/source/') -or $relative -eq 'qa/runtime/ink-web-ui-001-harness.html'
              if (-not $wanted -or [string]::IsNullOrWhiteSpace($entry.Name)) { continue }

              $dest = Join-Path $root ($relative.Replace('/','\'))
              $parent = Split-Path $dest -Parent
              New-Item -ItemType Directory -Path $parent -Force | Out-Null
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
              $count++
            }
          } finally {
            $archive.Dispose()
          }

          if (-not (Test-Path (Join-Path $root 'product\source\index.html'))) { throw 'Missing product/source/index.html' }
          if (-not (Test-Path (Join-Path $root 'qa\runtime\ink-web-ui-001-harness.html'))) { throw 'Missing UI QA harness' }
          if ($count -lt 50) { throw "Bounded materialization unexpectedly small: $count files" }

          "INK_RUNTIME_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Bounded files materialized: $count"
          Write-Host "Runtime root: $root"

      - name: Source and identity gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-True([bool]$Condition, [string]$Message) {
            if (-not $Condition) { throw $Message }
            Write-Host "PASS: $Message"
          }

          $source = Join-Path $env:INK_RUNTIME_ROOT 'product\source'
          $web = Get-Content (Join-Path $source 'index.html') -Raw
          $portable = Get-Content (Join-Path $source 'index-standalone.html') -Raw
          $config = Get-Content (Join-Path $source 'src\config.js') -Raw
          $sw = Get-Content (Join-Path $source 'service-worker.js') -Raw
          $shell = Get-Content (Join-Path $source 'web-shell.js') -Raw
          $manifest = Get-Content (Join-Path $source 'manifest.webmanifest') -Raw | ConvertFrom-Json
          $portableManifest = Get-Content (Join-Path $source 'manifest-portable.webmanifest') -Raw | ConvertFrom-Json

          Assert-True ($web.Contains('<title>INK v0.1 · Web</title>')) 'Web visible title is INK v0.1 · Web'
          Assert-True ($portable.Contains('<title>INK v0.1 · Portable</title>')) 'Portable visible title is INK v0.1 · Portable'
          Assert-True ($config -match "INK_VERSION\s*=\s*'0\.1'") 'active modular version is 0.1'
          Assert-True ($config -match 'FORMAT_VERSION\s*=\s*4\b') 'FORMAT_VERSION remains 4'
          Assert-True (-not ($web -match '1\.6\.5|1\.5\.1 RC')) 'historical Web identity absent from active entry shell'
          Assert-True ($sw -match "RELEASE_VERSION\s*=\s*'0\.1-Web'") 'service-worker cache identity is 0.1-Web'
          Assert-True ($sw.Contains("'./web-shell.js'") -and $sw.Contains("'./assets/ink-mark.svg'")) 'service-worker caches Phase-1 shell assets'
          Assert-True ($shell.Contains("id: 'layers'") -and $shell.Contains("id: 'history'") -and $shell.Contains("id: 'chat'")) 'dock controller includes required primary entries'
          Assert-True ($manifest.name -eq 'INK v0.1 · Web') 'Web manifest identity'
          Assert-True ($portableManifest.name -eq 'INK v0.1 · Portable') 'Portable manifest identity'
          Assert-True ((Test-Path (Join-Path $source 'assets\ink-mark.svg'))) 'INK mark product asset exists'

      - name: Windows Chrome real-browser gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP "ink-web-ui-001-evidence-$env:GITHUB_RUN_ID"
          if (Test-Path $evidence) { Remove-Item $evidence -Recurse -Force }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          $browserCandidates = @(
            $env:INK_CHROMIUM_PATH,
            $env:CHROME_PATH,
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { $_ -and (Test-Path $_) }
          $browser = $browserCandidates | Select-Object -First 1
          if (-not $browser) { throw 'No Chrome/Edge runtime found on self-hosted Windows runner.' }
          Write-Host "Browser: $browser"

          $pythonExe = $null
          $pythonArgs = @()
          if (Get-Command py -ErrorAction SilentlyContinue) {
            $pythonExe = (Get-Command py).Source
            $pythonArgs = @('-3')
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            $pythonExe = (Get-Command python).Source
          } elseif (Get-Command python3 -ErrorAction SilentlyContinue) {
            $pythonExe = (Get-Command python3).Source
          }
          if (-not $pythonExe) { throw 'Python 3 is required for the bounded loopback server.' }

          $port = 8871
          $serverArgs = @($pythonArgs + @('-m','http.server',"$port",'--bind','127.0.0.1'))
          $server = $null
          try {
            $server = Start-Process -FilePath $pythonExe -ArgumentList $serverArgs -WorkingDirectory $env:INK_RUNTIME_ROOT -PassThru -WindowStyle Hidden
            $url = "http://127.0.0.1:$port/qa/runtime/ink-web-ui-001-harness.html"

            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'Loopback HTTP server did not become ready.' }
            Write-Host "Loopback preflight: PASS"

            $profile = Join-Path $env:RUNNER_TEMP "ink-web-ui-001-chrome-$env:GITHUB_RUN_ID"
            New-Item -ItemType Directory -Path $profile -Force | Out-Null
            $args = @(
              '--headless=new',
              '--disable-gpu',
              '--no-first-run',
              '--no-default-browser-check',
              "--user-data-dir=$profile",
              '--virtual-time-budget=42000',
              '--dump-dom',
              $url
            )
            $dump = (& $browser @args 2>&1 | Out-String)
            $dumpPath = Join-Path $evidence 'browser-dump.html'
            [System.IO.File]::WriteAllText($dumpPath, $dump, [System.Text.UTF8Encoding]::new($false))

            if ($dump -notmatch 'data-qa-status="PASS"') {
              Write-Host $dump
              throw 'INK-WEB-UI-001 browser harness did not reach PASS.'
            }
            if ($dump -notmatch 'INK_UI_QA_RESULT:') { throw 'Browser QA result payload missing.' }

            $summary = @(
              "INK-WEB-UI-001 Windows Chrome Runtime",
              "EXACT_SHA=$env:INK_TEST_SHA",
              "RUNNER=$env:RUNNER_NAME",
              "BROWSER=$browser",
              "LOOPBACK_HTTP=PASS",
              "BROWSER_HARNESS=PASS",
              "FORMAT_VERSION=4",
              "PRODUCT_DISPLAY=INK v0.1 · Web"
            ) -join [Environment]::NewLine
            [System.IO.File]::WriteAllText((Join-Path $evidence 'runtime-summary.txt'), $summary, [System.Text.UTF8Encoding]::new($false))
            Write-Host $summary
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish runtime summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## INK-WEB-UI-001 — Windows Chrome Runtime'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Exact SHA: $env:INK_TEST_SHA"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Runner: $env:RUNNER_NAME / $env:RUNNER_OS / $env:RUNNER_ARCH"
          $evidence = Join-Path $env:RUNNER_TEMP "ink-web-ui-001-evidence-$env:GITHUB_RUN_ID"
          $summary = Join-Path $evidence 'runtime-summary.txt'
          if (Test-Path $summary) {
            Add-Content $env:GITHUB_STEP_SUMMARY '- Browser gate: **PASS**'
            Get-Content $summary | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY "- $_" }
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY '- Browser gate: **FAIL / evidence missing**'
          }

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-web-ui-001-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}\ink-web-ui-001-evidence-${{ github.run_id }}\
          if-no-files-found: warn
          retention-days: 30

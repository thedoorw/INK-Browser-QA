<!doctype html>
<meta charset="utf-8">
<title>INK Issue92 Visual Evidence</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7e7e7}
#qaFrame{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#e7e7e7}
</style>
<iframe id="qaFrame" src="/?fresh=1"></iframe>
<script type="module">
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mode=new URL(location.href).searchParams.get('mode')||'desktop-layers';
const frame=document.querySelector('#qaFrame');
const post=e=>fetch('/__qa_result',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(e)});
const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};};
const visible=(w,e)=>{if(!e||e.hidden)return false;const s=w.getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0&&r.width>0&&r.height>0;};
const style=(w,e,keys)=>{if(!e)return null;const s=w.getComputedStyle(e),o={};for(const k of keys)o[k]=s[k];return o;};
const safeText=e=>String(e?.textContent||e?.value||'').replace(/\s+/g,' ').trim();

function pathObject(id,name,x,y,w=120,h=90,fill='#d7a78f'){
  return {id,type:'path',name,matrix:[1,0,0,1,x,y],opacity:1,visible:true,fill,stroke:'#3a3a3a',strokeWidth:2,subpaths:[{closed:true,anchors:[
    {x:0,y:0,in:{x:0,y:0},out:{x:0,y:0},mode:'corner'},
    {x:w,y:0,in:{x:0,y:0},out:{x:0,y:0},mode:'corner'},
    {x:w,y:h,in:{x:0,y:0},out:{x:0,y:0},mode:'corner'},
    {x:0,y:h,in:{x:0,y:0},out:{x:0,y:0},mode:'corner'}
  ]}]};
}
function seedCanvas(app){
  const layer=app.layer();
  layer.objects.splice(0,layer.objects.length,
    pathObject('qa-visual-a','Visual A',80,90,150,110,'#d8a28f'),
    pathObject('qa-visual-b','Visual B',310,220,105,145,'#91b9b0')
  );
  app.selection=[];
  app.spatialDirty=true;
  app.refreshAll();
  app.fitContent?.();
  app.updateStatus?.();
  return layer.objects;
}
function seedHistory(app){
  const objects=seedCanvas(app);
  app.history.clear();
  app.selectOnly(app.layer().id,objects[0].id);
  app.translateSelection(12,0,'移動 A');
  app.translateSelection(0,18,'移動 B');
  app.changeObjectOpacity(.78,true);
  app.translateSelection(-8,6,'微調位置');
  app.history.undo();
  app.history.undo();
  app.updateHistoryUI();
}
function seedLibraries(app){
  const objects=seedCanvas(app);
  app.doc.components={schema:'INK-COMPONENTS-1',definitions:[{id:'component:visual',name:'Visual Component',sourceRootId:objects[0].id}]};
  app.doc.materialLibrary={format:'INK-MATERIAL-LIBRARY',version:'1.0',templates:[{templateId:'material:visual',templateVersion:'1.0.0',name:'Visual Material',materialType:'paint',semanticRole:'visual'}]};
  app.page().floraRecipeState={schemaVersion:'0.1',recipes:{'recipe:visual':{recipe:{recipeId:'recipe:visual',schemaVersion:'0.2',operation:'Transparent Glaze',metadata:{label:'Visual Recipe'}},revision:1}}};
  app.layer().objects.push(
    {id:'qa-repeat',type:'repeat',name:'Visual Repeat',matrix:[1,0,0,1,0,0],opacity:1,visible:true,mode:'radial',count:8,sourceObjectId:objects[0].id},
    {id:'qa-reference-derived',type:'path',name:'Reference Visual',matrix:[1,0,0,1,0,0],opacity:1,visible:true,fill:'#c796aa',stroke:'#222222',strokeWidth:1,subpaths:[],metadata:{decomposition:{referenceObjectId:'reference-visual',role:'color-region',sourceSha256:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}}}
  );
}
function canvasInk(canvas){
  try{
    const ctx=canvas?.getContext('2d');if(!ctx)return null;
    const {width,height}=canvas; if(!width||!height)return null;
    const data=ctx.getImageData(0,0,width,height).data;
    let opaque=0;
    for(let i=3;i<data.length;i+=16)if(data[i]>0)opaque++;
    return {width,height,sampledOpaque:opaque};
  }catch{return {width:canvas?.width||0,height:canvas?.height||0,sampledOpaque:null};}
}
function elementSummary(w,e){
  if(!e)return null;
  const cs=w.getComputedStyle(e);
  return {tag:e.tagName.toLowerCase(),id:e.id||null,className:String(e.className||''),text:safeText(e).slice(0,160),rect:rect(e),visible:visible(w,e),disabled:Boolean(e.disabled),role:e.getAttribute('role'),ariaSelected:e.getAttribute('aria-selected'),ariaPressed:e.getAttribute('aria-pressed'),ariaChecked:e.getAttribute('aria-checked'),style:{fontSize:cs.fontSize,lineHeight:cs.lineHeight,color:cs.color,backgroundColor:cs.backgroundColor,borderWidth:cs.borderWidth,borderColor:cs.borderColor,borderRadius:cs.borderRadius,boxShadow:cs.boxShadow,gap:cs.gap,padding:cs.padding,cursor:cs.cursor,outline:cs.outline}};
}
function collectCommon(w,d,shell,extra={}){
  const q=s=>d.querySelector(s),qa=s=>[...d.querySelectorAll(s)];
  const menu=q('.menu-strip'),top=q('.topbar'),tools=q('.tool-rail'),dock=q('.panel-dock'),stage=q('#stageWrap'),status=q('.statusbar'),inspector=q('#inspector');
  const toolButtons=qa('.tool-rail .tool-button').filter(e=>visible(w,e)).map(e=>({id:e.id||null,tool:e.dataset.tool||e.dataset.toolStack||null,group:e.dataset.uiBToolGroup||null,active:e.classList.contains('active'),rect:rect(e),icon:rect(e.querySelector('.tool-icon svg')),use:e.querySelector('.tool-icon use')?.getAttribute('href')||null,stroke:w.getComputedStyle(e.querySelector('.tool-icon svg')||e).strokeWidth,hasFlyout:Boolean(e.querySelector('.stack-corner'))}));
  const activeMenu=qa('.application-command-menu').find(e=>visible(w,e));
  const menuData=activeMenu?{id:activeMenu.id,rect:rect(activeMenu),items:[...activeMenu.children].map(e=>elementSummary(w,e))}:null;
  const tabs=qa('.inspector-tab').filter(e=>visible(w,e)).map(e=>elementSummary(w,e));
  const panelButtons=qa('.panel-dock-button').filter(e=>visible(w,e)).map(e=>elementSummary(w,e));
  const history=qa('#historyList .history-step').map(e=>elementSummary(w,e));
  const navCanvas=q('#shellNavigatorCanvas'),navProxy=q('#shellNavigatorProxy');
  const interactive=qa('button,input,select,textarea,[role="button"],[role="menuitem"],[role="menuitemcheckbox"],[role="menuitemradio"]').filter(e=>visible(w,e));
  const unnamed=interactive.filter(e=>!(e.getAttribute('aria-label')||e.getAttribute('title')||safeText(e)||e.id)).map(e=>({tag:e.tagName,id:e.id,className:String(e.className||'')}));
  const surfaces=['.menu-strip','.topbar','.tool-rail','.panel-dock','#inspector','.application-command-menu','.brush-family-popover','.shell-panel-section','.property-card'].flatMap(sel=>qa(sel).filter(e=>visible(w,e)).slice(0,8).map(e=>({selector:sel,rect:rect(e),style:style(w,e,['borderRadius','boxShadow','borderWidth','borderColor','backgroundColor','padding','gap'])})));
  return {
    mode,
    viewport:{width:w.innerWidth,height:w.innerHeight,dpr:w.devicePixelRatio},
    shell:shell.state(),
    shellGeometry:{menu:rect(menu),topbar:rect(top),tools:rect(tools),dock:rect(dock),stage:rect(stage),status:rect(status),inspector:rect(inspector)},
    overflow:{documentWidth:d.documentElement.scrollWidth,bodyWidth:d.body.scrollWidth,viewportWidth:w.innerWidth,horizontal:d.documentElement.scrollWidth>w.innerWidth+1},
    toolButtons,
    menu:menuData,
    tabs,
    panelButtons,
    history,
    navigator:{preview:rect(q('#shellNavigatorPreview')),canvas:rect(navCanvas),proxy:rect(navProxy),canvasInk:canvasInk(navCanvas),zoom:elementSummary(w,q('#shellNavigatorZoom')),slider:elementSummary(w,q('#shellNavigatorZoomSlider'))},
    libraries:{search:elementSummary(w,q('#shellLibrarySearch')),filters:qa('[data-library-type]').map(e=>elementSummary(w,e)),results:qa('[data-library-result-type]').map(e=>elementSummary(w,e)),inspect:elementSummary(w,q('#shellLibraryInspect'))},
    tooltip:elementSummary(w,q('#shellTooltip')),
    snapReadout:elementSummary(w,q('#shellSnapReadout')),
    focus:{active:elementSummary(w,d.activeElement)},
    accessibility:{visibleInteractive:interactive.length,unnamed},
    surfaces,
    ...extra
  };
}

try{
  await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('iframe timeout')),30000);frame.onload=()=>{clearTimeout(t);resolve();};});
  const w=frame.contentWindow,d=frame.contentDocument;
  for(let i=0;i<240&&!(w.INK_APP&&w.INK_WEB_SHELL);i++)await sleep(100);
  const app=w.INK_APP,shell=w.INK_WEB_SHELL;if(!app||!shell)throw new Error('INK unavailable');
  shell.closeMenus?.();shell.close?.();await sleep(40);
  let extra={};

  if(mode==='desktop-layers'){
    const objects=seedCanvas(app);app.selectOnly(app.layer().id,objects[0].id);shell.open('layers');await sleep(120);
  }else if(mode==='tools-dual'){
    shell.close();const root=d.querySelector('#app'),toggle=d.querySelector('#toolbarLayoutToggle');if(root.dataset.toolbarLayout!=='dual')toggle?.click();await sleep(120);
    extra.toolsAudit={layout:root.dataset.toolbarLayout,visibleTextGlyphs:[...d.querySelectorAll('.tool-rail .ui-b-glyph')].filter(e=>visible(w,e)).map(e=>safeText(e)),screenMode:Boolean(d.querySelector('#toolScreenMode')),resetSvg:Boolean(d.querySelector('#resetToolColors svg use')),swapSvg:Boolean(d.querySelector('#swapToolColors svg use')),edgeSvg:Boolean(d.querySelector('#toolbarLayoutToggle svg use'))};
  }else if(mode==='tools-single'){
    shell.close();const root=d.querySelector('#app'),toggle=d.querySelector('#toolbarLayoutToggle');if(root.dataset.toolbarLayout!=='single')toggle?.click();await sleep(120);
    extra.toolsAudit={layout:root.dataset.toolbarLayout,visibleTextGlyphs:[...d.querySelectorAll('.tool-rail .ui-b-glyph')].filter(e=>visible(w,e)).map(e=>safeText(e)),screenMode:Boolean(d.querySelector('#toolScreenMode')),resetSvg:Boolean(d.querySelector('#resetToolColors svg use')),swapSvg:Boolean(d.querySelector('#swapToolColors svg use')),edgeSvg:Boolean(d.querySelector('#toolbarLayoutToggle svg use'))};
  }else if(mode==='menu-edit'){
    const objects=seedCanvas(app);app.selectOnly(app.layer().id,objects[0].id);app.translateSelection(8,0,'移動物件');shell.close();d.querySelector('[data-application-menu-trigger="edit"]')?.click();await sleep(100);
  }else if(mode==='menu-view'){
    seedCanvas(app);shell.close();const trigger=d.querySelector('[data-application-menu-trigger="view"]');trigger?.click();await sleep(20);d.querySelector('[data-shell-action="toggle-rulers"]')?.click();await sleep(30);trigger?.click();await sleep(100);
  }else if(mode==='menu-filter'){
    shell.close();d.querySelector('[data-application-menu-trigger="filter"]')?.click();await sleep(100);
  }else if(mode==='context-shape'){
    const objects=seedCanvas(app);app.selectOnly(app.layer().id,objects[0].id);
    const contexts=[];
    for(const tool of ['pen','eraser','select','shape','text']){
      app.setTool(tool);await sleep(60);
      const root=d.querySelector('#contextualOptions');
      contexts.push({tool,mode:root?.dataset.contextMode||null,rect:rect(root),clientWidth:root?.clientWidth||0,scrollWidth:root?.scrollWidth||0,overflow:Boolean(root&&root.scrollWidth>root.clientWidth+1),visibleControls:[...root?.querySelectorAll('input,select,button,[data-context-control]')||[]].filter(e=>visible(w,e)).map(e=>e.id||e.dataset.contextControl||e.tagName)});
    }
    extra.contexts=contexts;app.setTool('shape');await sleep(80);
  }else if(mode==='tool-flyout'){
    seedCanvas(app);app.toggleBrushFamilyPopover(true);await sleep(100);
  }else if(mode==='history'){
    seedHistory(app);shell.open('history');await sleep(120);
  }else if(mode==='navigator'){
    seedCanvas(app);app.fitContent?.();shell.open('navigator');await sleep(150);
  }else if(mode==='navigator-zoom'){
    seedCanvas(app);app.fitContent?.();app.zoomBy?.(1.8);app.page().camera.x+=70;app.page().camera.y-=45;app.renderer.render();app.updateStatus?.();shell.open('navigator');await sleep(160);
  }else if(mode==='libraries'){
    seedLibraries(app);shell.open('libraries');await sleep(160);
  }else if(mode==='compact'){
    seedCanvas(app);shell.close();await sleep(120);
  }else if(mode==='context-tools'){
    seedCanvas(app);app.clearSelection();shell.close();await sleep(60);
    const contexts=[];
    for(const tool of ['pen','eraser','shape','text','select']){
      if(tool==='select') app.clearSelection();
      app.setTool(tool);await sleep(80);
      const root=d.querySelector('#contextualOptions');
      contexts.push({tool,mode:root?.dataset.contextMode||null,toolState:root?.dataset.contextTool||null,rect:rect(root),clientWidth:root?.clientWidth||0,scrollWidth:root?.scrollWidth||0,overflow:Boolean(root&&root.scrollWidth>root.clientWidth+1),visibleControls:[...root?.querySelectorAll('input,select,button,[data-context-control]')||[]].filter(e=>visible(w,e)).map(e=>e.id||e.dataset.contextControl||e.tagName)});
    }
    extra.contexts=contexts;app.clearSelection();app.setTool('shape');await sleep(100);
  }else if(mode==='keyboard-focus'){
    seedCanvas(app);shell.open('navigator');await sleep(100);
    const target=d.querySelector('#shellNavigatorZoomSlider');
    try{target?.focus({focusVisible:true});}catch{target?.focus();}
    await sleep(100);
    extra.focusVisible=Boolean(target?.matches?.(':focus-visible'));
    extra.focusTarget=target?elementSummary(w,target):null;
  }else if(mode==='chat'){
    const objects=seedCanvas(app);app.selectOnly(app.layer().id,objects[0].id);shell.open('chat');await sleep(180);
    const root=d.querySelector('#creativeWorkspace');
    const textContent=safeText(root);
    const forbidden=['provider','credential','api key','api-key','base url','endpoint','model provider','provider model'];
    const lower=textContent.toLowerCase();
    extra.chat={rect:rect(root),visible:visible(w,root),stage:app.creativeWorkspace?.stage||null,text:textContent.slice(0,1600),forbiddenMatches:forbidden.filter(term=>lower.includes(term)),visibleInputs:[...root?.querySelectorAll('input,select,textarea,button')||[]].filter(e=>visible(w,e)).map(e=>({tag:e.tagName.toLowerCase(),name:e.getAttribute('name'),id:e.id||null,label:e.getAttribute('aria-label')||safeText(e).slice(0,80)}))};
  }else if(mode==='guides'){
    seedCanvas(app);d.querySelector('#app').dataset.rulers='true';d.querySelector('[data-shell-action="toggle-rulers"]')?.setAttribute('aria-checked','true');app.addGuide?.({id:'visual-guide-x',orientation:'vertical',position:150});app.addGuide?.({id:'visual-guide-y',orientation:'horizontal',position:120});app.updateStatus?.();shell.showSnapFeedback?.({x:{type:'equal-distance',gap:20},y:{type:'equal-distance',gap:20}},{clientX:430,clientY:300});w.dispatchEvent(new w.Event('resize'));await sleep(180);
  }else if(mode==='guides-px'){
    seedCanvas(app);const unit=d.querySelector('#artboardUnit');if(unit){unit.value='px';unit.dispatchEvent(new w.Event('change',{bubbles:true}));}d.querySelector('#app').dataset.rulers='true';app.addGuide?.({id:'visual-guide-px-x',orientation:'vertical',position:180});app.addGuide?.({id:'visual-guide-px-y',orientation:'horizontal',position:150});w.dispatchEvent(new w.Event('resize'));await sleep(180);
  }else if(mode==='tooltip'){
    seedCanvas(app);const target=d.querySelector('[data-tool="eraser"]');target?.focus();await sleep(100);
  }else if(mode==='focus'){
    seedCanvas(app);shell.open('layers');await sleep(80);const target=d.querySelector('.panel-dock-button[aria-pressed="true"]')||d.querySelector('#toolbarLayoutToggle');target?.focus();await sleep(100);
  }else{
    seedCanvas(app);await sleep(100);
  }

  const evidence=collectCommon(w,d,shell,extra);
  window.__QA_EVIDENCE__=evidence;
  document.documentElement.dataset.qaReady='true';
  await post({status:'PASS',...evidence});
}catch(error){
  const evidence={status:'ERROR',mode,error:String(error?.stack||error)};
  window.__QA_EVIDENCE__=evidence;
  document.documentElement.dataset.qaReady='error';
  await post(evidence).catch(()=>{});
}
</script>

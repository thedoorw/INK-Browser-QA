<!doctype html>
<meta charset="utf-8">
<title>INK PvsI Pack 5 Live Evidence</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7e7e7}
#liveFrame{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#e7e7e7}
#pvsiMetrics{display:none}
</style>
<iframe id="liveFrame" src="../../product/source/?pvsi-pack5=1"></iframe>
<pre id="pvsiMetrics">{}</pre>
<script type="module">
try {
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const mode=new URL(location.href).searchParams.get('mode')||'prefs-general';
  const frame=document.querySelector('#liveFrame');
  const waitFrame=()=>frame.contentDocument?.readyState==='complete'
    ? Promise.resolve()
    : new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('iframe timeout')),30000);frame.onload=()=>{clearTimeout(t);resolve();}});
  const waitNextFrame=()=>new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('iframe reload timeout')),30000);frame.onload=()=>{clearTimeout(t);resolve();}});
  await waitFrame();
  let w=frame.contentWindow,d=frame.contentDocument;
  for(let i=0;i<240&&!(w.INK_APP&&w.INK_WEB_SHELL);i++)await sleep(100);
  if(!(w.INK_APP&&w.INK_WEB_SHELL))throw new Error('INK unavailable');
  const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom,display:s.display,visibility:s.visibility,backgroundColor:s.backgroundColor,color:s.color,border:s.border,borderRadius:s.borderRadius,padding:s.padding,fontSize:s.fontSize,lineHeight:s.lineHeight,boxShadow:s.boxShadow,backdropFilter:s.backdropFilter||s.webkitBackdropFilter||'none'}};
  const visible=e=>{if(!e||e.hidden)return false;const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
  const safeText=e=>String(e?.textContent||e?.value||'').replace(/\s+/g,' ').trim();
  const q=s=>d.querySelector(s),qa=s=>[...d.querySelectorAll(s)];
  const shell=w.INK_WEB_SHELL;
  const prefCategory=async category=>{
    for(let i=0;i<200&&!q('[data-preference-category]');i++)await sleep(50);
    if(!q('[data-preference-category]'))throw new Error('Preferences controller unavailable');
    w.dispatchEvent(new w.CustomEvent('ink:branding-open',{detail:{category}}));await sleep(180);
    q('[data-preference-category="'+category+'"]')?.click();await sleep(100);
  };
  const panel=async id=>{shell.open(id);await sleep(140);};

  const prefMap={
    'prefs-general':'general','prefs-interface':'interface','prefs-tools':'tools','prefs-canvas':'canvas',
    'prefs-guides':'guides','prefs-performance':'performance','prefs-storage':'storage','prefs-branding':'branding'
  };
  const panelMap={
    'creative-reference':'reference','panel-libraries':'libraries','creative-compose':'compose','creative-chat':'chat','creative-revision':'revision',
    'panel-properties':'properties','panel-color':'color','panel-adjustments':'adjustments','panel-history':'history','panel-channels':'channels','panel-pages':'pages'
  };

  if(prefMap[mode]) await prefCategory(prefMap[mode]);
  else if(panelMap[mode]) await panel(panelMap[mode]);

  if(mode!=='audit'){
    document.querySelector('#pvsiMetrics').textContent=JSON.stringify({status:'PASS',mode});
    document.documentElement.dataset.qaReady='true';document.title='QA_READY';return;
  }

  /* Compact audit: individual screenshot modes already cover every category/panel.
     Keep the machine audit focused on invariant geometry, Light surfaces,
     encapsulated native controls, keyboard close and persistence/reload. */
  await prefCategory('general');
  const dialog=q('.branding-settings-dialog'),titlebar=q('.branding-settings-dialog>.panel-header'),nav=q('.preferences-categories');
  const navRows=qa('.preferences-categories button').map(e=>({text:safeText(e),rect:rect(e)}));
  const preferences={
    dialog:rect(dialog),titlebar:rect(titlebar),nav:rect(nav),
    activeGeneral:rect(q('[data-preference-category="general"]')),
    navRows
  };
  const closeButton=q('#closeBrandingSettings');
  closeButton?.focus();
  d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  await sleep(40);
  const escapeClosed=Boolean(q('#brandingSettingsDialog')?.hidden);

  await panel('reference');
  let root=q('#creativeWorkspace');
  const reference={
    nativeVisibleFiles:qa('#creativeWorkspace input[type="file"]').filter(visible).length,
    picker:rect(root?.querySelector('.creative-file-picker')),
    status:rect(root?.querySelector('.creative-workspace-status'))
  };
  await panel('chat');
  root=q('#creativeWorkspace');
  const chat={
    transcript:rect(root?.querySelector('.creative-chat-transcript')),
    prompt:rect(root?.querySelector('.creative-workspace-prompt textarea')),
    emptyText:safeText(root?.querySelector('.creative-chat-empty'))
  };
  await panel('libraries');
  const libraries={
    searchLabel:safeText(q('.shell-library-search-label span')),
    placeholder:q('#shellLibrarySearch')?.getAttribute('placeholder')||'',
    status:safeText(q('#shellLibraryStatus')),
    inspectLabel:safeText(q('.shell-library-inspect-label span'))
  };
  await panel('channels');
  const channels={empty:safeText(q('#uiBChannelsList'))};

  await prefCategory('branding');
  const name=q('#brandingAppName'),title=q('#brandingAppTitle');
  name.value='INK QA PERSIST';name.dispatchEvent(new w.Event('input',{bubbles:true}));
  title.value='INK QA Persist Window';title.dispatchEvent(new w.Event('input',{bubbles:true}));
  await sleep(70);
  const activeBeforeReload=JSON.parse(w.localStorage.getItem('ink.web.branding.active.v1')||'null');
  q('#brandingPromoteDefault')?.click();await sleep(30);
  const promoted=JSON.parse(w.localStorage.getItem('ink.web.branding.product-default.v1')||'null');
  q('#brandingRestoreFactory')?.click();await sleep(30);
  const restored={
    active:JSON.parse(w.localStorage.getItem('ink.web.branding.active.v1')||'null'),
    productDefault:w.localStorage.getItem('ink.web.branding.product-default.v1'),
    name:q('#brandingAppName')?.value
  };
  name.value='INK QA PERSIST';name.dispatchEvent(new w.Event('input',{bubbles:true}));
  title.value='INK QA Persist Window';title.dispatchEvent(new w.Event('input',{bubbles:true}));
  await sleep(40);
  const firstPaint={styleText:q('#inkFirstPaintStyle')?.textContent||'',body:rect(d.body),app:rect(q('#app'))};

  const reloadWait=waitNextFrame();
  frame.src='../../product/source/?pvsi-pack5-reload=1';
  await reloadWait;
  w=frame.contentWindow;d=frame.contentDocument;
  for(let i=0;i<240&&!(w.INK_APP&&w.INK_WEB_SHELL);i++)await sleep(50);
  const reloadApplied={
    title:d.title,
    brandName:d.querySelector('[data-brand-app-name]')?.textContent?.trim()||null,
    stored:JSON.parse(w.localStorage.getItem('ink.web.branding.active.v1')||'null')
  };

  const metrics={
    status:'PASS',mode,target:new URL(location.href).searchParams.get('target')||null,
    viewport:{width:w.innerWidth,height:w.innerHeight,dpr:w.devicePixelRatio},
    preferences,escapeClosed,reference,chat,libraries,channels,
    persistence:{activeBeforeReload,promoted,restored,reloadApplied},firstPaint
  };
  if(Math.round(preferences.dialog.width)!==826||Math.round(preferences.dialog.height)!==624)throw new Error('Preferences outer geometry drift '+JSON.stringify(preferences.dialog));
  if(Math.round(preferences.titlebar.height)!==31||Math.round(preferences.nav.width)!==125)throw new Error('Preferences title/nav geometry drift '+JSON.stringify({titlebar:preferences.titlebar,nav:preferences.nav}));
  if(preferences.navRows.length!==8||preferences.navRows.some(v=>Math.round(v.rect.height)!==20))throw new Error('Preferences category row pitch/count drift '+JSON.stringify(preferences.navRows));
  if(!escapeClosed)throw new Error('Preferences Escape close failed');
  if(reference.nativeVisibleFiles!==0||!reference.picker||reference.status?.display!=='none')throw new Error('Reference encapsulation/status drift '+JSON.stringify(reference));
  if(chat.transcript?.backgroundColor!=='rgb(255, 255, 255)'||chat.prompt?.backgroundColor!=='rgb(255, 255, 255)')throw new Error('CHAT Light surface drift '+JSON.stringify(chat));
  if(libraries.searchLabel!=='搜尋'||libraries.placeholder!=='搜尋資料庫'||!libraries.inspectLabel.includes('唯讀'))throw new Error('Libraries visible localization drift '+JSON.stringify(libraries));
  if(!channels.empty.includes('選取點陣影像'))throw new Error('Channels visible localization drift '+JSON.stringify(channels));
  if(activeBeforeReload?.name!=='INK QA PERSIST'||promoted?.name!=='INK QA PERSIST')throw new Error('branding persistence/promote failed');
  if(restored.productDefault!==null||restored.active?.name!=='INK'||restored.name!=='INK')throw new Error('branding restore-factory failed '+JSON.stringify(restored));
  if(reloadApplied.stored?.name!=='INK QA PERSIST'||reloadApplied.title!=='INK QA Persist Window')throw new Error('branding reload persistence failed');
  document.querySelector('#pvsiMetrics').textContent=JSON.stringify(metrics);document.documentElement.dataset.qaReady='true';document.title='QA_READY';
} catch(error) {
  document.querySelector('#pvsiMetrics').textContent=JSON.stringify({status:'ERROR',mode,error:String(error?.stack||error)});
  document.documentElement.dataset.qaReady='error';
  document.title='QA_ERROR';
}
</script>

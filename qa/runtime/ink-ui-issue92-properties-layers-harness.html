<!doctype html><meta charset="utf-8"><title>INK Properties Layers Interaction</title>
<iframe id="f" src="/?fresh=1" style="width:1280px;height:800px;border:0"></iframe>
<script type="module">
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),frame=document.querySelector('#f');
const post=e=>fetch('/__qa_result',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(e)});
try{
  await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('iframe timeout')),30000);frame.onload=()=>{clearTimeout(t);resolve()};});
  const w=frame.contentWindow,d=frame.contentDocument;
  for(let i=0;i<240&&!(w.INK_APP&&w.INK_WEB_SHELL);i++)await sleep(100);
  const app=w.INK_APP,shell=w.INK_WEB_SHELL;if(!app||!shell)throw new Error('INK unavailable');
  const visible=e=>{if(!e||e.hidden)return false;const s=w.getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
  const q=s=>d.querySelector(s),qa=s=>[...d.querySelectorAll(s)];
  const path={id:'prop-path',type:'path',name:'Property Path',matrix:[1,0,0,1,100,100],opacity:.8,visible:true,fill:'#d7889b',stroke:'#55343d',strokeWidth:2,subpaths:[{closed:true,anchors:[{x:0,y:0,in:{x:0,y:0},out:{x:0,y:0},mode:'corner'},{x:40,y:0,in:{x:0,y:0},out:{x:0,y:0},mode:'corner'},{x:40,y:40,in:{x:0,y:0},out:{x:0,y:0},mode:'corner'},{x:0,y:40,in:{x:0,y:0},out:{x:0,y:0},mode:'corner'}]}]};
  app.layer().objects.push(path);app.refreshAll();app.selectOnly(app.layer().id,path.id);shell.open('properties');await sleep(100);
  const j03=visible(q('#objectOpacity'))&&Boolean(q('#shellPathFill')&&visible(q('#shellPathFill')))&&Boolean(q('#shellPathStroke')&&visible(q('#shellPathStroke')));
  const j04=Boolean(q('#shellMaterialSelect')&&visible(q('#shellMaterialSelect'))&&q('#shellMaterialApply')&&q('#shellMaterialRemove')&&q('#shellMaterialState'));
  const frameObj=app.frameSelection({name:'Property Frame',padding:10});
  frameObj.layout={schema:'INK-LAYOUT-1',mode:'horizontal',gap:8,padding:{top:4,right:4,bottom:4,left:4},align:{main:'start',cross:'center'},sizing:{horizontal:'fixed',vertical:'fixed'}};
  const child=frameObj.children[0];child.layoutItem={schema:'INK-LAYOUT-ITEM-1',participation:'flow',sizing:{horizontal:'hug',vertical:'hug'},fixedSize:{width:40,height:40},constraints:{horizontal:'start',vertical:'start'}};
  app.refreshAll();app.selectOnly(app.layer().id,frameObj.id);shell.open('properties');await sleep(60);
  const j06=Boolean(q('#shellFrameLayout')&&visible(q('#shellFrameLayout')));
  app.selectOnly(app.layer().id,child.id);shell.open('properties');await sleep(60);
  const j07=Boolean(q('#shellLayoutItem')&&visible(q('#shellLayoutItem')));
  const definition=app.registerComponent(frameObj.id,'Property Component');
  const instance=app.createInstance(definition.id,{matrix:[1,0,0,1,260,120]});
  app.refreshAll();app.selectOnly(app.layer().id,instance.id);shell.open('properties');await sleep(60);
  const j08=Boolean(q('#shellComponentState')&&visible(q('#shellComponentState')));
  q('#settingsToggle')?.click();await sleep(30);
  const settings=q('#canvasSettings');
  const j09=Boolean(settings&&!settings.hidden&&q('#artboardPreset')&&q('#layoutViewportScale')&&q('#layoutViewportX')&&q('#layoutViewportY'));
  q('#settingsToggle')?.click();
  shell.open('layers');await sleep(80);
  const childRow=q('#layersList [data-object-id="'+child.id+'"]');
  const k10=Boolean(childRow&&childRow.querySelector('[data-reparent-action]'));
  const beforeLayers=app.page().layers.length;
  const layerNew=q('[data-ui-b-command="layer-new"]');
  layerNew?.click();await sleep(80);
  const afterLayers=app.page().layers.length,renderedLayers=qa('#layersList .layer-row').length;
  const k13=Boolean(layerNew&&afterLayers===beforeLayers+1&&renderedLayers===afterLayers);
  const checks=[
    {id:'J03',pass:j03,detail:{opacity:visible(q('#objectOpacity')),fill:Boolean(q('#shellPathFill')),stroke:Boolean(q('#shellPathStroke'))}},
    {id:'J04',pass:j04,detail:{select:Boolean(q('#shellMaterialSelect')),apply:Boolean(q('#shellMaterialApply')),remove:Boolean(q('#shellMaterialRemove')),state:Boolean(q('#shellMaterialState'))}},
    {id:'J06',pass:j06,detail:{frameLayout:Boolean(q('#shellFrameLayout'))}},
    {id:'J07',pass:j07,detail:{layoutItem:Boolean(q('#shellLayoutItem'))}},
    {id:'J08',pass:j08,detail:{componentState:Boolean(q('#shellComponentState'))}},
    {id:'J09',pass:j09,detail:{settings:Boolean(settings),artboard:Boolean(q('#artboardPreset')),viewport:Boolean(q('#layoutViewportScale'))}},
    {id:'K10',pass:k10,detail:{childRow:Boolean(childRow),reparent:Boolean(childRow?.querySelector('[data-reparent-action]'))}},
    {id:'K13',pass:k13,detail:{layerNew:Boolean(layerNew),beforeLayers,afterLayers,renderedLayers}}
  ];
  const failed=checks.filter(x=>!x.pass);
  await post({schema:'INK-UI-ISSUE92-PROPERTIES-LAYERS',version:1,status:failed.length?'FAIL':'PASS',checks,summary:{total:8,passed:8-failed.length,failed:failed.length}});
}catch(error){await post({schema:'INK-UI-ISSUE92-PROPERTIES-LAYERS',version:1,status:'ERROR',checks:[],summary:{total:8,passed:0,failed:8},error:String(error?.stack||error)});}
</script>

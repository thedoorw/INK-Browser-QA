<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>INK-WEB-UI-001 Browser QA Harness</title>
  <style>
    html,body{margin:0;background:#111;color:#eee;font:13px/1.4 Consolas,monospace}
    iframe{display:block;width:1280px;height:800px;border:0;background:#fff}
    pre{white-space:pre-wrap;word-break:break-word;padding:12px}
  </style>
</head>
<body data-qa-status="RUNNING">
<iframe id="inkFrame" allow="fullscreen" src="/index.html?fresh=1&ink-ui-qa=1&ink-qa=1"></iframe>
<pre id="inkQaResult">INK_UI_QA_RUNNING</pre>
<script>
(() => {
  const results = [];
  const frame = document.querySelector('#inkFrame');
  const output = document.querySelector('#inkQaResult');
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const serialize = value => {
    try { return JSON.parse(JSON.stringify(value)); }
    catch { return String(value); }
  };
  const record = (name, pass, detail = null) => {
    results.push({ name, pass: Boolean(pass), detail: serialize(detail) });
    return Boolean(pass);
  };
  const waitFor = async (predicate, timeout = 12000, step = 50) => {
    const started = performance.now();
    let lastError = null;
    while (performance.now() - started < timeout) {
      try {
        const value = await predicate();
        if (value) return value;
      } catch (error) {
        lastError = error;
      }
      await sleep(step);
    }
    throw lastError || new Error('timeout');
  };
  const visible = (doc, selector) => {
    const el = doc.querySelector(selector);
    if (!el) return false;
    const style = getComputedStyle(el);
    const rect = el.getBoundingClientRect();
    return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
  };
  const rectOf = (doc, selector) => {
    const rect = doc.querySelector(selector)?.getBoundingClientRect();
    return rect ? { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom, width: rect.width, height: rect.height } : null;
  };
  const near = (value, target, tolerance = 1) => Math.abs(value - target) <= tolerance;
  const canvasPixel = (canvas, xCss, yCss) => {
    const ctx = canvas.getContext('2d');
    const sx = canvas.width / Math.max(1, canvas.clientWidth);
    const sy = canvas.height / Math.max(1, canvas.clientHeight);
    return Array.from(ctx.getImageData(Math.round(xCss * sx), Math.round(yCss * sy), 1, 1).data);
  };
  const dispatchKey = (win, key, init = {}) => {
    win.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...init }));
  };
  async function publishResult(payload) {
    document.body.dataset.qaStatus = payload.status;
    output.textContent = 'INK_UI_QA_RESULT:' + JSON.stringify(payload);
    const transport = {
      schema: 'INK-WEB-UI-001-BROWSER-QA-TRANSPORT',
      version: 1,
      status: payload.status,
      formatVersion: Number(payload.formatVersion || 0),
      summary: payload.summary || {
        total: Array.isArray(payload.checks) ? payload.checks.length : 0,
        passed: 0,
        failed: Array.isArray(payload.checks) ? payload.checks.length : 1
      },
      fatal: payload.fatal ? 'BROWSER_HARNESS_FATAL' : null
    };
    try {
      await fetch('/__qa_result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...transport, checks: payload.checks, fatalDetail: payload.fatal || null }),
        cache: 'no-store'
      });
    } catch {}
  }

  async function run() {
    try {
      await waitFor(() => frame.contentWindow?.INK_TEST && frame.contentWindow?.INK_WEB_SHELL, 16000);
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const app = win.INK_APP;
      const test = win.INK_TEST;
      const shell = win.INK_WEB_SHELL;
      await sleep(350);

      const initialShell = shell.state();
      const initialStageWidth = doc.querySelector('#stageWrap').getBoundingClientRect().width;
      const initialChatController = app.chatBoundedEdit;
      const initialRevisionController = app.revisions;
      const geometry1280 = {
        viewport: { width: win.innerWidth, height: win.innerHeight, dpr: win.devicePixelRatio },
        menu: rectOf(doc, '.menu-strip'),
        options: rectOf(doc, '.topbar'),
        contextual: rectOf(doc, '#contextualOptions'),
        stage: rectOf(doc, '#stageWrap'),
        rail: rectOf(doc, '.tool-rail'),
        dock: rectOf(doc, '#panelDock'),
        docTitle: rectOf(doc, '#docTitle')
      };

      record('Photoshop shell viewport is 1280 CSS px', near(geometry1280.viewport.width, 1280, 1), geometry1280);
      record('menu row is 24 px', near(geometry1280.menu?.height, 24, 1) && near(geometry1280.menu?.top, 0, 1), geometry1280.menu);
      record('Phase C compact options row is 32 px at y=24', near(geometry1280.options?.height, 32, 1) && near(geometry1280.options?.top, 24, 1), geometry1280.options);
      record('contextual controls occupy the same second row', near(geometry1280.contextual?.top, geometry1280.options?.top, 1) && near(geometry1280.contextual?.bottom, geometry1280.options?.bottom, 1), { options: geometry1280.options, contextual: geometry1280.contextual });
      record('Phase C workspace origin is y=56', near(geometry1280.stage?.top, 56, 1) && near(geometry1280.rail?.top, 56, 1) && near(geometry1280.dock?.top, 56, 1), geometry1280);
      record('left rail is edge-attached 40 px', near(geometry1280.rail?.left, 0, 1) && near(geometry1280.rail?.width, 40, 1), geometry1280.rail);
      record('workspace begins immediately after left rail', near(geometry1280.stage?.left, geometry1280.rail?.right, 1), { stage: geometry1280.stage, rail: geometry1280.rail });
      record('right dock is edge-attached 40 px', near(geometry1280.dock?.right, 1280, 1) && near(geometry1280.dock?.width, 40, 1), geometry1280.dock);
      record('workspace ends immediately before compact dock', near(geometry1280.stage?.right, geometry1280.dock?.left, 1), { stage: geometry1280.stage, dock: geometry1280.dock });
      record('document title is 220–240 px', geometry1280.docTitle?.width >= 220 && geometry1280.docTitle?.width <= 240, geometry1280.docTitle);

      record('title identity is INK v0.1 · Web', doc.title === 'INK v0.1 · Web', doc.title);
      record('FORMAT_VERSION remains 4', test.architecture().formatVersion === 4, test.architecture().formatVersion);
      record('active runtime display version is 0.1', test.version === '0.1', test.version);
      record('historical product identity absent from active shell', !/1\.6\.5|1\.5\.1 RC/.test(doc.documentElement.textContent + doc.title));
      record('initial Web view is canvas-first', initialShell.collapsed && !app.creativeWorkspace?.open && !doc.querySelector('#app').classList.contains('inspector-open'), initialShell);
      record('left tool rail remains visible', visible(doc, '.tool-rail') && doc.querySelectorAll('.tool-rail [data-tool], .tool-rail [data-tool-stack]').length >= 6);
      record('right panel dock starts compact', visible(doc, '#panelDock') && initialShell.dockWidth >= 32 && initialShell.dockWidth <= 48, initialShell);
      record('initial stage reserves 40 px rail and 40 px dock', near(initialStageWidth, frame.clientWidth - 80, 2), { frameWidth: frame.clientWidth, stageWidth: initialStageWidth, dockWidth: initialShell.dockWidth });

      frame.style.height = '1024px';
      await sleep(220);
      const geometry1280x1024 = {
        viewport: [win.innerWidth, win.innerHeight],
        stage: rectOf(doc, '#stageWrap'),
        dock: rectOf(doc, '#panelDock'),
        status: rectOf(doc, '.statusbar')
      };
      record('UI-DEBT-001 1280x1024 collapsed shell remains fully contained',
        near(win.innerWidth, 1280, 1) &&
        near(win.innerHeight, 1024, 1) &&
        near(geometry1280x1024.stage?.right, geometry1280x1024.dock?.left, 1) &&
        geometry1280x1024.stage?.bottom <= geometry1280x1024.status?.top + 1,
        geometry1280x1024);
      frame.style.height = '800px';
      await sleep(220);

      const parseColor = value => (value.match(/[\d.]+/g) || []).map(Number);
      const relativeLuminance = rgb => {
        const channels = rgb.slice(0, 3).map(value => {
          const channel = value / 255;
          return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
        });
        return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
      };
      const textContrast = element => {
        const foreground = parseColor(getComputedStyle(element).color);
        let background = [255, 255, 255];
        for (let current = element; current; current = current.parentElement) {
          const color = parseColor(getComputedStyle(current).backgroundColor);
          if (color.length >= 3 && (color[3] ?? 1) === 1) { background = color; break; }
        }
        const light = Math.max(relativeLuminance(foreground), relativeLuminance(background));
        const dark = Math.min(relativeLuminance(foreground), relativeLuminance(background));
        return (light + 0.05) / (dark + 0.05);
      };
      const typographyDiag = {
        advanced: {
          fontSize: parseFloat(getComputedStyle(doc.querySelector('#contextualAdvancedBtn')).fontSize),
          contrast: textContrast(doc.querySelector('#contextualAdvancedBtn'))
        },
        inspectorTitle: {
          fontSize: parseFloat(getComputedStyle(doc.querySelector('.inspector-head strong')).fontSize),
          contrast: textContrast(doc.querySelector('.inspector-head strong'))
        },
        inspectorTab: {
          fontSize: parseFloat(getComputedStyle(doc.querySelector('.inspector-tab')).fontSize),
          contrast: textContrast(doc.querySelector('.inspector-tab'))
        },
        contextLabel: {
          fontSize: parseFloat(getComputedStyle(doc.querySelector('.context-control-label')).fontSize),
          contrast: textContrast(doc.querySelector('.context-control-label'))
        }
      };
      record('UI-MAINT-002 desktop typography readability lift is active',
        typographyDiag.advanced.fontSize >= 10 &&
        typographyDiag.inspectorTitle.fontSize >= 11 &&
        typographyDiag.inspectorTab.fontSize >= 10 &&
        typographyDiag.contextLabel.fontSize >= 10 &&
        Object.values(typographyDiag).every(sample => sample.contrast >= 4.5),
        typographyDiag);

      shell.open('layers');
      await sleep(260);
      const layersState = shell.state();
      record('Layers opens as primary Inspector panel', layersState.activePanel === 'layers' && layersState.inspectorOpen && !layersState.creativeOpen, layersState);
      const expandedGeometry = {
        stage: rectOf(doc, '#stageWrap'),
        panel: rectOf(doc, '#inspector'),
        dock: rectOf(doc, '#panelDock')
      };
      record('default primary panel is 252 ±8 px', layersState.panelWidth >= 244 && layersState.panelWidth <= 260, { shell: layersState, geometry: expandedGeometry });
      record('primary panel fits exactly between canvas and dock', near(expandedGeometry.stage?.right, expandedGeometry.panel?.left, 1) && near(expandedGeometry.panel?.right, expandedGeometry.dock?.left, 1), expandedGeometry);
      record('canvas resizes for expanded panel', layersState.stageWidth < initialStageWidth - 235, { initialStageWidth, expandedStageWidth: layersState.stageWidth });

      const layerSection = doc.querySelector('.inspector-section.active');
      const panelContainment1280 = {
        inspector: rectOf(doc, '#inspector'),
        section: rectOf(doc, '.inspector-section.active'),
        inspectorOverflow: getComputedStyle(doc.querySelector('#inspector')).overflow,
        overflowY: getComputedStyle(layerSection).overflowY,
        overflowX: getComputedStyle(layerSection).overflowX,
        clientWidth: layerSection.clientWidth,
        scrollWidth: layerSection.scrollWidth
      };
      record('UI-MAINT-002 primary Inspector owns vertical scroll without horizontal overflow',
        panelContainment1280.inspectorOverflow === 'hidden' &&
        ['auto','scroll'].includes(panelContainment1280.overflowY) &&
        panelContainment1280.overflowX === 'hidden' &&
        panelContainment1280.scrollWidth <= panelContainment1280.clientWidth + 1,
        panelContainment1280);

      const layersBefore = test.summary().layers;
      doc.querySelector('#addLayerBtn').click();
      await sleep(80);
      const afterAdd = test.summary().layers;
      doc.querySelector('#duplicateLayerBtn').click();
      await sleep(80);
      const afterDuplicate = test.summary().layers;
      doc.querySelector('#deleteLayerBtn').click();
      await sleep(80);
      const afterDelete = test.summary().layers;
      record('Layers add operation works', afterAdd === layersBefore + 1, { layersBefore, afterAdd });
      record('Layers duplicate operation works', afterDuplicate === layersBefore + 2, { afterDuplicate });
      record('Layers delete operation works', afterDelete === layersBefore + 1, { afterDelete });

      shell.open('history');
      await sleep(100);
      record('History directly reachable', shell.state().activePanel === 'history' && visible(doc, '#historyList'), shell.state());
      const beforeUndo = test.summary();
      doc.querySelector('#undoBtn').click();
      await sleep(100);
      const afterUndo = test.summary();
      doc.querySelector('#redoBtn').click();
      await sleep(100);
      const afterRedo = test.summary();
      record('History undo works', afterUndo.layers === layersBefore + 2 && afterUndo.redo >= 1, { beforeUndo, afterUndo });
      record('History redo works', afterRedo.layers === layersBefore + 1, afterRedo);

      for (const id of ['reference','compose','chat','revision']) {
        shell.open(id);
        await sleep(90);
        const routeState = shell.state();
        record(id + ' dock entry reaches existing Creative Workspace stage',
          routeState.activePanel === id &&
          routeState.creativeOpen &&
          !routeState.inspectorOpen &&
          app.creativeWorkspace?.stage === id &&
          app.creativeWorkspace?.open,
          routeState);
      }

      shell.open('chat');
      await sleep(80);
      shell.close();
      await sleep(260);
      record('CHAT close preserves underlying controller', app.chatBoundedEdit === initialChatController && Boolean(app.chatBoundedEdit), { installed: Boolean(app.chatBoundedEdit) });
      record('Revision close preserves underlying controller', app.revisions === initialRevisionController && Boolean(app.revisions), { installed: Boolean(app.revisions) });
      record('panel collapse restores canvas width', shell.state().collapsed && shell.state().stageWidth > initialStageWidth - 10, shell.state());

      const windowButton = Array.from(doc.querySelectorAll('.application-menus button')).find(button => button.textContent.trim() === '視窗');
      windowButton?.click();
      await sleep(50);
      record('Window menu coherently exposes dock panels', visible(doc, '#panelWindowMenu') && doc.querySelectorAll('#panelWindowMenu [data-shell-panel]').length === 7);

      const buttonsWired = ['newBtn','openBtn','saveBtn','exportBtn','fullscreenToggle'].every(id => typeof doc.querySelector('#' + id)?.onclick === 'function');
      record('New/Open/Save/Export/Fullscreen command bindings remain wired', buttonsWired);

      const fileMenuToggle = doc.querySelector('#fileMenuToggle');
      fileMenuToggle?.click();
      await sleep(50);
      const fileMenu = doc.querySelector('#fileMenu');
      const fileCommands = [...doc.querySelectorAll('#fileMenu [data-file-command]')].map(button => button.dataset.fileCommand);
      const topFileHidden = ['newBtn','openBtn','saveBtn','exportBtn'].every(id => getComputedStyle(doc.querySelector('#' + id)).display === 'none');
      const desktopWorkspaceHidden = getComputedStyle(doc.querySelector('#workspaceSwitch')).display === 'none';
      record('Phase C File menu is the visible desktop Primary Home',
        visible(doc, '#fileMenu') &&
        JSON.stringify(fileCommands) === JSON.stringify(['new','open','save','export']) &&
        topFileHidden,
        { fileCommands, topFileHidden });
      record('Phase C desktop workspace switch is not an equal-weight duplicate',
        desktopWorkspaceHidden && visible(doc, '#workspaceMenuToggle'),
        { desktopWorkspaceHidden, workspaceMenuToggle: visible(doc, '#workspaceMenuToggle') });

      doc.querySelector('#fileMenu [data-file-command="export"]')?.click();
      await sleep(60);
      record('File menu Export reaches the existing export command', (() => {
        const dialog = doc.querySelector('#exportDialog');
        return Boolean(dialog && !dialog.hidden);
      })());
      const cancelExport = doc.querySelector('#cancelExportBtn');
      if (cancelExport && !cancelExport.hidden) cancelExport.click();

      const toolRailToggle = doc.querySelector('#toolRailColumnsToggle');
      const toolOrder = () => [...doc.querySelectorAll('.tool-rail [data-tool]')].map(button => button.dataset.tool);
      const initialToolOrder = toolOrder();
      if (shell.state().toolColumns === 2) toolRailToggle?.click();
      await sleep(80);
      const oneColumn = {
        shell: shell.state(),
        rail: rectOf(doc, '.tool-rail'),
        stage: rectOf(doc, '#stageWrap'),
        order: toolOrder()
      };
      toolRailToggle?.click();
      await sleep(100);
      const twoColumn = {
        shell: shell.state(),
        rail: rectOf(doc, '.tool-rail'),
        stage: rectOf(doc, '#stageWrap'),
        order: toolOrder(),
        stored: win.localStorage.getItem('ink.web.ui.toolbar-columns.v0.1')
      };
      record('Phase D single-column mode remains the compact baseline',
        oneColumn.shell.toolColumns === 1 && near(oneColumn.rail?.width, 40, 1) && near(oneColumn.stage?.left, oneColumn.rail?.right, 1),
        oneColumn);
      record('Phase D two-column mode changes layout only',
        twoColumn.shell.toolColumns === 2 &&
        near(twoColumn.rail?.width, 72, 1) &&
        near(twoColumn.stage?.left, twoColumn.rail?.right, 1) &&
        JSON.stringify(twoColumn.order) === JSON.stringify(initialToolOrder) &&
        twoColumn.stored === '2',
        twoColumn);
      toolRailToggle?.click();
      await sleep(100);
      record('Phase D toolbar returns to one column without command identity drift',
        shell.state().toolColumns === 1 &&
        JSON.stringify(toolOrder()) === JSON.stringify(initialToolOrder) &&
        win.localStorage.getItem('ink.web.ui.toolbar-columns.v0.1') === '1',
        { shell: shell.state(), order: toolOrder() });

      const fullscreenDiag = test.fullscreen();
      record('Fullscreen API remains supported and command surface wired', fullscreenDiag.supported && typeof doc.querySelector('#fullscreenToggle').onclick === 'function', fullscreenDiag);

      dispatchKey(win, '2', { ctrlKey: true });
      await sleep(80);
      const shortcutLayout = test.workspace().activeSpace;
      dispatchKey(win, '1', { ctrlKey: true });
      await sleep(80);
      const shortcutCreation = test.workspace().activeSpace;
      dispatchKey(win, 'v');
      await sleep(60);
      const shortcutTool = test.summary().tool;
      record('keyboard workspace shortcuts preserved', shortcutLayout === 'layout' && shortcutCreation === 'creation', { shortcutLayout, shortcutCreation });

      app.fitArtboard({ switchSpace: true });
      await sleep(180);
      const layoutCanvas = doc.querySelector('#stage');
      const layoutStage = rectOf(doc, '#stageWrap');
      const layoutPixels = {
        corner: canvasPixel(layoutCanvas, 8, 8),
        center: canvasPixel(layoutCanvas, layoutCanvas.clientWidth / 2, layoutCanvas.clientHeight / 2),
        stage: layoutStage,
        artboard: test.artboard()
      };
      const luminance = rgba => (rgba?.[0] || 0) + (rgba?.[1] || 0) + (rgba?.[2] || 0);
      record('Layout shows dark workbench around real A4 paper', luminance(layoutPixels.corner) < 210 && luminance(layoutPixels.center) > 600 && luminance(layoutPixels.center) - luminance(layoutPixels.corner) > 390, layoutPixels);
      test.switchWorkspace('creation');
      await sleep(60);

      record('keyboard tool shortcut sample preserved', shortcutTool === 'select', shortcutTool);

      const contextMatrix = [];
      for (const [key, tool, mode] of [['b','pen','draw'],['n','pencil','draw'],['m','marker','draw'],['i','brush','draw'],['a','airbrush','draw'],['e','eraser','eraser'],['s','shape','shape'],['t','text','text']]) {
        dispatchKey(win, key);
        await sleep(45);
        const root = doc.querySelector('#contextualOptions');
        contextMatrix.push({ key, tool: app.tool, contextTool: root.dataset.contextTool, mode: root.dataset.contextMode });
        record('contextual tool route: ' + tool, app.tool === tool && root.dataset.contextTool === tool && root.dataset.contextMode === mode, contextMatrix.at(-1));
      }
      test.addDemo();
      test.selectAll();
      await sleep(80);
      const selectionContext = doc.querySelector('#contextualOptions');
      record('Selection actions become the contextual surface', selectionContext.dataset.contextMode === 'selection' && visible(doc, '#selectionBar') && ['duplicate','group','front','alignCenter','delete'].every(action => doc.querySelector('[data-selection-action="' + action + '"]')), { mode: selectionContext.dataset.contextMode, count: test.summary().selection });
      app.clearSelection();
      await sleep(50);

      // INK-UI-MAINT-002: Properties uses one synchronized authority.
      dispatchKey(win, 'b');
      await sleep(60);
      shell.close();
      await sleep(100);
      const advanced = doc.querySelector('#contextualAdvancedBtn');
      advanced.click();
      await sleep(140);
      const advancedOpen = {
        shell: shell.state(),
        pressed: advanced.getAttribute('aria-pressed'),
        expanded: advanced.getAttribute('aria-expanded'),
        active: advanced.classList.contains('active')
      };
      record('UI-MAINT-002 Advanced opens Properties and exposes active state',
        advancedOpen.shell.activePanel === 'properties' &&
        advancedOpen.pressed === 'true' &&
        advancedOpen.expanded === 'true' &&
        advancedOpen.active,
        advancedOpen);
      advanced.click();
      await sleep(140);
      const advancedClosed = {
        shell: shell.state(),
        pressed: advanced.getAttribute('aria-pressed'),
        expanded: advanced.getAttribute('aria-expanded'),
        active: advanced.classList.contains('active')
      };
      record('UI-MAINT-002 Advanced second press closes the same primary panel',
        advancedClosed.shell.collapsed &&
        advancedClosed.pressed === 'false' &&
        advancedClosed.expanded === 'false' &&
        !advancedClosed.active,
        advancedClosed);

      shell.open('properties');
      await sleep(120);
      const collapse = doc.querySelector('#inspectorEdgeToggle');
      const legacyToggle = doc.querySelector('#inspectorToggle');
      const propertiesDock = doc.querySelector('#panelDock [data-shell-panel="properties"]');
      const legacyHidden = getComputedStyle(legacyToggle).display === 'none';
      const propertiesGeometry = {
        chevron: rectOf(doc, '#inspectorEdgeToggle'),
        panel: rectOf(doc, '#inspector'),
        dock: rectOf(doc, '#panelDock'),
        properties: rectOf(doc, '#panelDock [data-shell-panel="properties"]')
      };
      record('UI-DEBT-001 Chevron sits on canvas / panel boundary without Dock occlusion',
        propertiesGeometry.chevron?.right <= propertiesGeometry.panel?.left + 1 &&
        propertiesGeometry.chevron?.right < propertiesGeometry.dock?.left &&
        propertiesGeometry.properties?.left >= propertiesGeometry.dock?.left &&
        propertiesGeometry.properties?.right <= propertiesGeometry.dock?.right + 1,
        propertiesGeometry);

      collapse.click();
      await sleep(140);
      const collapseClosed = shell.state();
      propertiesDock?.click();
      await sleep(140);
      const dockPropertiesOpened = shell.state();
      record('UI-DEBT-001 Dock Properties remains fully clickable after collapse',
        dockPropertiesOpened.activePanel === 'properties' &&
        dockPropertiesOpened.inspectorOpen &&
        !dockPropertiesOpened.creativeOpen,
        { state: dockPropertiesOpened, geometry: propertiesGeometry });

      collapse.click();
      await sleep(140);
      const collapseClosedAgain = shell.state();
      collapse.click();
      await sleep(140);
      const collapseReopened = shell.state();
      record('UI-DEBT-001 chevron is the single visible desktop collapse authority',
        legacyHidden &&
        collapseClosed.collapsed &&
        collapseClosedAgain.collapsed &&
        collapseReopened.activePanel === 'properties' &&
        collapse.getAttribute('aria-expanded') === 'true',
        { legacyHidden, collapseClosed, dockPropertiesOpened, collapseClosedAgain, collapseReopened, collapseExpanded: collapse.getAttribute('aria-expanded') });

      // Short-height desktop: force a long Inspector surface and prove body-owned scrolling.
      frame.style.height = '520px';
      frame.style.width = '1280px';
      await sleep(300);
      shell.open('properties');
      await sleep(100);
      doc.querySelector('.inspector-tab[data-tab="studio"]')?.click();
      await sleep(180);
      const shortSection = doc.querySelector('.inspector-section.active');
      const shortInspector = doc.querySelector('#inspector').getBoundingClientRect();
      const shortBefore = shortSection.scrollTop;
      shortSection.scrollTop = shortSection.scrollHeight;
      await sleep(40);
      const shortAfter = shortSection.scrollTop;
      const shortDiag = {
        viewport: [win.innerWidth, win.innerHeight],
        inspector: shortInspector.toJSON?.() || { top: shortInspector.top, bottom: shortInspector.bottom, left: shortInspector.left, right: shortInspector.right },
        overflowY: getComputedStyle(shortSection).overflowY,
        overflowX: getComputedStyle(shortSection).overflowX,
        clientHeight: shortSection.clientHeight,
        scrollHeight: shortSection.scrollHeight,
        clientWidth: shortSection.clientWidth,
        scrollWidth: shortSection.scrollWidth,
        scrollBefore: shortBefore,
        scrollAfter: shortAfter
      };
      record('UI-MAINT-002 short-height Inspector keeps all content reachable by vertical scroll',
        shortInspector.top >= 0 &&
        shortInspector.bottom <= win.innerHeight + 1 &&
        ['auto','scroll'].includes(shortDiag.overflowY) &&
        shortDiag.overflowX === 'hidden' &&
        shortDiag.scrollWidth <= shortDiag.clientWidth + 1 &&
        shortDiag.scrollHeight > shortDiag.clientHeight &&
        shortDiag.scrollAfter > shortDiag.scrollBefore,
        shortDiag);

      shell.open('chat');
      await sleep(180);
      const creativeBody = doc.querySelector('.creative-workspace-body');
      const creativeRect = doc.querySelector('#creativeWorkspace').getBoundingClientRect();
      const creativeDiag = {
        viewport: [win.innerWidth, win.innerHeight],
        panel: creativeRect.toJSON?.() || { top: creativeRect.top, bottom: creativeRect.bottom, left: creativeRect.left, right: creativeRect.right },
        overflowY: getComputedStyle(creativeBody).overflowY,
        overflowX: getComputedStyle(creativeBody).overflowX,
        clientWidth: creativeBody.clientWidth,
        scrollWidth: creativeBody.scrollWidth
      };
      record('UI-MAINT-002 short-height Creative Loop remains vertically contained without horizontal overflow',
        creativeRect.top >= 0 &&
        creativeRect.bottom <= win.innerHeight + 1 &&
        ['auto','scroll'].includes(creativeDiag.overflowY) &&
        creativeDiag.overflowX === 'hidden' &&
        creativeDiag.scrollWidth <= creativeDiag.clientWidth + 1,
        creativeDiag);
      shell.close();
      frame.style.height = '800px';
      await sleep(260);

      frame.style.width = '960px';
      await sleep(260);
      shell.close();
      await sleep(100);
      const desktopResize = shell.state();
      const narrowGeometry = { stage: rectOf(doc, '#stageWrap'), rail: rectOf(doc, '.tool-rail'), dock: rectOf(doc, '#panelDock'), topbar: rectOf(doc, '.topbar') };
      record('narrow desktop containment remains stable', frame.contentWindow.innerWidth <= 960 && desktopResize.stageWidth > 800 && visible(doc, '#panelDock') && near(narrowGeometry.stage?.left, narrowGeometry.rail?.right, 1) && near(narrowGeometry.stage?.right, narrowGeometry.dock?.left, 1), { viewport: frame.contentWindow.innerWidth, shell: desktopResize, geometry: narrowGeometry });

      frame.style.width = '720px';
      await sleep(320);
      const mobileMedia = win.matchMedia('(max-width:760px)').matches;
      const mobileDockHidden = getComputedStyle(doc.querySelector('#panelDock')).display === 'none';
      const mobileBottomDock = visible(doc, '.mobile-dock');
      record('narrow/mobile fallback activates without desktop dock overlap', mobileMedia && mobileDockHidden && mobileBottomDock, { mobileMedia, mobileDockHidden, mobileBottomDock });
      shell.open('layers');
      await sleep(120);
      const inspectorRect = doc.querySelector('#inspector').getBoundingClientRect();
      record('mobile Inspector remains within viewport', inspectorRect.left >= 0 && inspectorRect.right <= win.innerWidth + 1 && inspectorRect.bottom <= win.innerHeight + 1, { viewport: [win.innerWidth, win.innerHeight], rect: inspectorRect.toJSON?.() || { left: inspectorRect.left, right: inspectorRect.right, top: inspectorRect.top, bottom: inspectorRect.bottom } });
      shell.close();
      frame.style.width = '1280px';
      await sleep(250);

      const favicon = doc.querySelector('link[rel="icon"]');
      const faviconResponse = favicon ? await win.fetch(favicon.href, { cache: 'reload' }) : null;
      const mark = doc.querySelector('.menu-app-mark>.brand-source-mark');
      const markResponse = mark ? await win.fetch(mark.src, { cache: 'reload' }) : null;
      record('favicon link resolves successfully in fresh context', Boolean(faviconResponse?.ok), { href: favicon?.href || null, status: faviconResponse?.status || null });
      record('original INK mark is the visible shell source', Boolean(markResponse?.ok) && /INK_MARK_SOURCE_W-300\.jpg/.test(mark?.src || ''), { src: mark?.src || null, status: markResponse?.status || null });

      const appBuildId = win.INK_ARCHITECTURE?.buildId || test.updateStatus?.().buildId || null;
      let workerBuildId = null;
      let swReady = false;
      let swProductVersion = null;
      let swScriptURL = null;
      let swUpdateViaCache = null;
      let swUpdateChecked = false;
      let cacheKeys = [];
      let legacyCacheRemoved = false;
      try {
        const registration = await Promise.race([
          win.navigator.serviceWorker.ready,
          new Promise((_, reject) => setTimeout(() => reject(new Error('service-worker-ready-timeout')), 90000))
        ]);
        swReady = Boolean(registration?.active);
        swScriptURL = registration?.active?.scriptURL || null;
        swUpdateViaCache = registration?.updateViaCache || null;
        const workerVersion = await new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            win.navigator.serviceWorker.removeEventListener('message', onMessage);
            reject(new Error('worker-version-timeout'));
          }, 10000);
          const onMessage = event => {
            if (event.data?.type !== 'INK_VERSION') return;
            clearTimeout(timer);
            win.navigator.serviceWorker.removeEventListener('message', onMessage);
            resolve(event.data);
          };
          win.navigator.serviceWorker.addEventListener('message', onMessage);
          registration.active.postMessage({ type: 'INK_GET_VERSION' });
        });
        workerBuildId = workerVersion.buildId || null;
        swProductVersion = workerVersion.version || null;
        const shellCacheName = workerBuildId ? `ink-build-${workerBuildId}-shell` : null;
        await waitFor(async () => {
          cacheKeys = await win.caches.keys();
          return Boolean(shellCacheName) && cacheKeys.includes(shellCacheName);
        }, 90000, 250);
        await registration.update();
        swUpdateChecked = true;
        cacheKeys = await win.caches.keys();
        legacyCacheRemoved = !cacheKeys.some(key => key.startsWith('ink-v'));
      } catch (error) {
        results.push({ name: 'service-worker diagnostic detail', pass: false, detail: String(error?.stack || error) });
      }
      record('service worker activates in loopback Web runtime', swReady, { swReady, swScriptURL });
      record('service worker owns build identity independent of stale app query',
        swProductVersion === '0.1' && Boolean(workerBuildId) && workerBuildId === appBuildId &&
        cacheKeys.includes(`ink-build-${workerBuildId}-shell`) &&
        new URL(swScriptURL || win.location.href).search === '',
        { swProductVersion, appBuildId, workerBuildId, swScriptURL, cacheKeys });
      record('service worker update check bypasses script HTTP cache', swUpdateViaCache === 'none' && swUpdateChecked,
        { swUpdateViaCache, swUpdateChecked });
      record('service-worker activation removed historical cache without storage reset', legacyCacheRemoved, { cacheKeys });

      const integrity = test.documentIntegrity();
      const health = test.runtimeHealth();
      record('document integrity remains valid', integrity.passed === true, integrity);
      record('no fatal runtime health failure', health.status !== 'fail', health);

      const failed = results.filter(item => !item.pass);
      const payload = {
        schema: 'INK-WEB-UI-001-BROWSER-QA',
        version: 1,
        status: failed.length ? 'FAIL' : 'PASS',
        product: 'INK v0.1 · Web',
        formatVersion: test.architecture().formatVersion,
        checks: results,
        summary: { total: results.length, passed: results.length - failed.length, failed: failed.length }
      };
      await publishResult(payload);
    } catch (error) {
      const payload = {
        schema: 'INK-WEB-UI-001-BROWSER-QA',
        version: 1,
        status: 'FAIL',
        fatal: String(error?.stack || error),
        checks: results
      };
      await publishResult(payload);
    }
  }

  if (frame.contentDocument?.readyState === 'complete') void run();
  else frame.addEventListener('load', () => { void run(); }, { once: true });
})();
</script>
</body>
</html>

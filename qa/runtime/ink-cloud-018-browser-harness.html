<!doctype html>
<meta charset="utf-8">
<title>INK-CLOUD-018 Browser Runtime QA</title>
<style>
body{font:14px/1.45 ui-monospace,Consolas,monospace;margin:18px}iframe{width:1200px;height:800px;border:1px solid #aaa}pre{white-space:pre-wrap}#qa-result[data-state="PASS"]{color:#08752f}#qa-result[data-state="FAIL"]{color:#a20d0d}
</style>
<h1>INK-CLOUD-018 Browser Runtime QA</h1>
<strong id="qa-result" data-state="RUNNING">RUNNING</strong>
<pre id="qa-log"></pre>
<iframe id="ink-frame" src="/index.html?fresh=1&ink-qa=1"></iframe>
<script>
(() => {
  const resultNode = document.querySelector('#qa-result');
  const logNode = document.querySelector('#qa-log');
  const frame = document.querySelector('#ink-frame');
  const evidence = { task:'INK-CLOUD-018', fixture:'rose-window-primary.png', checks:[], metrics:{}, failures:[] };
  const pass = (name, details={}) => { evidence.checks.push({name,...details,status:'PASS'}); logNode.textContent = JSON.stringify(evidence,null,2); };
  const assert = (condition, name, details={}) => { if (!condition) throw Object.assign(new Error(name),{qa:name,details}); pass(name,details); };
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  let runtimeStage='BOOT';
  const markRuntimeStage=stage=>{runtimeStage=stage;evidence.runtimeStage=stage;};
  const waitFor = async (predicate, timeout = 8000, step = 40) => {
    const started = performance.now();
    while (performance.now() - started < timeout) {
      if (await predicate()) return true;
      await wait(step);
    }
    throw new Error('Runtime condition timeout');
  };
  const encodeBase64Utf8 = value => {
    const bytes = new TextEncoder().encode(value);
    let binary = '';
    for (const byte of bytes) binary += String.fromCharCode(byte);
    return btoa(binary);
  };
  async function reportEvidence() {
    const response = await fetch('/__qa_result',{
      method:'POST',
      headers:{'Content-Type':'text/plain; charset=us-ascii'},
      body:encodeBase64Utf8(JSON.stringify(evidence)),
      cache:'no-store'
    });
    if (!response.ok) throw new Error(`QA result callback failed: ${response.status}`);
  }

  async function ready() {
    for (let i=0;i<120;i++) {
      const w=frame.contentWindow;
      if (w?.INK_APP && w?.INK_TEST && w?.INK_AI && w.INK_APP.creativeWorkspace) return w;
      await wait(250);
    }
    throw new Error('INK runtime did not boot');
  }

  async function run() {
    const w=await ready(), app=w.INK_APP, cw=app.creativeWorkspace, shell=w.INK_WEB_SHELL, doc=w.document;
    assert(Boolean(shell?.open && shell?.state),'WORKSTATION_SHELL_AVAILABLE');
    const markDirtyCalls=[];
    const originalMarkDirty=app.markDirty.bind(app);
    app.markDirty=(...args)=>{
      markDirtyCalls.push({
        at:Date.now(),
        modifiedAtBefore:app.doc?.modifiedAt??null,
        historyUndo:app.history?.undoStack?.length??null,
        historyPending:Boolean(app.history?.pending),
        stack:String(new Error('markDirty trace').stack||'').split('\n').slice(1,9)
      });
      return originalMarkDirty(...args);
    };
    const settleReadOnlyBoundary=async()=>{
      await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));
      await wait(800);
      assert(!app.history?.pending,'WORKSTATION_READ_ONLY_BOUNDARY_HISTORY_IDLE');
      return {modifiedAt:app.doc?.modifiedAt??null,markDirtyCount:markDirtyCalls.length};
    };
    const panelStates=[];
    const openPanel=async id=>{
      shell.open(id);
      await wait(90);
      const state=shell.state();
      const properties=id==='properties';
      const valid=state.activePanel===id && (properties
        ? state.inspectorOpen && !state.creativeOpen
        : state.creativeOpen && !state.inspectorOpen && cw.stage===id);
      const detail={id,stage:cw.stage,...state};
      panelStates.push(detail);
      assert(valid,`WORKSTATION_PANEL_${id.toUpperCase()}_AUTHORITY`,detail);
      return state;
    };
    const readOnlyState=()=>({
      document:app.doc,
      history:{undo:app.history?.undoStack?.length||0,redo:app.history?.redoStack?.length||0,pending:Boolean(app.history?.pending)},
      revision:app.revisions?.revisionIdFor?.(app.doc?.id)??null
    });
    const readOnlySnapshot=()=>JSON.stringify(readOnlyState());
    const diffJson=(before,after,{limit=16}={})=>{
      const out=[];
      const walk=(a,b,path='$')=>{
        if(out.length>=limit||Object.is(a,b))return;
        const aObject=a!==null&&typeof a==='object';
        const bObject=b!==null&&typeof b==='object';
        if(!aObject||!bObject||Array.isArray(a)!==Array.isArray(b)){
          out.push({path,before:a,after:b});
          return;
        }
        const keys=[...new Set([...Object.keys(a),...Object.keys(b)])].sort();
        for(const key of keys){
          if(out.length>=limit)break;
          const nextPath=Array.isArray(a)?`${path}[${key}]`:`${path}.${key}`;
          if(!Object.prototype.hasOwnProperty.call(a,key)||!Object.prototype.hasOwnProperty.call(b,key)){
            out.push({path:nextPath,before:a[key],after:b[key]});
            continue;
          }
          walk(a[key],b[key],nextPath);
        }
      };
      walk(before,after);
      return out;
    };
    const assertReadOnly=(before,name,details={})=>{
      const after=readOnlySnapshot();
      if(after===before){ pass(name,details); return true; }
      let prior=null,next=null;
      try{prior=JSON.parse(before);next=JSON.parse(after);}catch{}
      const changed={
        document:prior&&next?JSON.stringify(prior.document)!==JSON.stringify(next.document):null,
        history:prior&&next?JSON.stringify(prior.history)!==JSON.stringify(next.history):null,
        revision:prior&&next?prior.revision!==next.revision:null
      };
      assert(false,name,{
        ...details,
        changed,
        documentDiff:prior&&next?diffJson(prior.document,next.document):[],
        historyDiff:prior&&next?diffJson(prior.history,next.history):[],
        beforeRevision:prior?.revision??null,
        afterRevision:next?.revision??null
      });
    };
    await openPanel('reference'); // UI-001 intentionally starts collapsed; use the accepted shell authority to enter the workspace.
    assert(w.INK_ARCHITECTURE?.formatVersion===4,'FORMAT_VERSION_4',{value:w.INK_ARCHITECTURE?.formatVersion});
    assert(Boolean(w.document.querySelector('#stage')),'CANVAS_EDITOR_RENDERED');
    assert(Boolean(cw.root?.classList.contains('open')),'CREATIVE_WORKSPACE_VISIBLE');
    assert(Boolean(cw.root?.querySelector('[data-workspace-input="reference-file"]')),'REFERENCE_IMPORT_VISIBLE');
    assert(Boolean(cw.root?.querySelector('[data-workspace-input="chat-prompt"]')),'CHAT_PROMPT_VISIBLE');
    assert(Boolean(cw.root?.querySelector('[data-workspace-action="structure-reconstruct"]')),'STRUCTURE_AWARE_OPTION_VISIBLE');

    await openPanel('properties');
    const emptySelectionText=doc.querySelector('[data-workstation-output="selection-capability"]')?.textContent||'';
    assert(/Select an object to inspect Document Bridge and Semantic Region grounding/.test(emptySelectionText),'WORKSTATION_PROPERTIES_UNAVAILABLE_STATE_EXPLICIT',{text:emptySelectionText});
    await openPanel('reference');
    assert(Boolean(cw.root?.querySelector('[data-workspace-action="research-context-refresh"]') && cw.root?.querySelector('[data-workspace-output="research-context"]')),'WORKSTATION_REFERENCE_RESEARCH_ENTRY_VISIBLE');

    await openPanel('revision');
    assert(cw.root.querySelector('[data-workspace-action="revision-compare"]')?.disabled===true,'WORKSTATION_REVISION_UNAVAILABLE_STATE_EXPLICIT');
    await openPanel('reference');

    // INK-CHAT-CLOSED-LOOP-001: one connector-first chain, before unrelated regression edits.
    const smartApi=app.inkPublicApi;
    const smartDiscovery=await smartApi.tools.invoke('get_ink_capabilities');
    const smartRequired=['reference.import','reference.decompose','preview.capture','composition.programmable','path.repaint.v1','history.inspect','revision.list'];
    const smartDescriptors=[];
    for(const capabilityId of smartRequired){
      const described=await smartApi.tools.invoke('describe_ink_capability',{idOrToolName:capabilityId});
      assert(described.status==='COMPLETED' && described.result?.availability===true,
        'SMART_CAPABILITY_'+capabilityId,{capabilityId,status:described.status});
      smartDescriptors.push(described.result);
    }
    assert(smartDiscovery.status==='COMPLETED' &&
      smartRequired.every(id=>smartDiscovery.result.capabilities.some(c=>c.id===id && c.availability)) &&
      smartDiscovery.result.namedTools.length===21 &&
      smartDiscovery.result.namedTools[19].name==='import_ink_reference' &&
      smartDiscovery.result.namedTools[20].name==='export_ink_asset' &&
      smartDescriptors[0].routingClass==='NAMED_TOOL' &&
      smartDiscovery.result.capabilities.find(c=>c.id==='external.transport')?.availability===false,
      'SMART_LOOP_CAPABILITIES_DISCOVERED');

    const fixtureResponse=await fetch('/__qa_rose_window.png',{cache:'no-store'});
    assert(fixtureResponse.ok,'ROSE_WINDOW_FIXTURE_HTTP',{status:fixtureResponse.status});
    const blob=await fixtureResponse.blob();
    const input=cw.root.querySelector('[data-workspace-input="reference-file"]');

    assert(Boolean(w.INK_CHAT_HANDOFF?.importReference),'CHAT_REFERENCE_HANDOFF_API_VISIBLE');
    assert((input?.files?.length||0)===0,'CHAT_REFERENCE_HANDOFF_FILE_INPUT_UNTOUCHED_BEFORE');
    assert(
      blob instanceof Blob && !(blob instanceof w.Blob),
      'CHAT_REFERENCE_HANDOFF_CROSS_REALM_BINARY_CONFIRMED',
      {parentBlob:blob instanceof Blob,iframeBlob:blob instanceof w.Blob}
    );
    const handoffLiveness=[];
    const livenessCheckNames={
      'normalization returned':'CHAT_REFERENCE_HANDOFF_LIVENESS_NORMALIZATION_RETURNED',
      'decoder entered':'CHAT_REFERENCE_HANDOFF_LIVENESS_DECODER_ENTERED',
      'decoder returned':'CHAT_REFERENCE_HANDOFF_LIVENESS_DECODER_RETURNED',
      'Reference import committed':'CHAT_REFERENCE_HANDOFF_LIVENESS_REFERENCE_IMPORT_COMMITTED'
    };
    const recordHandoffLiveness=(stage,details={})=>{
      handoffLiveness.push({stage,atMs:Math.round(performance.now()),...details});
      const checkName=livenessCheckNames[stage];
      if(checkName){
        const {name:sourceName,...safeDetails}=details;
        pass(checkName,{stage,sequence:handoffLiveness.map(item=>item.stage),...safeDetails,...(sourceName?{sourceName}:{})});
      }
    };
    recordHandoffLiveness('cross-realm input confirmed',{
      parentBlob:blob instanceof Blob,
      iframeBlob:blob instanceof w.Blob
    });
    pass('CHAT_REFERENCE_HANDOFF_LIVENESS_INPUT_CONFIRMED',{sequence:handoffLiveness.map(item=>item.stage)});
    const invalidHistoryBefore=app.history.undoStack.length;
    const invalidReceipt=await w.INK_CHAT_HANDOFF.importReference({
      name:'spoof.png',
      type:'image/png',
      size:3,
      arrayBuffer:async()=>new Uint8Array([1,2,3]).buffer,
      slice(){return this;},
      [Symbol.toStringTag]:'Blob'
    },{
      name:'spoof.png',
      type:'image/png',
      actor:{type:'chat',id:'runtime-chat',channel:'CHAT_ATTACHMENT_HANDOFF'},
      intent:'Reject arbitrary non-binary object'
    });
    assert(
      invalidReceipt?.status==='FAILED' &&
      invalidReceipt?.error?.code==='CHAT_REFERENCE_HANDOFF_BINARY_REQUIRED' &&
      app.history.undoStack.length===invalidHistoryBefore,
      'CHAT_REFERENCE_HANDOFF_INVALID_OBJECT_REJECTED',
      {receipt:invalidReceipt,historyBefore:invalidHistoryBefore,historyAfter:app.history.undoStack.length}
    );

    const handoffHistoryBefore=app.history.undoStack.length;
    const handoffRevisionBefore=app.revisions?.revisionIdFor?.(app.doc?.id)??null;
    const formalDocumentBeforeHandoff=app.doc;
    const originalReplaceDocument=app.replaceDocument.bind(app);
    const originalDecode=app.extraction.decode;
    let handoffReplaceDocumentCalls=0;
    let decoderInput=null;
    app.replaceDocument=(...args)=>{handoffReplaceDocumentCalls++;return originalReplaceDocument(...args);};
    app.extraction.decode=async file=>{
      decoderInput={
        localFile:file instanceof w.File,
        localBlob:file instanceof w.Blob,
        name:file?.name||null,
        type:file?.type||null,
        size:file?.size??null
      };
      return originalDecode(file);
    };
    const handoffTimeoutMs=15000;
    pass('CHAT_REFERENCE_HANDOFF_LIVENESS_SHORT_TIMEOUT_BOUND',{timeoutMs:handoffTimeoutMs});
    let handoffReceipt, smartImport;
    const smartInput=new File([blob],'chat-reference-fixture.png',{type:'image/png'});
    try {
      const handoffPromise=smartApi.tools.invoke('import_ink_reference',{input:smartInput,options:{
        name:'chat-reference-fixture.png',
        type:'image/png',
        actor:{type:'chat',id:'runtime-chat',channel:'CHAT_ATTACHMENT_HANDOFF'},
        intent:'INK-CHAT-VALIDATION-001 Phase A automated fixture handoff',
        checkpoint:event=>recordHandoffLiveness(event?.stage||'unknown',event||{})
      }});
      smartImport=await Promise.race([
        handoffPromise,
        wait(handoffTimeoutMs).then(()=>{
          throw Object.assign(new Error('CHAT Reference handoff liveness timeout'),{
            qa:'CHAT_REFERENCE_HANDOFF_LIVENESS_TIMEOUT',
            details:{
              timeoutMs:handoffTimeoutMs,
              sequence:handoffLiveness.map(item=>item.stage),
              checkpoints:handoffLiveness
            }
          });
        })
      ]);
      handoffReceipt=smartImport.result;
      assert(smartImport.status==='COMPLETED' && smartImport.createdRefs.length===1 &&
        smartImport.createdRefs[0].objectId===handoffReceipt.referenceObjectId,
        'SMART_LOOP_REFERENCE_IMPORTED',{referenceRef:smartImport.createdRefs[0]});
      recordHandoffLiveness('receipt returned',{
        status:handoffReceipt?.status||null,
        referenceObjectId:handoffReceipt?.referenceObjectId||null
      });
      pass('CHAT_REFERENCE_HANDOFF_LIVENESS_RECEIPT_RETURNED',{
        status:handoffReceipt?.status||null,
        sequence:handoffLiveness.map(item=>item.stage)
      });
    } finally {
      app.extraction.decode=originalDecode;
      app.replaceDocument=originalReplaceDocument;
    }
    assert(
      decoderInput?.localFile===true &&
      decoderInput?.localBlob===true &&
      decoderInput?.name==='chat-reference-fixture.png' &&
      decoderInput?.type==='image/png',
      'CHAT_REFERENCE_HANDOFF_NORMALIZED_LOCAL_FILE',
      {decoderInput}
    );
    assert(
      handoffLiveness.map(item=>item.stage).join(' → ')===
        'cross-realm input confirmed → normalization returned → decoder entered → decoder returned → Reference import committed → receipt returned',
      'CHAT_REFERENCE_HANDOFF_LIVENESS_SEQUENCE_COMPLETE',
      {sequence:handoffLiveness.map(item=>item.stage),checkpoints:handoffLiveness}
    );
    evidence.metrics.chatReferenceHandoffLiveness=handoffLiveness;
    assert(handoffReceipt?.status==='COMPLETED','CHAT_REFERENCE_HANDOFF_COMPLETED',{receipt:handoffReceipt});
    assert((input?.files?.length||0)===0,'CHAT_REFERENCE_HANDOFF_FILE_INPUT_UNTOUCHED_AFTER');
    assert(handoffReceipt.operation==='reference.import' && handoffReceipt.sourceChannel==='CHAT_ATTACHMENT_HANDOFF','CHAT_REFERENCE_HANDOFF_OPERATION_RECORDED',{operation:handoffReceipt.operation,sourceChannel:handoffReceipt.sourceChannel});
    const handoffFound=app.findObject({objectId:handoffReceipt.referenceObjectId});
    assert(handoffFound?.object?.type==='image','CHAT_REFERENCE_HANDOFF_REFERENCE_OBJECT_VISIBLE',{referenceObjectId:handoffReceipt.referenceObjectId});
    const handoffMeta=handoffFound?.object?.metadata?.referenceImport;
    assert(
      handoffMeta?.actor?.type==='chat' &&
      handoffMeta?.sourceChannel==='CHAT_ATTACHMENT_HANDOFF' &&
      handoffMeta?.operation==='reference.import',
      'CHAT_REFERENCE_HANDOFF_ACTOR_CHANNEL_METADATA',
      {metadata:handoffMeta}
    );
    assert(
      /^[a-f0-9]{64}$/.test(handoffReceipt.source?.sha256||'') &&
      handoffReceipt.source.sha256===handoffMeta?.source?.sha256 &&
      handoffReceipt.source.mimeType==='image/png' &&
      handoffReceipt.source.mimeType===handoffMeta?.source?.mimeType &&
      handoffReceipt.source.width===handoffFound.object.w &&
      handoffReceipt.source.height===handoffFound.object.h,
      'CHAT_REFERENCE_HANDOFF_SOURCE_IDENTITY_RETAINED',
      {source:handoffReceipt.source,width:handoffFound?.object?.w,height:handoffFound?.object?.h}
    );
    const handoffHistoryExpectedApplied=Math.min(
      (handoffReceipt.history?.before?.applied??handoffHistoryBefore)+1,
      handoffReceipt.history?.after?.limit??app.history.limit
    );
    assert(
      handoffReceipt.history?.commit?.valid===true &&
      handoffReceipt.history?.after?.applied===handoffHistoryExpectedApplied &&
      handoffReceipt.history?.commit?.newestMatches===true &&
      app.history.undoStack.at(-1)?.label==='Reference import · CHAT attachment' &&
      app.history.undoStack.at(-1)?.objectIds?.includes(handoffReceipt.referenceObjectId),
      'CHAT_REFERENCE_HANDOFF_HISTORY_EXACTLY_ONE',
      {
        before:handoffReceipt.history?.before,
        after:handoffReceipt.history?.after,
        commit:handoffReceipt.history?.commit,
        last:app.history.undoStack.at(-1)?.label
      }
    );
    const handoffRevisionAfter=app.revisions?.revisionIdFor?.(app.doc?.id)??null;
    assert(
      handoffReceipt.revision?.before===handoffRevisionBefore &&
      handoffReceipt.revision?.after===handoffRevisionAfter &&
      handoffRevisionAfter===handoffRevisionBefore,
      'CHAT_REFERENCE_HANDOFF_NO_AUTO_REVISION',
      {before:handoffRevisionBefore,after:handoffRevisionAfter}
    );
    assert(app.doc===formalDocumentBeforeHandoff && handoffReplaceDocumentCalls===0,'CHAT_REFERENCE_HANDOFF_NO_DOCUMENT_REPLACEMENT',{replaceDocumentCalls:handoffReplaceDocumentCalls});
    const handoffAudit=handoffReceipt.audit?.auditId?w.INK_AI?.layer?.audit?.find?.(handoffReceipt.audit.auditId):null;
    assert(
      Boolean(handoffAudit) &&
      handoffAudit.commands?.includes('reference.import') &&
      handoffAudit.permissionLevel==='EXECUTE',
      'CHAT_REFERENCE_HANDOFF_AUDIT_INSPECTABLE',
      {auditId:handoffReceipt.audit?.auditId,commands:handoffAudit?.commands}
    );
    assert(
      handoffReceipt.provenance?.status==='AVAILABLE' &&
      (handoffReceipt.provenance?.eventIds?.length||0)>0 &&
      handoffReceipt.provenance?.eventKinds?.includes('object-source'),
      'CHAT_REFERENCE_HANDOFF_PROVENANCE_INSPECTABLE',
      {provenance:handoffReceipt.provenance}
    );
    assert(
      handoffReceipt.documentId===app.doc.id &&
      handoffReceipt.targetLayerId===handoffFound.layer.id &&
      handoffReceipt.referenceObjectId===handoffFound.object.id &&
      handoffReceipt.audit?.auditId,
      'CHAT_REFERENCE_HANDOFF_RECEIPT_INSPECTABLE',
      {documentId:handoffReceipt.documentId,layerId:handoffReceipt.targetLayerId,referenceObjectId:handoffReceipt.referenceObjectId,auditId:handoffReceipt.audit?.auditId}
    );

    assert(smartImport.historyReceipt?.commit?.valid===true &&
      smartImport.provenanceReceipt?.status==='AVAILABLE' &&
      smartImport.provenanceReceipt.eventIds.length>0 &&
      /^[a-f0-9]{64}$/.test(smartImport.result.source.sha256),
      'SMART_LOOP_IMPORT_HISTORY_PROVENANCE_RECORDED');

    assert(Boolean(w.INK_CHAT_HANDOFF?.decomposeReference),'CHAT_REFERENCE_DECOMPOSITION_API_VISIBLE');
    const phaseBHistoryBefore=app.history.undoStack.length;
    const phaseBRevisionBefore=app.revisions?.revisionIdFor?.(app.doc?.id)??null;
    const phaseBReferenceBefore=app.findObject({objectId:handoffReceipt.referenceObjectId});
    const phaseBStarted=performance.now();
    const smartDecomposition=await smartApi.tools.invoke('decompose_ink_reference',{referenceObjectId:smartImport.createdRefs[0].objectId,options:{
      numberOfColors:8,
      pathOmit:8,
      lineStroke:'#202020',
      lineStrokeWidth:1,
      actor:{type:'chat',id:'runtime-chat',channel:'CHAT_REFERENCE_DECOMPOSITION'},
      intent:'INK-CHAT-VALIDATION-001 Phase B Reference to editable Color and Line layers'
    }});
    const phaseBReceipt=smartDecomposition.result;
    const phaseBElapsedMs=performance.now()-phaseBStarted;
    const phaseBTrace=phaseBReceipt?.diagnostics?.traceRaster;
    const phaseBScale=phaseBReceipt?.diagnostics?.coordinateScale;
    assert(
      phaseBElapsedMs<30000 &&
      Number.isInteger(phaseBTrace?.pixels) && phaseBTrace.pixels<=64000 &&
      phaseBTrace.width<=320 && phaseBTrace.height<=320,
      'CHAT_REFERENCE_DECOMPOSITION_BOUNDED_TRACE_RUNTIME',
      {elapsedMs:phaseBElapsedMs,traceRaster:phaseBTrace}
    );
    const phaseBShouldDownsample=
      phaseBReceipt.source.width*phaseBReceipt.source.height>64000 ||
      phaseBReceipt.source.width>320 ||
      phaseBReceipt.source.height>320;
    assert(
      phaseBTrace?.sourceWidth===phaseBReceipt.source?.width &&
      phaseBTrace?.sourceHeight===phaseBReceipt.source?.height &&
      phaseBTrace?.downsampled===phaseBShouldDownsample &&
      Math.abs((phaseBTrace.width*phaseBScale?.x)-phaseBReceipt.source.width)<1e-6 &&
      Math.abs((phaseBTrace.height*phaseBScale?.y)-phaseBReceipt.source.height)<1e-6,
      'CHAT_REFERENCE_DECOMPOSITION_SOURCE_COORDINATE_MAPPING',
      {traceRaster:phaseBTrace,coordinateScale:phaseBScale,source:phaseBReceipt.source,shouldDownsample:phaseBShouldDownsample}
    );
    assert(phaseBReceipt?.status==='COMPLETED','CHAT_REFERENCE_DECOMPOSITION_COMPLETED',{receipt:phaseBReceipt});
    assert(
      phaseBReceipt.operation==='reference.decompose.line-color' &&
      phaseBReceipt.sourceReferenceObjectId===handoffReceipt.referenceObjectId &&
      phaseBReceipt.source?.sha256===handoffReceipt.source?.sha256,
      'CHAT_REFERENCE_DECOMPOSITION_SOURCE_REFERENCE_RETAINED',
      {sourceReferenceObjectId:phaseBReceipt.sourceReferenceObjectId,source:phaseBReceipt.source}
    );
    const phaseBReferenceAfter=app.findObject({objectId:handoffReceipt.referenceObjectId});
    assert(
      phaseBReferenceAfter?.object===phaseBReferenceBefore?.object &&
      phaseBReferenceAfter?.object?.type==='image',
      'CHAT_REFERENCE_DECOMPOSITION_REFERENCE_REMAINS',
      {referenceObjectId:handoffReceipt.referenceObjectId}
    );
    const colorLayer=app.page().layers.find(layer=>layer.id===phaseBReceipt.colorLayerId);
    const lineLayer=app.page().layers.find(layer=>layer.id===phaseBReceipt.lineLayerId);
    assert(
      colorLayer?.name==='Color' && lineLayer?.name==='Line' && colorLayer.id!==lineLayer.id,
      'CHAT_REFERENCE_DECOMPOSITION_SEPARATE_LAYERS',
      {colorLayerId:colorLayer?.id,lineLayerId:lineLayer?.id,colorName:colorLayer?.name,lineName:lineLayer?.name}
    );
    const sourceLayerIndex=app.page().layers.findIndex(layer=>layer.id===phaseBReferenceAfter?.layer?.id);
    const colorLayerIndex=app.page().layers.findIndex(layer=>layer.id===colorLayer?.id);
    const lineLayerIndex=app.page().layers.findIndex(layer=>layer.id===lineLayer?.id);
    assert(
      colorLayerIndex>sourceLayerIndex && lineLayerIndex>colorLayerIndex,
      'CHAT_REFERENCE_DECOMPOSITION_LAYER_ORDER',
      {sourceLayerIndex,colorLayerIndex,lineLayerIndex}
    );
    const colorObjects=colorLayer?.objects||[];
    const lineObjects=lineLayer?.objects||[];
    assert(
      colorObjects.length>=2 &&
      colorObjects.every(object=>object.type==='path' && object.fill && object.fill!=='none' && (!object.stroke || object.stroke==='none') && (object.subpaths||[]).every(subpath=>subpath.closed)),
      'CHAT_REFERENCE_DECOMPOSITION_EDITABLE_COLOR_REGIONS',
      {count:colorObjects.length,fills:[...new Set(colorObjects.map(object=>object.fill))]}
    );
    assert(
      lineObjects.length>=1 &&
      lineObjects.length===colorObjects.length &&
      lineObjects.every(object=>object.type==='path' && (!object.fill || object.fill==='none') && object.stroke && object.stroke!=='none' && object.strokeWidth>0 && (object.subpaths||[]).every(subpath=>subpath.closed)),
      'CHAT_REFERENCE_DECOMPOSITION_EDITABLE_BOUNDARY_LINES',
      {count:lineObjects.length,stroke:lineObjects[0]?.stroke,strokeWidth:lineObjects[0]?.strokeWidth}
    );
    assert(
      lineObjects.length>96 &&
      (app.selection?.length||0)===1 &&

      app.renderExportCanvas=originalUseInkRenderExportCanvas;
    }

    const useInkStepOrder=useInkExecuted?.result?.stepResults?.map(step=>step.stepId)||[];
    assert(
      useInkExecuted?.status==='COMPLETED' &&
      useInkStepOrder.join(',')==='use-ink-repaint,use-ink-move',
      'USE_INK_TWO_STEP_EXECUTION_ORDERED',
      {status:useInkExecuted?.status,stepOrder:useInkStepOrder}
    );
    assert(
      useInkExecuted?.historyReceipt?.steps?.length===2 &&
      useInkExecuted.historyReceipt.steps.every(step=>Boolean(step.history)),
      'USE_INK_HISTORY_RECORDED',
      {historySteps:useInkExecuted?.historyReceipt?.steps?.length||0}
    );

    const useInkRevisionAfter=app.revisions?.revisionIdFor?.(app.doc?.id)??null;
    assert(
      Boolean(useInkExecuted?.revisionReceipt) &&
      useInkExecuted.revisionReceipt.startingRevisionId===useInkRevisionBefore &&
      useInkExecuted.revisionReceipt.endingRevisionId===useInkRevisionAfter &&
      useInkRevisionAfter!==useInkRevisionBefore &&
      useInkExecuted.revisionReceipt.captureSkipped===null,
      'USE_INK_FINAL_REVISION_CAPTURED',
      {before:useInkRevisionBefore,after:useInkRevisionAfter,revisionReceipt:useInkExecuted?.revisionReceipt}
    );

    markRuntimeStage('USE_INK_UNSUPPORTED');
    const useInkUnsupported=await inkApi.tools.invoke('use_ink',{action:'boolean'});
    assert(
      useInkUnsupported?.status==='FAILED' &&
      useInkUnsupported?.diagnostics?.[0]?.code==='INK_USE_INK_ACTION_UNSUPPORTED',
      'USE_INK_UNSUPPORTED_ACTION_REJECTED',
      {code:useInkUnsupported?.diagnostics?.[0]?.code||null}
    );

    const useInkForbiddenBefore=readOnlySnapshot();
    markRuntimeStage('USE_INK_FORBIDDEN');
    const useInkForbidden=await inkApi.tools.invoke('use_ink',{
      action:'propose',
      plan:{
        schema:'INK-CHAT-CREATIVE-PLAN',
        version:1,
        intentSummary:'Connector-004 forbidden operation rejection',
        steps:[
          {stepId:'forbidden-delete',operation:'object.delete.v1',targets:[useInkRefA],arguments:{},dependsOn:[]},
          {stepId:'never-run',operation:'object.translate.v1',targets:[useInkRefB],arguments:{dx:1,dy:1},dependsOn:['forbidden-delete']}
        ]
      }
    });
    assert(
      useInkForbidden?.status==='FAILED' &&
      useInkForbidden?.diagnostics?.[0]?.code==='CHAT_EDIT_OPERATION_NOT_ALLOWED' &&
      readOnlySnapshot()===useInkForbiddenBefore,
      'USE_INK_FORBIDDEN_OPERATION_REJECTED',
      {code:useInkForbidden?.diagnostics?.[0]?.code||null}
    );
    assert(
      useInkPreviewRenderCalls===0 &&
      (useInkExecuted?.outputHandles?.length||0)===0,
      'USE_INK_NO_AUTO_PREVIEW',
      {previewRenderCalls:useInkPreviewRenderCalls,outputHandles:useInkExecuted?.outputHandles?.length||0}
    );

    const prompt=cw.root.querySelector('[data-workspace-input="chat-prompt"]');
    prompt.value='Describe the current Rose Window document context without changing the artwork.';
    const conversationBefore=JSON.stringify(app.doc);
    markRuntimeStage('CHAT_CONTEXT');
    const context=await cw.runConversationAction('chat-conversation-inspect');
    assert(context?.format==='INK-CHAT-CONTEXT','CHAT_DOCUMENT_CONTEXT_BOUND',{sourceVersion:context?.sourceVersion});
    markRuntimeStage('CHAT_SEND');
    const conversation=await cw.runConversationAction('chat-conversation-send');
    assert(Boolean(conversation?.content),'CHAT_NATURAL_LANGUAGE_RESPONSE',{source:conversation?.source,provider:conversation?.provider});
    assert(JSON.stringify(app.doc)===conversationBefore,'CHAT_DISCUSSION_NON_MUTATING');

    await openPanel('reference');
    cw.root.querySelector('[data-workspace-input="structure-count"]').value='6';
    markRuntimeStage('STRUCTURE_RUN');
    const structured=await cw.runStructure();
    assert(Boolean(structured),'STRUCTURE_AWARE_EXECUTED');
    evidence.metrics.structureRadialCount=structured?.radialCount;
    evidence.metrics.structurePrototypePaths=structured?.prototypePaths?.length;
    evidence.metrics.structurePrototypeNodes=structured?.prototypeDiagnostics?.nodes;
    evidence.metrics.structureMaskIoU=structured?.maskIoU;
    assert(structured?.radialCount===6 && (structured?.prototypePaths?.length||0)>0,'STRUCTURE_AWARE_VISIBLE_RESULT',{radialCount:structured?.radialCount,prototypePaths:structured?.prototypePaths?.length,repeatId:structured?.repeatId});

    const repeatFound=structured?.repeatId?app.findObject({objectId:structured.repeatId}):null;
    assert(repeatFound?.object?.type==='repeat','WORKSTATION_REPEAT_RESULT_AVAILABLE',{repeatId:structured?.repeatId,type:repeatFound?.object?.type});
    app.selectOnly(repeatFound.layer.id,repeatFound.object.id);
    cw.refresh();
    await openPanel('compose');
    const parametricText=cw.root.querySelector('[data-workspace-output="parametric-context"]')?.textContent||'';
    assert(/Repeat ·/.test(parametricText) && /instance\(s\)/.test(parametricText) && /(linked|expanded\/unlinked)/.test(parametricText),'WORKSTATION_COMPOSE_PARAMETRIC_STATUS',{text:parametricText});

    await openPanel('revision');
    cw.root.querySelector('[data-workspace-input="revision-label"]').value='Rose Window structure checkpoint';
    markRuntimeStage('REVISION_CAPTURE');
    const structureCapture=await cw.runRevisionAction('revision-capture');
    const structureRevision=structureCapture?.record?.revisionId || app.revisions.revisionIdFor?.(app.doc.id);
    assert(Boolean(structureRevision),'REVISION_STRUCTURE_CAPTURED',{revisionId:structureRevision});

    const revisionSelect=cw.root.querySelector('[data-workspace-input="revision-id"]');
    revisionSelect.value=baselineRevision;
    cw.refreshRevision();
    const beforeRevisionCompare=readOnlySnapshot();
    const compareButton=cw.root.querySelector('[data-workspace-action="revision-compare"]');
    assert(compareButton?.disabled===false,'WORKSTATION_REVISION_COMPARE_ENTRY_ENABLED',{revisionId:baselineRevision});
    markRuntimeStage('REVISION_COMPARE');
    compareButton.click();
    await waitFor(()=>cw.status?.code==='REVISION_COMPARISON_REFRESHED');
    const compareText=cw.root.querySelector('[data-workspace-output="revision-compare"]')?.textContent||'';
    const provenanceText=cw.root.querySelector('[data-workspace-output="revision-provenance"]')?.textContent||'';
    assert(Boolean(cw.lastRevisionComparison) && /structural/.test(compareText) && /renderer not used/.test(compareText),'WORKSTATION_REVISION_STRUCTURAL_COMPARE',{text:compareText});
    assert(/Provenance /.test(provenanceText) && /read-only/.test(provenanceText),'WORKSTATION_REVISION_PROVENANCE_VISIBLE',{text:provenanceText});
    assertReadOnly(beforeRevisionCompare,'WORKSTATION_REVISION_COMPARE_READ_ONLY');
    markRuntimeStage('REVISION_RESTORE');
    const restored=await cw.runRevisionAction('revision-restore');
    assert(Boolean(restored) && cw.lastRevisionResult?.action==='restore','REVISION_RESTORE_EXECUTED',{revisionId:baselineRevision});
    assert(w.INK_TEST.documentIntegrity()?.passed===true,'DOCUMENT_INTEGRITY_AFTER_RESTORE');

    let savedBlob=null, savedName=null;
    const originalDownload=app.download.bind(app);
    app.download=(blobValue,name)=>{savedBlob=blobValue;savedName=name;};
    markRuntimeStage('PROJECT_SAVE');
    await app.saveProject();
    app.download=originalDownload;
    const blobCtor=w.Blob;
    const fileCtor=w.File;
    assert(Boolean(savedBlob) && savedBlob instanceof blobCtor && savedBlob.size>0,'PROJECT_SAVE_SERIALIZED',{name:savedName,size:savedBlob?.size});
    const savedText=await savedBlob.text();
    const savedDoc=app.doc.constructor===Object
      ? JSON.parse(savedText)
      : JSON.parse(savedText);
    const sanitized=w.INK_TEST.sanitizeDocument
      ? w.INK_TEST.sanitizeDocument(savedDoc)
      : savedDoc;
    app.replaceDocument(sanitized);
    app.history.clear();
    app.dirty=false;
    assert(w.INK_TEST.documentIntegrity()?.passed===true && app.doc.formatVersion===4,'PROJECT_RELOAD_INTEGRITY',{formatVersion:app.doc.formatVersion,size:savedBlob.size});

    // INK-CHAT-GEOMETRY-OPS-001 — real-browser native geometry authority exposure.
    markRuntimeStage('FINAL_HEALTH');
    const health=w.INK_TEST.runtimeHealth?.();
    evidence.metrics.runtimeHealth=health;
    const fatalCount=Number(health?.errors?.fatal || health?.fatalErrors || health?.fatal || 0);
    assert(!Number.isFinite(fatalCount) || fatalCount===0,'NO_FATAL_RUNTIME_HEALTH_ERRORS',{fatalCount});
    const coveredPanels=new Set(panelStates.map(item=>item.id));
    assert(['properties','reference','compose','chat','revision'].every(id=>coveredPanels.has(id)),'WORKSTATION_SINGLE_PANEL_AUTHORITY',{panelStates});

    evidence.final={
      formatVersion:app.doc.formatVersion,
      directExtractionDefault:app.extraction?.diagnostics?.().directExtractionDefault,
      structureAwareOptional:app.extraction?.diagnostics?.().structureAwareOptional,
      conversationMessages:cw.conversationMessages.length,
      integrity:w.INK_TEST.documentIntegrity()
    };
    resultNode.dataset.state='PASS'; resultNode.textContent='PASS';
    logNode.textContent=JSON.stringify(evidence,null,2);
    document.documentElement.dataset.qa='PASS';
    await reportEvidence();
  }

  frame.addEventListener('load',async()=>{
    let watchdog=null;
    try{
      await Promise.race([
        run(),
        new Promise((_,reject)=>{
          watchdog=setTimeout(()=>reject(Object.assign(new Error('CREATIVE_STAGE_TIMEOUT'),{
            qa:'CREATIVE_STAGE_TIMEOUT',details:{stage:runtimeStage}
          })),300000);
        })
      ]);
    }catch(error){
      evidence.failures.push({message:error?.message||String(error),qa:error?.qa||null,details:error?.details||null,stack:error?.stack||null});
      resultNode.dataset.state='FAIL'; resultNode.textContent='FAIL';
      logNode.textContent=JSON.stringify(evidence,null,2);
      document.documentElement.dataset.qa='FAIL';
      try {
        await reportEvidence();
      } catch (reportError) {
        console.error('INK-CLOUD-018 QA result callback failed', reportError);
      }
    }finally{
      if(watchdog)clearTimeout(watchdog);
    }
  },{once:true});
})();
</script>

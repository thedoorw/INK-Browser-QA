<!doctype html>
<meta charset="utf-8">
<title>INK-TECH-CLOSURE-001 Browser Runtime QA</title>
<style>
body{font:14px/1.45 ui-monospace,Consolas,monospace;margin:18px}iframe{width:1200px;height:800px;border:1px solid #aaa}pre{white-space:pre-wrap}#qa-result[data-state="PASS"]{color:#08752f}#qa-result[data-state="FAIL"]{color:#a20d0d}
</style>
<h1>INK-TECH-CLOSURE-001 Browser Runtime QA</h1>
<strong id="qa-result" data-state="RUNNING">RUNNING</strong>
<pre id="qa-log"></pre>
<iframe id="ink-frame" src="/index.html?fresh=1&ink-qa=1"></iframe>
<script>
(() => {
  const resultNode=document.querySelector('#qa-result');
  const logNode=document.querySelector('#qa-log');
  const frame=document.querySelector('#ink-frame');
  const expectedOperations=[
  "path.repaint.v1",
  "path.material.apply.v1",
  "path.material.remove.v1",
  "object.translate.v1",
  "path.simplify.v1",
  "path.refine.v1",
  "path.create.v1",
  "path.edit.v1",
  "object.rotate.v1",
  "object.clone.v1",
  "repeat.radial.v1",
  "boolean.apply.v1",
  "group.create.v1",
  "object.reparent.v1",
  "frame.create.v1",
  "text.create.v1",
  "text.edit.v1",
  "svg.import.v1",
  "object.resize.v1",
  "object.scale.v1",
  "object.order.v1",
  "repeat.mirror.v1",
  "repeat.grid.v1",
  "layout.frame.set.v1",
  "layout.frame.remove.v1",
  "layout.item.set.v1",
  "layout.item.remove.v1",
  "component.register.v1",
  "component.instance.create.v1",
  "component.override.set.v1",
  "component.override.reset.v1",
  "component.instance.detach.v1",
  "component.definition.duplicate.v1",
  "component.reference.repair.v1"
];
  const evidence={
    task:'INK-TECH-CLOSURE-001',
    schema:'INK-TECH-CLOSURE-001-BROWSER-PROOF',
    version:1,
    formatVersion:4,
    status:'RUNNING',
    checks:[],
    failures:[],
    checkpoints:{}
  };
  const pass=(name,details={})=>{evidence.checks.push({name,...details,status:'PASS'});logNode.textContent=JSON.stringify(evidence,null,2);};
  const assert=(condition,name,details={})=>{if(!condition)throw Object.assign(new Error(name),{qa:name,details});pass(name,details);};
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function reportEvidence(){
    const response=await fetch('/__qa_result',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(evidence),
      cache:'no-store'
    });
    if(!response.ok)throw new Error('QA result callback failed: '+response.status);
  }
  async function ready(){
    for(let i=0;i<120;i++){
      const w=frame.contentWindow;
      if(w?.INK_APP?.inkPublicApi && w?.INK_TEST && w.INK_APP.history && w.INK_APP.revisions)return w;
      await wait(250);
    }
    throw new Error('INK runtime did not boot');
  }
  async function run(){
    const w=await ready(),app=w.INK_APP,inkApi=app.inkPublicApi;
    const readOnlySnapshot=()=>JSON.stringify({
      document:app.doc,
      history:{undo:app.history?.undoStack?.length||0,redo:app.history?.redoStack?.length||0,pending:Boolean(app.history?.pending)},
      revision:app.revisions?.revisionIdFor?.(app.doc?.id)??null
    });

    assert(w.INK_ARCHITECTURE?.formatVersion===4,'CLOSURE_FORMAT_VERSION_4',{value:w.INK_ARCHITECTURE?.formatVersion});
    const discovery=await inkApi.tools.invoke('get_ink_capabilities');
    const proposalOps=(discovery?.result?.capabilities||[])
      .filter(item=>item?.routingClass==='PROPOSAL_REQUIRED' && item?.namedTool==='propose_ink_edit' && /\.v1$/.test(item.id))
      .map(item=>item.id);
    assert(
      discovery?.status==='COMPLETED' &&
      JSON.stringify(proposalOps)===JSON.stringify(expectedOperations),
      'CLOSURE_EXACT_34_OPERATION_VOCABULARY',
      {operationCount:proposalOps.length,operations:proposalOps}
    );
    assert(
      discovery.result.namedTools?.length===21 &&
      discovery.result.namedTools[19]?.name==='import_ink_reference' &&
      discovery.result.namedTools[20]?.name==='export_ink_asset',
      'CLOSURE_NAMED_TOOL_APPEND_ONLY_21',
      {namedTools:discovery.result.namedTools?.map(item=>item.name)||[]}
    );
    assert(
      !discovery.result.capabilities.some(item=>item.id==='repeat.expand.v1' && item.availability===true),
      'CLOSURE_REPEAT_EXPAND_CORE_ONLY_BOUNDARY'
    );

    const geometryOperations=[
      'path.create.v1',
      'path.edit.v1',
      'object.rotate.v1',
      'object.clone.v1',
      'repeat.radial.v1',
      'boolean.apply.v1',
      'group.create.v1',
      'object.reparent.v1'
    ];
    const geometryDiscovery=await inkApi.tools.invoke('get_ink_capabilities');
    assert(
      geometryDiscovery?.status==='COMPLETED' &&
      geometryOperations.every(id=>geometryDiscovery.result.capabilities.some(capability=>capability.id===id && capability.availability===true)),
      'GEOMETRY_OPS_DISCOVERED',
      {operations:geometryOperations}
    );

    const geometryPageId=app.page().id;
    const geometryLayerId=app.layer().id;
    const geometryRef=objectId=>({pageId:geometryPageId,layerId:geometryLayerId,objectId});
    const geometryRuns=[];
    const executeGeometryPlan=async(label,steps,{checkBlocked=false}={})=>{
      const beforeProposal=readOnlySnapshot();
      const proposed=await inkApi.tools.invoke('use_ink',{
        action:'propose',
        plan:{schema:'INK-CHAT-CREATIVE-PLAN',version:1,intentSummary:label,steps}
      });
      assert(
        proposed?.status==='PROPOSED' &&
        Boolean(proposed?.result?.planId) &&
        readOnlySnapshot()===beforeProposal,
        'GEOMETRY_OPS_PROPOSAL_MUTATION_NEUTRAL',
        {label,status:proposed?.status}
      );
      if(checkBlocked){
        const blockedBefore=readOnlySnapshot();
        const blocked=await inkApi.tools.invoke('use_ink',{
          action:'execute',planId:proposed.result.planId,approvalToken:'not-approved'
        });
        assert(
          blocked?.status==='FAILED' &&
          blocked?.diagnostics?.[0]?.code==='CHAT_PLAN_APPROVAL_REQUIRED' &&
          readOnlySnapshot()===blockedBefore,
          'GEOMETRY_OPS_EXECUTE_BLOCKED_BEFORE_APPROVAL',
          {label,code:blocked?.diagnostics?.[0]?.code||null}
        );
      }
      const approved=await inkApi.tools.invoke('use_ink',{action:'approve',planId:proposed.result.planId});
      assert(
        approved?.status==='APPROVED' &&
        /^INK-LOCAL-PLAN-APPROVAL:/.test(approved?.result?.approvalToken||''),
        'GEOMETRY_OPS_EXPLICIT_APPROVAL',
        {label,planId:proposed.result.planId}
      );
      const executed=await inkApi.tools.invoke('use_ink',{
        action:'execute',
        planId:proposed.result.planId,
        approvalToken:approved.result.approvalToken
      });
      assert(
        executed?.status==='COMPLETED' &&
        executed?.result?.stepResults?.length===steps.length &&
        executed.result.stepResults.every(step=>step.ok===true && step.changed===true),
        'GEOMETRY_OPS_PLAN_EXECUTED',
        {label,status:executed?.status,steps:executed?.result?.stepResults}
      );
      geometryRuns.push({label,proposed,approved,executed});
      return executed;
    };
    const geometryTargetFromStep=(executed,stepId)=>{
      const step=executed?.result?.stepResults?.find(item=>item.stepId===stepId);
      const target=step?.targets?.[0];
      return target?.ref||target||null;
    };

    const geometryCreate=await executeGeometryPlan('Geometry Ops 001 · create native construction geometry',[
      {
        stepId:'geo-create-module',
        operation:'path.create.v1',
        targets:[],
        arguments:{
          shape:'path',objectId:'qa-geometry-module',name:'QA Geometry Module',fill:'none',stroke:'#202020',strokeWidth:1.5,
          subpaths:[{role:'outer',closed:true,anchors:[
            {x:400,y:190},{x:420,y:220},{x:400,y:260},{x:380,y:220}
          ]}]
        },
        dependsOn:[]
      },
      {
        stepId:'geo-create-circle',
        operation:'path.create.v1',
        targets:[],
        arguments:{shape:'circle',objectId:'qa-geometry-circle',name:'QA Geometry Circle',cx:480,cy:220,r:18,fill:'none',stroke:'#202020',strokeWidth:1.5},
        dependsOn:[]
      },
      {
        stepId:'geo-create-boolean-a',
        operation:'path.create.v1',
        targets:[],
        arguments:{shape:'rectangle',objectId:'qa-geometry-bool-a',name:'QA Boolean A',x:540,y:195,width:42,height:42,fill:'#d8d8d8',stroke:'#202020',strokeWidth:1},
        dependsOn:[]
      },
      {
        stepId:'geo-create-boolean-b',
        operation:'path.create.v1',
        targets:[],
        arguments:{shape:'rectangle',objectId:'qa-geometry-bool-b',name:'QA Boolean B',x:560,y:205,width:42,height:42,fill:'#d8d8d8',stroke:'#202020',strokeWidth:1},
        dependsOn:[]
      }
    ],{checkBlocked:true});
    assert(
      ['qa-geometry-module','qa-geometry-circle','qa-geometry-bool-a','qa-geometry-bool-b'].every(id=>app.findObject(geometryRef(id))?.object?.type==='path'),
      'GEOMETRY_OPS_CREATE_EXECUTED'
    );

    const geometryEditRotate=await executeGeometryPlan('Geometry Ops 001 · edit Path and rotate around explicit center',[
      {
        stepId:'geo-edit-anchor',
        operation:'path.edit.v1',
        targets:[geometryRef('qa-geometry-module')],
        arguments:{action:'move-anchor',subpathIndex:0,anchorIndex:0,x:400,y:182},
        dependsOn:[]
      },
      {
        stepId:'geo-rotate-module',
        operation:'object.rotate.v1',
        targets:[geometryRef('qa-geometry-module')],
        arguments:{degrees:30,center:{x:400,y:220}},
        dependsOn:['geo-edit-anchor']
      }
    ]);
    const geometryModule=app.findObject(geometryRef('qa-geometry-module'))?.object;
    assert(
      geometryModule?.subpaths?.[0]?.anchors?.[0]?.y===182,
      'GEOMETRY_OPS_PATH_EDIT_EXECUTED',
      {anchor:geometryModule?.subpaths?.[0]?.anchors?.[0]}
    );
    assert(
      Array.isArray(geometryModule?.matrix) && Math.abs(geometryModule.matrix[1])>0.1,
      'GEOMETRY_OPS_ROTATE_EXECUTED',
      {matrix:geometryModule?.matrix}
    );

    const geometryCloneRepeat=await executeGeometryPlan('Geometry Ops 001 · clone module and create radial Repeat',[
      {
        stepId:'geo-clone-module',
        operation:'object.clone.v1',
        targets:[geometryRef('qa-geometry-module')],
        arguments:{dx:58,dy:0},
        dependsOn:[]
      },
      {
        stepId:'geo-repeat-module',
        operation:'repeat.radial.v1',
        targets:[geometryRef('qa-geometry-module')],
        arguments:{count:8,center:{x:400,y:220},sweep:360,startAngle:0,linked:true},
        dependsOn:[]
      }
    ]);
    const geometryCloneRef=geometryTargetFromStep(geometryCloneRepeat,'geo-clone-module');
    const geometryRepeatRef=geometryTargetFromStep(geometryCloneRepeat,'geo-repeat-module');
    const geometryClone=geometryCloneRef?app.findObject(geometryCloneRef)?.object:null;
    const geometryRepeat=geometryRepeatRef?app.findObject(geometryRepeatRef)?.object:null;
    assert(
      Boolean(geometryCloneRef && geometryClone) &&
      geometryClone.id!=='qa-geometry-module' &&
      geometryClone.metadata?.composition?.duplicatedFromObjectId==='qa-geometry-module',
      'GEOMETRY_OPS_CLONE_EXECUTED',
      {cloneRef:geometryCloneRef,lineage:geometryClone?.metadata?.composition}
    );
    assert(
      geometryRepeat?.type==='repeat' &&
      geometryRepeat.count===8 &&
      geometryRepeat.instances?.length===8,
      'GEOMETRY_OPS_RADIAL_REPEAT_EXECUTED',
      {repeatRef:geometryRepeatRef,count:geometryRepeat?.count,instances:geometryRepeat?.instances?.length}
    );

    const geometryBoolean=await executeGeometryPlan('Geometry Ops 001 · Boolean and independent native transform',[
      {
        stepId:'geo-boolean-union',
        operation:'boolean.apply.v1',
        targets:[geometryRef('qa-geometry-bool-a'),geometryRef('qa-geometry-bool-b')],
        arguments:{operation:'union',name:'QA Geometry Union',tolerance:0.65},
        dependsOn:[]
      },
      {
        stepId:'geo-rotate-circle',
        operation:'object.rotate.v1',
        targets:[geometryRef('qa-geometry-circle')],
        arguments:{degrees:12,center:{x:480,y:220}},
        dependsOn:[]
      }
    ]);
    const geometryBooleanRef=geometryTargetFromStep(geometryBoolean,'geo-boolean-union');
    assert(
      Boolean(geometryBooleanRef && app.findObject(geometryBooleanRef)?.object?.type==='path') &&
      !app.findObject(geometryRef('qa-geometry-bool-a')) &&
      !app.findObject(geometryRef('qa-geometry-bool-b')),
      'GEOMETRY_OPS_BOOLEAN_EXECUTED',
      {resultRef:geometryBooleanRef}
    );

    const geometryGroup=await executeGeometryPlan('Geometry Ops 001 · group reusable module objects',[
      {
        stepId:'geo-group-module',
        operation:'group.create.v1',
        targets:[geometryRef('qa-geometry-circle'),geometryCloneRef],
        arguments:{name:'QA Geometry Module Group'},
        dependsOn:[]
      },
      {
        stepId:'geo-rotate-module-again',
        operation:'object.rotate.v1',
        targets:[geometryRef('qa-geometry-module')],
        arguments:{degrees:5,center:{x:400,y:220}},
        dependsOn:[]
      }
    ]);
    const geometryGroupRef=geometryTargetFromStep(geometryGroup,'geo-group-module');
    const geometryGroupObject=geometryGroupRef?app.findObject(geometryGroupRef)?.object:null;
    assert(
      geometryGroupObject?.type==='group' &&
      geometryGroupObject.children?.some(child=>child.id===geometryCloneRef.objectId) &&
      geometryGroupObject.children?.some(child=>child.id==='qa-geometry-circle'),
      'GEOMETRY_OPS_GROUP_EXECUTED',
      {groupRef:geometryGroupRef,children:geometryGroupObject?.children?.map(child=>child.id)}
    );

    const geometryReparent=await executeGeometryPlan('Geometry Ops 001 · reparent grouped child through native hierarchy',[
      {
        stepId:'geo-reparent-clone',
        operation:'object.reparent.v1',
        targets:[geometryCloneRef],
        arguments:{parentObjectId:null,targetLayerId:geometryLayerId},
        dependsOn:[]
      },
      {
        stepId:'geo-final-rotate',
        operation:'object.rotate.v1',
        targets:[geometryRef('qa-geometry-module')],
        arguments:{degrees:-5,center:{x:400,y:220}},
        dependsOn:[]
      }
    ]);
    const geometryReparentRef=geometryTargetFromStep(geometryReparent,'geo-reparent-clone');
    const geometryReparentFound=geometryReparentRef?app.findObject(geometryReparentRef):null;
    assert(
      Boolean(geometryReparentFound) &&
      !geometryReparentFound.parentObject &&
      geometryReparentFound.layer.id===geometryLayerId,
      'GEOMETRY_OPS_REPARENT_EXECUTED',
      {ref:geometryReparentRef,parentId:geometryReparentFound?.parentObject?.id||null}
    );

    const geometryHistory=await inkApi.tools.invoke('get_ink_history');
    const geometryHistorySteps=geometryRuns.flatMap(run=>run.executed?.historyReceipt?.steps||[]);
    assert(
      geometryHistory?.status==='COMPLETED' &&
      geometryHistorySteps.length===14 &&
      geometryHistorySteps.every(step=>Boolean(step.history) &&
        Number.isInteger(step.history.beforeUndoCount) &&
        step.history.afterUndoCount===step.history.beforeUndoCount+1) &&
      Number(geometryHistory.result?.applied)>=14,
      'GEOMETRY_OPS_HISTORY_RECORDED',
      {stepCount:geometryHistorySteps.length,applied:geometryHistory.result?.applied}
    );
    const geometryRevisionReceipts=geometryRuns.map(run=>run.executed?.revisionReceipt).filter(Boolean);
    const geometryFinalRevision=app.revisions.revisionIdFor(app.doc.id);
    assert(
      geometryRevisionReceipts.length===6 &&
      geometryRevisionReceipts.every(receipt=>receipt.captureSkipped===null && receipt.endingRevisionId!==receipt.startingRevisionId) &&
      geometryRevisionReceipts.at(-1)?.endingRevisionId===geometryFinalRevision,
      'GEOMETRY_OPS_REVISION_CAPTURED',
      {revisionCount:geometryRevisionReceipts.length,finalRevision:geometryFinalRevision}
    );
    const geometryPreview=await inkApi.tools.invoke('get_ink_preview',{scope:'content',maxDimension:960,background:true});
    assert(
      geometryPreview?.status==='COMPLETED' &&
      geometryPreview.outputHandles?.length===1 &&
      geometryPreview.outputHandles[0].revisionId===geometryFinalRevision,
      'GEOMETRY_OPS_PREVIEW_CAPTURED',
      {handle:geometryPreview?.outputHandles?.[0]||null}
    );
    evidence.geometryOps={
      schema:'INK-CHAT-GEOMETRY-OPS-PROOF',
      version:1,
      operations:geometryOperations,
      planCount:geometryRuns.length,
      stepCount:geometryHistorySteps.length,
      cloneRef:geometryCloneRef,
      repeatRef:geometryRepeatRef,
      booleanRef:geometryBooleanRef,
      groupRef:geometryGroupRef,
      reparentRef:geometryReparentRef,
      finalRevisionId:geometryFinalRevision,
      previewHandle:geometryPreview.outputHandles[0]
    };
    pass('GEOMETRY_OPS_GATE_PASS',{
      gate:'CHAT_NATIVE_GEOMETRY_OPS_V01',
      operationCount:geometryOperations.length,
      planCount:geometryRuns.length,
      historySteps:geometryHistorySteps.length,
      revisionCount:geometryRevisionReceipts.length
    });

    // INK-TECH-CLOSURE-001 C2-A — real-browser exposure proof, executed only in the final closure Runtime batch.
    const c2aOperations=[
      'frame.create.v1',
      'text.create.v1',
      'text.edit.v1',
      'svg.import.v1',
      'object.resize.v1',
      'object.scale.v1',
      'object.order.v1'
    ];
    const c2aDiscovery=await inkApi.tools.invoke('get_ink_capabilities');
    assert(
      c2aDiscovery?.status==='COMPLETED' &&
      c2aOperations.every(id=>c2aDiscovery.result.capabilities.some(capability=>capability.id===id && capability.availability===true)) &&
      c2aDiscovery.result.namedTools.some(tool=>tool.name==='export_ink_asset' && tool.availability===true),
      'C2A_CAPABILITIES_DISCOVERED',
      {operations:c2aOperations,namedTools:c2aDiscovery?.result?.namedTools?.map(tool=>tool.name)||[]}
    );

    const c2aPageId=app.page().id;
    const c2aLayerId=app.layer().id;
    const c2aRef=objectId=>({pageId:c2aPageId,layerId:c2aLayerId,objectId});
    const c2aRuns=[];
    const executeC2APlan=async(label,steps,{checkBlocked=false}={})=>{
      const beforeProposal=readOnlySnapshot();
      const proposed=await inkApi.tools.invoke('use_ink',{
        action:'propose',
        plan:{schema:'INK-CHAT-CREATIVE-PLAN',version:1,intentSummary:label,steps}
      });
      assert(
        proposed?.status==='PROPOSED' &&
        Boolean(proposed?.result?.planId) &&
        readOnlySnapshot()===beforeProposal,
        'C2A_PROPOSAL_MUTATION_NEUTRAL',
        {label,status:proposed?.status}
      );
      if(checkBlocked){
        const blockedBefore=readOnlySnapshot();
        const blocked=await inkApi.tools.invoke('use_ink',{
          action:'execute',planId:proposed.result.planId,approvalToken:'not-approved'
        });
        assert(
          blocked?.status==='FAILED' &&
          blocked?.diagnostics?.[0]?.code==='CHAT_PLAN_APPROVAL_REQUIRED' &&
          readOnlySnapshot()===blockedBefore,
          'C2A_EXECUTE_BLOCKED_BEFORE_APPROVAL',
          {label,code:blocked?.diagnostics?.[0]?.code||null}
        );
      }
      const approved=await inkApi.tools.invoke('use_ink',{action:'approve',planId:proposed.result.planId});
      assert(
        approved?.status==='APPROVED' &&
        /^INK-LOCAL-PLAN-APPROVAL:/.test(approved?.result?.approvalToken||''),
        'C2A_EXPLICIT_APPROVAL',
        {label,planId:proposed.result.planId}
      );
      const executed=await inkApi.tools.invoke('use_ink',{
        action:'execute',
        planId:proposed.result.planId,
        approvalToken:approved.result.approvalToken
      });
      assert(
        executed?.status==='COMPLETED' &&
        executed?.result?.stepResults?.length===steps.length &&
        executed.result.stepResults.every(step=>step.ok===true && step.changed===true),
        'C2A_PLAN_EXECUTED',
        {label,status:executed?.status,steps:executed?.result?.stepResults}
      );
      c2aRuns.push({label,proposed,approved,executed});
      return executed;
    };
    const c2aTargetFromStep=(executed,stepId)=>{
      const step=executed?.result?.stepResults?.find(item=>item.stepId===stepId);
      const target=step?.targets?.[0];
      return target?.ref||target||null;
    };

    const c2aCreate=await executeC2APlan('Closure C2-A · create Frame, Text and structured SVG',[
      {
        stepId:'c2a-create-frame',
        operation:'frame.create.v1',
        targets:[],
        arguments:{name:'QA C2-A Frame',x:650,y:160,width:140,height:100,opacity:1},
        dependsOn:[]
      },
      {
        stepId:'c2a-create-text',
        operation:'text.create.v1',
        targets:[],
        arguments:{text:'C2-A',x:670,y:210,color:'#202020',fontFamily:'system-ui',fontSize:24,lineHeight:1.25,fontWeight:600},
        dependsOn:[]
      },
      {
        stepId:'c2a-import-svg',
        operation:'svg.import.v1',
        targets:[],
        arguments:{svg:'<svg xmlns="http://www.w3.org/2000/svg"><rect id="qa-c2a-svg-path" x="830" y="180" width="48" height="36" fill="#d8d8d8" stroke="#202020"/></svg>'},
        dependsOn:[]
      }
    ],{checkBlocked:true});

    const c2aFrameRef=c2aTargetFromStep(c2aCreate,'c2a-create-frame');
    const c2aTextRef=c2aTargetFromStep(c2aCreate,'c2a-create-text');
    const c2aSvgRef=c2aRef('qa-c2a-svg-path');
    assert(
      app.findObject(c2aFrameRef)?.object?.type==='frame' &&
      app.findObject(c2aTextRef)?.object?.type==='text' &&
      app.findObject(c2aSvgRef)?.object?.type==='path',
      'C2A_NATIVE_OBJECTS_CREATED',
      {frameRef:c2aFrameRef,textRef:c2aTextRef,svgRef:c2aSvgRef}
    );

    const c2aTransform=await executeC2APlan('Closure C2-A · edit Text, resize Frame, scale SVG and reorder',[
      {
        stepId:'c2a-edit-text',
        operation:'text.edit.v1',
        targets:[c2aTextRef],
        arguments:{text:'C2-A edited',fontSize:28,color:'#303030',x:680},
        dependsOn:[]
      },
      {
        stepId:'c2a-resize-frame',
        operation:'object.resize.v1',
        targets:[c2aFrameRef],
        arguments:{width:180,height:120,preserveAspect:false},
        dependsOn:[]
      },
      {
        stepId:'c2a-scale-svg',
        operation:'object.scale.v1',
        targets:[c2aSvgRef],
        arguments:{sx:1.25,sy:0.75,center:{x:830,y:180}},
        dependsOn:[]
      },
      {
        stepId:'c2a-order-back',
        operation:'object.order.v1',
        targets:[c2aTextRef,c2aSvgRef],
        arguments:{action:'back'},
        dependsOn:['c2a-edit-text','c2a-scale-svg']
      }
    ]);

    const c2aFrame=app.findObject(c2aFrameRef)?.object;
    const c2aText=app.findObject(c2aTextRef)?.object;
    const c2aSvg=app.findObject(c2aSvgRef)?.object;
    assert(
      c2aFrame?.width===180 && c2aFrame?.height===120 &&
      c2aText?.text==='C2-A edited' && c2aText?.fontSize===28 &&
      Array.isArray(c2aSvg?.matrix) && Math.abs(c2aSvg.matrix[0]-1)>0.01,
      'C2A_MUTATIONS_USE_NATIVE_AUTHORITIES',

    const finalDiscovery=await inkApi.tools.invoke('get_ink_capabilities');
    const finalOps=(finalDiscovery?.result?.capabilities||[])
      .filter(item=>item?.routingClass==='PROPOSAL_REQUIRED' && item?.namedTool==='propose_ink_edit' && /\.v1$/.test(item.id))
      .map(item=>item.id);
    assert(JSON.stringify(finalOps)===JSON.stringify(expectedOperations),'CLOSURE_CAPABILITY_DISCOVERY_STABLE_AFTER_EXECUTION');

    evidence.checkpoints={
      c1:{status:'PASS',operations:geometryOperations},
      c2a:{status:'PASS',operations:c2aOperations},
      c2b:{status:'PASS',operations:c2bOperations,repeatExpand:'CORE_ONLY_ACCEPTED'},
      c2c:{status:'PASS',operations:c2cOperations}
    };
    evidence.final={
      boundedOperationCount:finalOps.length,
      namedToolCount:finalDiscovery.result.namedTools.length,
      historyApplied:finalHistory.result.applied,
      revisionId:app.revisions?.revisionIdFor?.(app.doc?.id)??null
    };
    evidence.status='PASS';
    pass('CLOSURE_GATE_PASS',{
      operationCount:finalOps.length,
      namedToolCount:finalDiscovery.result.namedTools.length,
      historyApplied:finalHistory.result.applied
    });
    resultNode.dataset.state='PASS';resultNode.textContent='PASS';
    logNode.textContent=JSON.stringify(evidence,null,2);
    document.documentElement.dataset.qa='PASS';
    await reportEvidence();
  }

  frame.addEventListener('load',()=>run().catch(async error=>{
    evidence.status='FAIL';
    evidence.failures.push({message:error?.message||String(error),qa:error?.qa||null,details:error?.details||null,stack:error?.stack||null});
    resultNode.dataset.state='FAIL';resultNode.textContent='FAIL';
    logNode.textContent=JSON.stringify(evidence,null,2);
    document.documentElement.dataset.qa='FAIL';
    try{await reportEvidence();}catch(reportError){console.error('Closure QA result callback failed',reportError);}
  }),{once:true});
})();
</script>

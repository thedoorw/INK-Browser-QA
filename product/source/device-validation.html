<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INK v1.5.1 RC · HP x360 Device Validation</title><style>body{margin:0;background:#eeece7;color:#27302f;font:14px "Segoe UI","Noto Sans TC","Microsoft JhengHei",Roboto,system-ui,sans-serif}main{max-width:920px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #d6d2ca;border-radius:12px;padding:18px;margin:14px 0}h1{font-size:24px}canvas{width:100%;height:260px;border:1px solid #c8c4bc;border-radius:8px;touch-action:none;background:#fff}label{display:grid;gap:5px;margin:10px 0}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #bbb;border-radius:6px}button{background:#284b47;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.status{font-family:ui-monospace,monospace}.warning{color:#8b4d28}</style></head>
<body><main><h1>INK v1.5.1 RC · Device Validation Mode</h1><p class="warning">HP x360 與 MPP 觸控筆實測及手感評分均為 DEFERRED／USER VALIDATION REQUIRED。</p>
<section class="card"><h2>1. 指定測試筆畫</h2><div class="grid"><label>裝置名稱<input id="device" value="HP x360 + MPP Stylus"></label><label>測試<select id="pattern"></select></label></div><canvas id="pad" width="860" height="260"></canvas><div class="grid"><button id="start">開始此項量測</button><button id="finish">完成並加入 Device Report</button></div><p id="status" class="status">NOT MEASURED</p></section>
<section class="card"><h2>2. 完成線稿或局部花卉</h2><p>請直接在上方測試區完成一段花瓣、葉片與長莖線條，或返回 INK 主畫布完成作品。</p></section>
<section class="card"><h2>3. 人工評分（1–5）</h2><div id="ratings" class="grid"></div><label>補充說明<textarea id="notes" rows="4"></textarea></label></section>
<section class="card"><h2>4. 匯出測試包</h2><button id="export">匯出 HP x360 使用者驗證包</button><p>匯出不代表 APPROVED；最終決策維持 VALIDATION REQUIRED，直到你親自確認。</p></section></main>
<script type="module">
import { StylusTestRecorder, STYLUS_TEST_PATTERNS } from './src/input/stylus-test.js';
import { CalibrationProfileStore } from './src/input/device-validation.js';
const labels=['起筆','收筆','壓力控制','延遲','抖動','轉折','長筆畫穩定度','快速筆畫跟手性','傾斜作用','擦除','手掌誤觸','整體手感'],reports=[],pattern=document.querySelector('#pattern'),pad=document.querySelector('#pad'),ctx=pad.getContext('2d'),store=new CalibrationProfileStore({storage:localStorage});let active=null,drawing=false;
for(const value of STYLUS_TEST_PATTERNS){const option=document.createElement('option');option.value=value;option.textContent=value;pattern.append(option);}for(const label of labels){const field=document.createElement('label');field.textContent=label;field.innerHTML+=`<input data-rating="${label}" type="number" min="1" max="5" placeholder="1–5">`;document.querySelector('#ratings').append(field);}
const point=event=>{const box=pad.getBoundingClientRect();return{x:(event.clientX-box.left)*pad.width/box.width,y:(event.clientY-box.top)*pad.height/box.height};};
pad.addEventListener('pointerdown',event=>{drawing=true;pad.setPointerCapture(event.pointerId);active?.addPointerEvent(event);const p=point(event);ctx.beginPath();ctx.moveTo(p.x,p.y);});pad.addEventListener('pointermove',event=>{if(!drawing)return;for(const item of event.getCoalescedEvents?.()||[event])active?.addPointerEvent(item);const p=point(event);ctx.lineTo(p.x,p.y);ctx.lineWidth=Math.max(1,(event.pressure||.5)*10);ctx.strokeStyle='#263f3c';ctx.lineCap='round';ctx.stroke();active?.addFrame();});const end=event=>{if(!drawing)return;drawing=false;active?.addPointerEvent(event);};pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
document.querySelector('#start').onclick=()=>{ctx.clearRect(0,0,pad.width,pad.height);active=new StylusTestRecorder({deviceInfo:{deviceName:document.querySelector('#device').value,browser:navigator.userAgent,os:navigator.platform},calibrationProfile:store.active()});active.start(pattern.value);document.querySelector('#status').textContent='MEASURING';};document.querySelector('#finish').onclick=()=>{if(!active)return;const report=active.finish();reports.push(report);document.querySelector('#status').textContent=`${report.samplingFrequencyHz} Hz · Pressure ${report.pressureRange.join('–')} · ${report.manual.overallFeel}`;active=null;};document.querySelector('#export').onclick=()=>{const ratings=Object.fromEntries([...document.querySelectorAll('[data-rating]')].map(input=>[input.dataset.rating,input.value?Number(input.value):'USER VALIDATION REQUIRED'])),value={format:'INK-HP-X360-USER-VALIDATION-PACKAGE',schemaVersion:1,device:document.querySelector('#device').value,reports,calibrationProfile:store.active(),ratings,notes:document.querySelector('#notes').value,professionalArtworkQuality:'USER VALIDATION REQUIRED',finalDecision:'VALIDATION REQUIRED'};const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='INK_HP_x360_User_Validation_Package.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
